<text x="40" y="54" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#9FB3C4">塔位 标准 9 / 支援 4 / 修饰 1　｜　路径 约 35s × 2（并行）　｜　事件槽 2　｜　推荐章节 第 3 章　｜　双入口（双流可用）</text>
