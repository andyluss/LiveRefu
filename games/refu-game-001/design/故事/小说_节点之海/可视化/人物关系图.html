<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《节点之海》人物关系图</title>
<style>
:root{--bg:#fff;--fg:#111827;--muted:#6b7280;--border:#e5e7eb;--card:#fff;--accent:#2563eb;--s1:#2563eb;--s2:#0d9488;--s3:#d97706;--s4:#7c3aed;--s5:#dc2626;--s6:#0891b2}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--fg:#e6edf7;--muted:#94a3b8;--border:#1f2a3a;--card:#0f172a;--accent:#60a5fa;--s1:#60a5fa;--s2:#2dd4bf;--s3:#fbbf24;--s4:#a78bfa;--s5:#f87171;--s6:#22d3ee}}
*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--bg);color:var(--fg);font:14px/1.65 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:1060px;margin:0 auto}h1{font-size:19px;margin:0 0 4px}.sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--fg);cursor:pointer;transition:.15s}
button:hover{border-color:var(--accent)}button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
svg{width:100%;height:auto;display:block;overflow:visible}
.node{cursor:pointer}.node circle{transition:opacity .2s,stroke-width .2s}.node text{fill:var(--fg);font-size:12px;text-anchor:middle;pointer-events:none}
.node .init{font-size:13px;font-weight:600;fill:var(--bg)}.cluster{fill:var(--muted);font-size:11px;letter-spacing:.06em}
.dim{opacity:.14}.edge{transition:opacity .2s,stroke-width .2s}.elabel{font-size:11px;fill:var(--fg);text-anchor:middle}.elabel-bg{fill:var(--bg);opacity:.94}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.panel{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:12px;min-height:78px;background:var(--card)}
.panel h4{margin:0 0 6px;font-size:13.5px}.panel p{margin:2px 0;font-size:12.5px;color:var(--muted)}.panel ul{margin:8px 0 0;padding-left:18px;font-size:12.5px}.panel .meta{color:var(--muted);font-size:12px}
@keyframes inn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}.anim{animation:inn .35s ease-out both;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.anim{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<h1>《节点之海》人物关系图</h1>
<div class="sub">圆色＝阵营，线型＝关系类型；点人物看关系轴，用「推进到」按卷展开。数据源：00_设定圣经 / 01_分卷与章节大纲 / 02_人物关系图。</div>
<div class="controls" id="vols" role="group" aria-label="推进到哪一卷"></div>
<svg id="svg" viewBox="0 0 960 560" role="img" aria-label="人物关系图"></svg>
<div class="legend" id="legend"></div>
<div class="panel" id="panel"></div>
</div>
<script>
(function(){
var FACTION={'铁砧联邦':'var(--s1)','齿轮帮':'var(--s4)','涌潮虫群':'var(--s2)','星辉议会':'var(--s3)','自由 / 远征':'var(--s5)'};
var NODES=[
{id:'xielin',name:'谢临',faction:'铁砧联邦',vol:1,x:470,y:275,r:27,role:'铁砧联邦调度官 → 混编协调调度官 → 自由调度官',note:'全书唯一视角。第 1 章报到就把开局能量全砸在一座塔上；第 7 章漏满三只失守；第 40 章把名字写进「完成 8 节点」第一行。'},
{id:'keling',name:'柯岭',faction:'铁砧联邦',vol:1,x:300,y:180,r:20,role:'谢临的副官（人类）',note:'报波次、按纸图；第 7 章以值班记录替她挡下军法问责；第 38 章第一次说「这次我觉得能过」。'},
{id:'tangli',name:'唐砺',faction:'铁砧联邦',vol:1,x:200,y:320,r:20,role:'铁砧教官（短篇《火线换装》主角）',note:'一句「你漏了谁」贯穿卷一；第 8 章以自己当年的失守记录替她担保；第 32 章补全「只有你自己昨天的记录」。'},
{id:'maoding',name:'铆钉',faction:'齿轮帮',vol:1,x:355,y:425,r:20,role:'齿轮帮·维修工（铁砧从族）',note:'抱油壶修塔，左眼焊疤；口头禅在第 40 章被改写为「带不到明天，就修到别人手里」。'},
{id:'cheng',name:'秤',faction:'齿轮帮',vol:1,x:505,y:458,r:20,role:'齿轮帮·搬运工（铁砧从族）',note:'三条腿、木托盘、护目镜；第 30 章 BOSS 阶段技中倒下，战报把它的类别从「消耗品」改成「人员」。'},
{id:'ya',name:'芽',faction:'涌潮虫群',vol:2,x:640,y:498,r:20,role:'孢子侍从（涌潮从族）',note:'第 10 章把柯岭身上的腐蚀层数「搬进菌毯」；说话像发芽一样慢。'},
{id:'tai',name:'苔',faction:'涌潮虫群',vol:2,x:745,y:430,r:20,role:'涌潮侧调度官',note:'沉默寡言，以窄纸条代口；只借谢临三张卡；卷三门口那句「他们会先看你的族徽，再看你的账」。'},
{id:'wo',name:'涡',faction:'涌潮虫群',vol:2,x:848,y:368,r:20,role:'涌潮侧调度官',note:'第 11 章当面骂她「外族人」；第 15 章把三张族专属卡推给她选——她挑了最难用的那张。'},
{id:'wenzhao',name:'闻昭',faction:'星辉议会',vol:3,x:772,y:172,r:20,role:'星辉议会调度官（短篇《共鸣的间隙》主角）',note:'一个信共鸣、一个信账本；第 20 章对练打平，约定「下次换你的卡组」；第 24 章「下一次我不站议会」。'},
{id:'kaoguan',name:'星辉考官',faction:'星辉议会',vol:3,x:888,y:268,r:20,role:'袖口三道棱的老调度官（不具名）',note:'把她钉在三号位，也在第 19 章递出铅笔；第 27 章唯一没在补洞方案上签字的人，第 31 章的坐标证据指向他。'},
{id:'leng',name:'棱',faction:'星辉议会',vol:4,x:660,y:300,r:20,role:'光尘侍从·记录员（星辉从族）',note:'第 29 章首次登场，棱面映字、语气像档案；第 37 章说明记录片由远征台按编号自动刻录。'},
{id:'ali',name:'阿砾',faction:'自由 / 远征',vol:3,x:560,y:78,r:20,role:'自由调度官，走东线',note:'只报数字；第 22 章留下「你的支援位放晚了半波」，第 37 章推出东线纸图，第 39 章被证明她已改掉。'},
{id:'weiduo',name:'卫铎',faction:'自由 / 远征',vol:3,x:828,y:88,r:18,role:'随队观测（尚未正面照面）',note:'第 13 章出现在增援名单，第 14 章铅笔圈、第 23 章抄录段号都与他有关；线索止于第 31 章证据链。'}];
var EDGES=[
{a:'xielin',b:'keling',kind:'僚属',vol:1,label:'副官：报波次、第 7 章挡问责'},
{a:'xielin',b:'tangli',kind:'僚属',vol:1,label:'师徒：第 8 章担保、第 32 章送行'},
{a:'xielin',b:'maoding',kind:'从族',vol:1,label:'维修位：「带不到明天」暗线'},
{a:'xielin',b:'cheng',kind:'从族',vol:1,label:'支援位：第 30 章倒下后改称「人员」'},
{a:'maoding',b:'cheng',kind:'同族',vol:1,label:'齿轮帮同班组'},
{a:'xielin',b:'ya',kind:'从族',vol:2,label:'第 10 章替柯岭搬走腐蚀层数'},
{a:'ya',b:'tai',kind:'同族',vol:2,label:'孢子侍从随涌潮出战'},
{a:'tai',b:'wo',kind:'同族',vol:2,label:'一个沉默、一个聒噪'},
{a:'xielin',b:'tai',kind:'借卡',vol:2,label:'只借三张卡（第 11 章）'},
{a:'xielin',b:'wo',kind:'对手',vol:2,label:'「外族人」→ 第 15 章推卡给她选'},
{a:'xielin',b:'wenzhao',kind:'盟友',vol:3,label:'对练打平：「下次换你的卡组」'},
{a:'xielin',b:'kaoguan',kind:'对手',vol:3,label:'三号位与递铅笔；第 27 章未签字'},
{a:'xielin',b:'ali',kind:'同行',vol:3,label:'竞争对手：「支援位放晚了半波」'},
{a:'xielin',b:'leng',kind:'从族',vol:4,label:'记录席：题栏与取用次数'},
{a:'kaoguan',b:'weiduo',kind:'暗线',vol:3,label:'读取记录抄件与铅笔圈'},
{a:'leng',b:'ali',kind:'暗线',vol:5,label:'「今日已通关」的错位登记'}];
var KS={'僚属':{c:'var(--s1)',d:''},'从族':{c:'var(--s4)',d:'5 4'},'同族':{c:'var(--s4)',d:'2 4'},'借卡':{c:'var(--s2)',d:'5 4'},'对手':{c:'var(--s3)',d:''},'盟友':{c:'var(--s2)',d:''},'同行':{c:'var(--s5)',d:'7 4'},'暗线':{c:'var(--s6)',d:'2 3'}};
var VOLS=[{v:0,label:'全部',span:'40 章'},{v:1,label:'推进到卷一',span:'1–8'},{v:2,label:'推进到卷二',span:'9–16'},{v:3,label:'推进到卷三',span:'17–24'},{v:4,label:'推进到卷四',span:'25–32'},{v:5,label:'推进到卷五',span:'33–40'}];
var st={vol:0,focus:null,anim:true},NS='http://www.w3.org/2000/svg';
var svg=document.getElementById('svg'),panel=document.getElementById('panel'),vbox=document.getElementById('vols'),lbox=document.getElementById('legend');
function byId(id){for(var i=0;i<NODES.length;i++)if(NODES[i].id===id)return NODES[i];return null}
function vn(){return NODES.filter(function(n){return st.vol===0||n.vol<=st.vol})}
function ve(){var m={};vn().forEach(function(n){m[n.id]=1});return EDGES.filter(function(e){return m[e.a]&&m[e.b]&&(st.vol===0||e.vol<=st.vol)})}
function inc(id){return ve().filter(function(e){return e.a===id||e.b===id})}
function E(t,a,x){var n=document.createElementNS(NS,t);for(var k in a)n.setAttribute(k,a[k]);if(x!=null)n.textContent=x;return n}
function controls(){vbox.innerHTML='';VOLS.forEach(function(v){var b=document.createElement('button');b.type='button';b.textContent=v.label;b.title='第 '+v.span+' 章';b.setAttribute('aria-pressed',st.vol===v.v?'true':'false');b.onclick=function(){if(st.vol===v.v)return;st.vol=v.v;st.anim=true;st.focus=null;render()};vbox.appendChild(b)})}
function legend(){lbox.innerHTML='';Object.keys(FACTION).forEach(function(f){var s=document.createElement('span');s.className='chip';s.innerHTML='<span class="dot" style="background:'+FACTION[f]+'"></span>'+f;lbox.appendChild(s)});
['僚属','从族','盟友','对手','同行','暗线'].forEach(function(k){var s=document.createElement('span');s.className='chip';s.innerHTML='<svg width="22" height="8" aria-hidden="true"><line x1="0" y1="4" x2="22" y2="4" stroke="'+KS[k].c+'" stroke-width="2"'+(KS[k].d?' stroke-dasharray="'+KS[k].d+'"':'')+'></line></svg>'+k;lbox.appendChild(s)})}
function captions(){return [{t:'铁砧联邦',x:250,y:118},{t:'齿轮帮（从族）',x:300,y:520},{t:'涌潮虫群',x:800,y:505},{t:'星辉议会',x:812,y:128},{t:'自由 / 远征',x:690,y:52}]}
function render(){
var nodes=vn(),edges=ve(),vis={};nodes.forEach(function(n){vis[n.id]=1});
var fe=st.focus?inc(st.focus):[],fs={};fe.forEach(function(e){fs[e.a+'|'+e.b]=1});
svg.innerHTML='';
captions().forEach(function(c){svg.appendChild(E('text',{x:c.x,y:c.y,class:'cluster','text-anchor':'middle'},c.t))});
edges.forEach(function(e){var a=byId(e.a),b=byId(e.b),s=KS[e.kind],hot=fs[e.a+'|'+e.b],dim=st.focus&&!hot;
var g=E('g',{class:'edge-wrap'+(dim?' dim':'')});
var l=E('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:hot?'var(--accent)':s.c,'stroke-width':hot?3:1.6,'stroke-dasharray':s.d||'none','stroke-linecap':'round'});
l.setAttribute('class','edge');g.appendChild(l);svg.appendChild(g);
if(hot){var mx=(a.x+b.x)/2,my=(a.y+b.y)/2,bg=E('rect',{x:mx-82,y:my-11,width:164,height:20,rx:4,class:'elabel-bg'}),tx=E('text',{x:mx,y:my+3,class:'elabel'},e.label);
svg.appendChild(bg);svg.appendChild(tx);try{var bb=tx.getBBox();bg.setAttribute('x',bb.x-5);bg.setAttribute('width',bb.width+10);bg.setAttribute('height',bb.height+5);bg.setAttribute('y',bb.y-3)}catch(err){}}});
nodes.forEach(function(n){var g=E('g',{class:'node'+(st.anim?' anim':''),tabindex:'0',role:'button'});g.setAttribute('aria-label',n.name+'，'+n.role);
var hot=st.focus===n.id,dim=st.focus&&!hot&&!fe.some(function(e){return e.a===n.id||e.b===n.id});if(dim)g.setAttribute('class','node dim'+(st.anim?' anim':''));
g.appendChild(E('circle',{cx:n.x,cy:n.y,r:n.r,fill:FACTION[n.faction],stroke:hot?'var(--accent)':'var(--border)','stroke-width':hot?4:1.5}));
g.appendChild(E('text',{x:n.x,y:n.y+5,class:'init'},n.name.slice(0,1)));
g.appendChild(E('text',{x:n.x,y:n.y+n.r+16},n.name));
function pick(){st.focus=(st.focus===n.id)?null:n.id;st.anim=false;render()}
g.onclick=pick;g.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick()}};svg.appendChild(g)});
st.anim=false;renderPanel()}
function renderPanel(){if(!st.focus){panel.innerHTML='<h4>怎么读这张图</h4><p>圆的颜色是阵营，线的样式是关系类型（虚线为从族链路与暗线）。点任意人物：加亮的线与标签就是他的关系轴，面板里给身份、首次登场卷与一句话。</p>';return}
var n=byId(st.focus),rel=inc(n.id).map(function(e){var o=e.a===n.id?byId(e.b):byId(e.a);return '<li><strong>'+o.name+'</strong>　<span class="meta">['+e.kind+' · 卷'+e.vol+']</span>　'+e.label+'</li>'}).join('');
panel.innerHTML='<h4>'+n.name+'　<span class="meta">'+n.faction+' ｜ 首登：卷'+n.vol+'</span></h4><p>'+n.role+'</p><p>'+n.note+'</p><ul>'+(rel||'<li>当前卷内暂无已登场的关系。</li>')+'</ul>'}
controls();legend();render();})();
</script>
</body>
</html>
