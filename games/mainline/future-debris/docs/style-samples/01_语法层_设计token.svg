<?xml version="1.0" encoding="UTF-8"?>
<!-- 01 语法层 · 设计 token 样张（修订版 2）| 给谁看：美术评审 + UI 实现者 | 用途：一眼确认全局信息层级、色板与控件外观，且换代纪元时此层不变 | token 来源：future-debris 契约 docs/04《视觉语言与设计token》——色值取契约现值（text-faint 9E9889 / line-strong 6F7B89），字号取契约五级阶梯，全部 1:1 绘制不缩放，未引入任何新色相 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <!-- 扫描线：每 4px 一条极淡暗线，α≈0.04 -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#10161C" opacity="0.04"/>
    </pattern>
    <!-- 扫描线 4× 放大示意（周期 16px / 线宽 4px）：只为让评审看见 -->
    <pattern id="scan4x" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="16" height="4" fill="#10161C" opacity="0.45"/>
    </pattern>
    <!-- 极轻噪点 -->
    <pattern id="noise" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="1" y="2" width="1" height="1" fill="#F3EDE1" opacity="0.05"/>
      <rect x="7" y="5" width="1" height="1" fill="#10161C" opacity="0.10"/>
      <rect x="4" y="9" width="1" height="1" fill="#F3EDE1" opacity="0.04"/>
      <rect x="10" y="11" width="1" height="1" fill="#10161C" opacity="0.08"/>
      <rect x="2" y="7" width="1" height="1" fill="#F3EDE1" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- ============ 底 ============ -->
  <rect x="0" y="0" width="1000" height="620" fill="#10161C"/>

  <!-- ============ 页眉 ============ -->
  <rect x="0" y="0" width="1000" height="76" fill="#18212B"/>
  <line x1="0" y1="76.5" x2="1000" y2="76.5" stroke="#2A3742" stroke-width="1"/>
  <text x="48" y="40" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="1" fill="#F3EDE1">语法层 · DESIGN TOKENS</text>
  <text x="48" y="61" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#A9A395">future-debris / 全局共享层 · 不随纪元变化 · 色值与字号对齐契约 docs/04 现值 · 纪元风格见 02 / 03</text>
  <text x="952" y="40" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1" fill="#9E9889">STYLE SAMPLE 01 · rev2</text>
  <text x="952" y="61" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#9E9889">1000 × 620 · 1:1 未缩放</text>

  <!-- ============ A 色板 ============ -->
  <text x="48" y="104" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#9E9889">A · COLOR TOKENS / 颜色（13 枚，值取契约现值）</text>

  <!-- 单行 13 枚：chip 宽 64 / 间距 6 -->
  <g>
    <rect x="48" y="116" width="64" height="44" rx="4" fill="#10161C" stroke="#6F7B89" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="118" y="116" width="64" height="44" rx="4" fill="#18212B" stroke="#6F7B89" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="188" y="116" width="64" height="44" rx="4" fill="#212E3A" stroke="#6F7B89" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="258" y="116" width="64" height="44" rx="4" fill="#F3EDE1" stroke="#6F7B89" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="328" y="116" width="64" height="44" rx="4" fill="#A9A395" stroke="#6F7B89" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="398" y="116" width="64" height="44" rx="4" fill="#9E9889" stroke="#6F7B89" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="468" y="116" width="64" height="44" rx="4" fill="#2A3742" stroke="#6F7B89" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="538" y="116" width="64" height="44" rx="4" fill="#6F7B89" stroke="#6F7B89" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="608" y="116" width="64" height="44" rx="4" fill="#4FD1C5" stroke="#6F7B89" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="678" y="116" width="64" height="44" rx="4" fill="#FF6B35" stroke="#6F7B89" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="748" y="116" width="64" height="44" rx="4" fill="#E4572E" stroke="#6F7B89" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="818" y="116" width="64" height="44" rx="4" fill="#FFC857" stroke="#6F7B89" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="888" y="116" width="64" height="44" rx="4" fill="#7BD389" stroke="#6F7B89" stroke-opacity="0.35" stroke-width="1"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" text-anchor="middle">
    <text x="80" y="174" font-size="8" fill="#F3EDE1">--bg-base</text>
    <text x="80" y="185" font-size="7.5" fill="#9E9889">#10161C</text>
    <text x="150" y="174" font-size="8" fill="#F3EDE1">--bg-elev-1</text>
    <text x="150" y="185" font-size="7.5" fill="#9E9889">#18212B</text>
    <text x="220" y="174" font-size="8" fill="#F3EDE1">--bg-elev-2</text>
    <text x="220" y="185" font-size="7.5" fill="#9E9889">#212E3A</text>
    <text x="290" y="174" font-size="8" fill="#F3EDE1">--text</text>
    <text x="290" y="185" font-size="7.5" fill="#9E9889">#F3EDE1</text>
    <text x="360" y="174" font-size="8" fill="#F3EDE1">--text-dim</text>
    <text x="360" y="185" font-size="7.5" fill="#9E9889">#A9A395</text>
    <text x="430" y="174" font-size="8" fill="#F3EDE1">--text-faint</text>
    <text x="430" y="185" font-size="7.5" fill="#9E9889">#9E9889</text>
    <text x="500" y="174" font-size="8" fill="#F3EDE1">--line</text>
    <text x="500" y="185" font-size="7.5" fill="#9E9889">#2A3742</text>
    <text x="570" y="174" font-size="8" fill="#F3EDE1">--line-strong</text>
    <text x="570" y="185" font-size="7.5" fill="#9E9889">#6F7B89</text>
    <text x="640" y="174" font-size="8" fill="#F3EDE1">--power</text>
    <text x="640" y="185" font-size="7.5" fill="#9E9889">#4FD1C5</text>
    <text x="710" y="174" font-size="8" fill="#F3EDE1">--residue</text>
    <text x="710" y="185" font-size="7.5" fill="#9E9889">#FF6B35</text>
    <text x="780" y="174" font-size="8" fill="#F3EDE1">--accent</text>
    <text x="780" y="185" font-size="7.5" fill="#9E9889">#E4572E</text>
    <text x="850" y="174" font-size="8" fill="#F3EDE1">--warn</text>
    <text x="850" y="185" font-size="7.5" fill="#9E9889">#FFC857</text>
    <text x="920" y="174" font-size="8" fill="#F3EDE1">--ok</text>
    <text x="920" y="185" font-size="7.5" fill="#9E9889">#7BD389</text>
  </g>
  <text x="48" y="204" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#A9A395">用途：power 电力 / residue 残渣 / accent 单一焦点 / warn 危险阈值 / ok 洁净 / line 装饰 1px / line-strong 控件边框 1.5px / text-faint 为可访问性下限（不得更暗）</text>
  <text x="48" y="216" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#9E9889">形状与字体 token：圆角 4px（小）/ 8px（面板） · 描边 1.5px（控件与卡框） · 字族 ui-monospace, Menlo, monospace（全部文字）</text>
  <line x1="48" y1="232" x2="952" y2="232" stroke="#2A3742" stroke-width="1"/>

  <!-- ============ B 字体层级（契约五级，1:1 绘制）============ -->
  <text x="48" y="256" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#9E9889">B · TYPE SCALE / 字体层级</text>
  <text x="952" y="256" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#9E9889">1:1 实际字号（未缩放）· 灰色小字为评审标注，不计入阶梯</text>
  <line x1="48" y1="268" x2="952" y2="268" stroke="#2A3742" stroke-width="1"/>

  <!-- title-1 -->
  <text x="48" y="304" font-family="ui-monospace, Menlo, monospace" font-size="28" font-weight="700" fill="#F3EDE1">future-debris · 原子纪元</text>
  <text x="952" y="304" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#A9A395">title-1 · 28px / 行高 1.25 / 字重 700 · 页面主标题、纪元名</text>
  <line x1="48" y1="316" x2="952" y2="316" stroke="#2A3742" stroke-width="1"/>

  <!-- title-2 -->
  <text x="48" y="350" font-family="ui-monospace, Menlo, monospace" font-size="20" font-weight="600" fill="#F3EDE1">供电网络 / POWER GRID</text>
  <text x="952" y="350" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#A9A395">title-2 · 20px / 行高 1.3 / 字重 600 · 面板标题、卡名</text>
  <line x1="48" y1="362" x2="952" y2="362" stroke="#2A3742" stroke-width="1"/>

  <!-- body -->
  <text x="48" y="390" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#F3EDE1">部署后为相邻塔位提供 1 点电力。</text>
  <text x="952" y="390" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#A9A395">body · 15px / 行高 1.6 / 字重 400 · 正文、卡牌说明</text>
  <line x1="48" y1="400" x2="952" y2="400" stroke="#2A3742" stroke-width="1"/>

  <!-- caption -->
  <text x="48" y="426" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="500" fill="#A9A395">RC-ATOMIC-001 · 原子能委员会 · 数值单位</text>
  <text x="952" y="426" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#A9A395">caption · 13px / 行高 1.5 / 字重 500 · 标签、数值单位、脚注</text>
  <line x1="48" y1="436" x2="952" y2="436" stroke="#2A3742" stroke-width="1"/>

  <!-- number-lg -->
  <text x="48" y="480" font-family="ui-monospace, Menlo, monospace" font-size="32" font-weight="700" fill="#F3EDE1">128</text>
  <text x="120" y="480" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#9E9889">费用 / 结算数字（等宽数字，一位数不居中偏移）</text>
  <text x="952" y="480" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#A9A395">number-lg · 32px / 行高 1.0 / 字重 700 · 卡面费用、结算数字</text>
  <line x1="48" y1="492" x2="952" y2="492" stroke="#2A3742" stroke-width="1"/>

  <!-- ============ C 间距尺度 ============ -->
  <text x="48" y="514" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#9E9889">C · SPACING / 间距尺度</text>
  <line x1="48" y1="562" x2="216" y2="562" stroke="#2A3742" stroke-width="1"/>
  <!-- 6 根尺度条：条高按 ×1.25 画便于看清，标注为契约原值 -->
  <rect x="48" y="557" width="18" height="5" fill="#6F7B89"/>
  <rect x="76" y="552" width="18" height="10" fill="#6F7B89"/>
  <rect x="104" y="547" width="18" height="15" fill="#6F7B89"/>
  <rect x="132" y="542" width="18" height="20" fill="#6F7B89"/>
  <rect x="160" y="532" width="18" height="30" fill="#6F7B89"/>
  <rect x="188" y="522" width="18" height="40" fill="#6F7B89"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#9E9889" text-anchor="middle">
    <text x="57" y="576">4</text>
    <text x="85" y="576">8</text>
    <text x="113" y="576">12</text>
    <text x="141" y="576">16</text>
    <text x="169" y="576">24</text>
    <text x="197" y="576">32</text>
  </g>
  <text x="48" y="596" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#9E9889">基准单位 4px · 面板内边距 16 · 卡片内边距 12</text>
  <text x="48" y="608" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#9E9889">区块间隔 24 / 32 · 圆角 4 / 8 · 条高按 ×1.25 画</text>

  <!-- ============ D 控件：按钮两态 ============ -->
  <text x="300" y="514" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#9E9889">D · BUTTONS / 控件状态</text>
  <rect x="300" y="528" width="130" height="34" rx="4" fill="#212E3A" stroke="#6F7B89" stroke-width="1.5"/>
  <text x="365" y="550" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#F3EDE1">部署</text>
  <rect x="440" y="525" width="136" height="40" rx="6" fill="none" stroke="#4FD1C5" stroke-width="1.5"/>
  <rect x="446" y="528" width="130" height="34" rx="4" fill="#212E3A" stroke="#6F7B89" stroke-width="1.5"/>
  <text x="511" y="550" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#F3EDE1">部署</text>
  <text x="300" y="580" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#9E9889">默认 default</text>
  <text x="446" y="580" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#9E9889">焦点 focus · 外环 1.5px</text>
  <text x="300" y="598" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#9E9889">控件边框必须用 line-strong（1.5px）；</text>
  <text x="300" y="610" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#9E9889">装饰分隔线才用 line（1px）· 焦点色暂用 power</text>

  <!-- ============ E 卡框外形 ============ -->
  <text x="628" y="514" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#9E9889">E · CARD FRAME</text>
  <rect x="628" y="524" width="120" height="62" rx="8" fill="#212E3A" stroke="#6F7B89" stroke-width="1.5"/>
  <rect x="638" y="534" width="100" height="12" rx="4" fill="#18212B" stroke="#2A3742" stroke-width="1"/>
  <rect x="638" y="552" width="44" height="12" rx="4" fill="#18212B" stroke="#2A3742" stroke-width="1"/>
  <rect x="688" y="552" width="50" height="12" rx="4" fill="#18212B" stroke="#2A3742" stroke-width="1"/>
  <text x="628" y="600" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#9E9889">圆角 8px（面板）/ 4px（小）</text>
  <text x="628" y="612" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#9E9889">描边 1.5px · 内部 1px 用 line</text>

  <!-- ============ F 扫描线纹理 ============ -->
  <text x="790" y="514" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#9E9889">F · SCANLINE</text>
  <rect x="790" y="524" width="162" height="62" rx="4" fill="#212E3A"/>
  <rect x="790" y="524" width="162" height="62" rx="4" fill="url(#scan4x)"/>
  <rect x="790" y="524" width="162" height="62" rx="4" fill="none" stroke="#2A3742" stroke-width="1"/>
  <text x="790" y="600" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#9E9889">实际 1×：周期 4px · 暗线 α≈0.04</text>
  <text x="790" y="612" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#9E9889">此处 4× 放大示意，对比度已提亮</text>

  <!-- ============ 全页图像处理：1× 扫描线 + 极轻噪点 ============ -->
  <rect x="0" y="0" width="1000" height="620" fill="url(#scan)"/>
  <rect x="0" y="0" width="1000" height="620" fill="url(#noise)"/>
</svg>
