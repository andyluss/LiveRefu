<text x="40" y="54" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#9FB3C4">塔位 标准 12 / 支援 4 / 修饰 2　｜　路径 约 30s × 2（共享基地）　｜　事件槽 2　｜　推荐章节 第 5 章　｜　双入口（双流可用）</text>
<text x="40" y="622" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#9FB3C4">波次卡组：WAV-MUL-A 普通 ｜ WAV-MUL-B 精英 ｜ WAV-MUL-C 周常（BOSS 波）</text>
<text x="40" y="642" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#7f93a8">塔位最多、入口最短、共享基地：合流点让敌人 +10% 受伤，是全书与长篇第八节点的同一张图。</text>
