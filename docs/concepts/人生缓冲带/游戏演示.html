<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人生缓冲带 · 非战斗塔防</title>
<style>
  :root{
    --bg:#0b1020; --panel:#141b33; --line:#2a3557;
    --text:#dde4f5; --muted:#8794b8;
    --body:#5b8dee; --mind:#9b6dd6; --relation:#3fb98f; --finance:#e0a43c;
    --red:#e05555; --blue:#5b8dee; --yellow:#f0c040;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; padding:14px 12px 30px;
    background:radial-gradient(1100px 600px at 50% -15%, #1a2450 0%, #0b1020 62%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; justify-content:center;
  }
  #app{width:100%; max-width:980px}

  h1{font-size:19px; margin:0 0 2px; letter-spacing:2px; font-weight:600}
  h1 small{font-size:11px; letter-spacing:0; color:var(--muted); font-weight:400; margin-left:8px}

  /* ---- 核心四维 ---- */
  .cores{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0 8px}
  .core{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:7px 9px}
  .core .lbl{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:5px}
  .core .lbl b{font-size:12px; font-weight:600}
  .track{height:6px; border-radius:3px; background:#0a0f22; overflow:hidden}
  .fill{height:100%; border-radius:3px; transition:width .18s linear}
  #bar-body{background:var(--body)} #bar-mind{background:var(--mind)}
  #bar-relation{background:var(--relation)} #bar-finance{background:var(--finance)}

  /* ---- 资源 ---- */
  .resbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
  .res{display:flex; align-items:center; gap:5px; background:var(--panel);
       border:1px solid var(--line); border-radius:8px; padding:4px 10px; font-size:12px}
  .res b{font-size:13px; color:#fff}
  .res .k{color:var(--muted)}
  .meaning{margin-left:auto; color:var(--yellow); font-size:12px}

  /* ---- 画布 ---- */
  .stage{position:relative; border-radius:14px; overflow:hidden;
         border:1px solid var(--line); background:#080d1c;
         box-shadow:0 18px 50px -20px rgba(0,0,0,.9)}
  canvas{display:block; width:100%; height:auto}

  /* ---- 塔栏 ---- */
  .towerbar{display:grid; grid-template-columns:repeat(6,1fr); gap:7px; margin-top:10px}
  @media(max-width:720px){ .towerbar{grid-template-columns:repeat(3,1fr)} }
  .tw{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:8px 4px 7px; cursor:pointer; color:var(--text); text-align:center;
    transition:.15s; font-family:inherit;
  }
  .tw:hover{border-color:#3d4c78; transform:translateY(-1px)}
  .tw.sel{border-color:#6f8ff5; background:#1b2banimate; background:#1a2244;
          box-shadow:0 0 0 2px rgba(111,143,245,.35) inset}
  .tw.disabled{opacity:.35; cursor:not-allowed; transform:none}
  .tw .ic{font-size:17px; line-height:1}
  .tw .nm{font-size:11.5px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tw .cost{font-size:10px; color:var(--muted); margin-top:3px}

  /* ---- 底部控制 ---- */
  .ctrl{display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap}
  button.main{
    flex:1; min-width:200px; padding:12px 18px; border-radius:11px; border:0;
    background:linear-gradient(135deg,#3b62d9,#6f8ff5); color:#fff; font-size:14px;
    font-weight:600; letter-spacing:1px; cursor:pointer; font-family:inherit;
    box-shadow:0 10px 24px -12px #3b62d9;
  }
  button.main:hover{filter:brightness(1.1)}
  button.main:disabled{opacity:.4; cursor:default; box-shadow:none}
  button.ghost{
    padding:12px 16px; border-radius:11px; background:transparent; color:var(--muted);
    border:1px solid var(--line); cursor:pointer; font-size:13px; font-family:inherit;
  }
  button.ghost:hover{color:var(--text); border-color:#3d4c78}

  .waveinfo{font-size:12px; color:var(--muted); flex:1 1 100%; line-height:1.6}
  .waveinfo b{color:var(--text)}

  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-top:10px}
  .legend i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:1px}

  /* ---- 遮罩 ---- */
  #overlay{position:absolute; inset:0; background:rgba(6,10,24,.88); backdrop-filter:blur(4px);
           display:flex; align-items:center; justify-content:center; z-index:20; padding:20px}
  #overlay.hide{display:none}
  .ov{text-align:center; max-width:420px}
  .ov h2{margin:0 0 10px; font-size:22px; letter-spacing:2px}
  .ov p{margin:0 0 18px; color:var(--muted); font-size:13px; line-height:1.8}
  .ov button{padding:11px 30px; border-radius:10px; border:0; cursor:pointer;
             background:linear-gradient(135deg,#3b62d9,#6f8ff5); color:#fff; font-size:14px;
             letter-spacing:1px; font-family:inherit}
  .hint{font-size:11px; color:#5c688c; margin-top:8px; text-align:center}
</style>
</head>
<body>
<div id="app">
  <h1>人生缓冲带 <small>你无法阻止压力到来，只能决定它经过什么</small></h1>

  <div class="cores">
    <div class="core">
      <div class="lbl"><span>身体</span><b id="val-body" style="color:var(--body)">100</b></div>
      <div class="track"><div class="fill" id="bar-body" style="width:100%"></div></div>
    </div>
    <div class="core">
      <div class="lbl"><span>心理</span><b id="val-mind" style="color:var(--mind)">100</b></div>
      <div class="track"><div class="fill" id="bar-mind" style="width:100%"></div></div>
    </div>
    <div class="core">
      <div class="lbl"><span>关系</span><b id="val-relation" style="color:var(--relation)">100</b></div>
      <div class="track"><div class="fill" id="bar-relation" style="width:100%"></div></div>
    </div>
    <div class="core">
      <div class="lbl"><span>财务</span><b id="val-finance" style="color:var(--finance)">100</b></div>
      <div class="track"><div class="fill" id="bar-finance" style="width:100%"></div></div>
    </div>
  </div>

  <div class="resbar">
    <div class="res"><span>⏱</span><span class="k">时间</span><b id="r-time">8</b></div>
    <div class="res"><span>💰</span><span class="k">金钱</span><b id="r-money">6</b></div>
    <div class="res"><span>👥</span><span class="k">社会资本</span><b id="r-social">5</b></div>
    <div class="meaning">意义值 <b id="r-meaning">0</b></div>
  </div>

  <div class="stage">
    <canvas id="game"></canvas>
    <div id="overlay" class="hide">
      <div class="ov">
        <h2 id="ovTitle"></h2>
        <p id="ovText"></p>
        <button id="restart">重新开始</button>
      </div>
    </div>
  </div>

  <div class="towerbar" id="towerbar"></div>

  <div class="ctrl">
    <button class="main" id="startBtn">开始第 1 波</button>
    <button class="ghost" id="demolishBtn" style="display:none">拆除选中塔</button>
    <div class="waveinfo" id="waveinfo"></div>
  </div>

  <div class="legend">
    <span><i style="background:var(--red)"></i>急性压力 · 快、伤害高</span>
    <span><i style="background:var(--blue)"></i>慢性压力 · 慢、可穿透减速</span>
    <span><i style="background:var(--yellow)"></i>机会压力 · 让它通过才能收获意义</span>
  </div>
  <div class="hint">点击下方策略卡 → 点击路径旁的虚线槽位放置 · 再次点击已放置的塔可查看</div>
</div>

<script>
(() => {
"use strict";

/* ============================================================
   1. 基础常量与路径构建
   ============================================================ */
const CW = 960, CH = 460;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function setupCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = CW * dpr;
  canvas.height = CH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
setupCanvas();
window.addEventListener('resize', () => { /* 尺寸靠CSS，无需重设 */ });

// 人生路径控制点（Catmull-Rom 平滑）
const CTRL = [
  {x:  15, y: 350},
  {x: 140, y: 350},
  {x: 240, y: 250},
  {x: 380, y: 250},
  {x: 460, y: 350},
  {x: 610, y: 350},
  {x: 690, y: 230},
  {x: 878, y: 230},
];

function catmull(p0,p1,p2,p3,t){
  const t2=t*t, t3=t2*t;
  return {
    x: 0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
    y: 0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
  };
}

const PATH = [];
const SUB = 24;
for (let i = 0; i < CTRL.length - 1; i++){
  const p0 = CTRL[Math.max(0, i-1)];
  const p1 = CTRL[i];
  const p2 = CTRL[i+1];
  const p3 = CTRL[Math.min(CTRL.length-1, i+2)];
  for (let j = 0; j < SUB; j++) PATH.push(catmull(p0,p1,p2,p3,j/SUB));
}
PATH.push(CTRL[CTRL.length-1]);

const CUM = [0];
for (let i = 1; i < PATH.length; i++){
  CUM.push(CUM[i-1] + Math.hypot(PATH[i].x-PATH[i-1].x, PATH[i].y-PATH[i-1].y));
}
const TOTAL = CUM[CUM.length-1];

function posAt(s){
  s = Math.max(0, Math.min(TOTAL, s));
  let lo = 0, hi = CUM.length - 1;
  while (lo < hi - 1){
    const mid = (lo + hi) >> 1;
    if (CUM[mid] <= s) lo = mid; else hi = mid;
  }
  const seg = (CUM[hi] - CUM[lo]) || 1e-6;
  const t = (s - CUM[lo]) / seg;
  const a = PATH[lo], b = PATH[hi];
  return {
    x: a.x + (b.x - a.x) * t,
    y: a.y + (b.y - a.y) * t,
    angle: Math.atan2(b.y - a.y, b.x - a.x)
  };
}

const CORE = posAt(TOTAL);

/* ============================================================
   2. 数据定义
   ============================================================ */
const TOWERS = {
  sleep: {
    name:'睡眠规律', icon:'🌙', color:'#5b8dee',
    cost:{ time:3 }, range:96, rate:18, targets:['red'],
    heal:{ body:0.7 }, desc:'处理急性压力，缓慢恢复身体'
  },
  boundary: {
    name:'边界设定', icon:'🚧', color:'#9b6dd6',
    cost:{ social:3 }, range:104, rate:12, targets:['blue'], slow:0.45,
    heal:{ mind:0.7 }, desc:'减速并处理慢性压力，恢复心理'
  },
  fund: {
    name:'应急金', icon:'🛟', color:'#e0a43c',
    cost:{ money:3 }, range:84, rate:28, targets:['red'],
    heal:{ finance:0.9 }, desc:'高效吸收急性压力，恢复财务'
  },
  friends: {
    name:'朋友网络', icon:'🤝', color:'#3fb98f',
    cost:{ time:2, social:2 }, range:110, rate:14, targets:['blue'], slow:0.6,
    heal:{ relation:0.8, mind:0.3 }, desc:'分流慢性压力，恢复关系'
  },
  therapy: {
    name:'专业求助', icon:'🧭', color:'#e0607e',
    cost:{ money:4 }, range:132, rate:30, targets:['red','blue'],
    heal:{ mind:0.5 }, desc:'大范围强效处理红蓝压力'
  },
  hobby: {
    name:'爱好与意义', icon:'🎨', color:'#f0c040',
    cost:{ time:2 }, range:112, rate:11, targets:['yellow'],
    heal:{ mind:0.4 }, desc:'把机会压力转化为意义值'
  }
};

const UNITS = {
  red:    { color:'#e05555', hp:32, speed:78, dmg:13, r:10 },
  blue:   { color:'#5b8dee', hp:44, speed:48, dmg:9,  r:12 },
  yellow: { color:'#f0c040', hp:26, speed:60, dmg:0,  r:10 }
};

const WAVES = [
  { name:'青年求职波', desc:'面试失败、房租、同辈比较',
    spawns:[['red',0],['red',1.6],['red',3.2],['red',4.8],['red',6.4],['red',8.0]],
    reward:{ time:6, money:5, social:4 } },

  { name:'职场初期波', desc:'加班、绩效、通勤消耗',
    spawns:[['red',0],['blue',0.8],['red',1.8],['blue',2.8],['red',3.6],['blue',4.8],
            ['red',5.6],['blue',6.8],['red',7.6],['blue',8.8]],
    reward:{ time:7, money:6, social:5 } },

  { name:'关系与家庭波', desc:'催婚、亲密冲突、照护责任',
    spawns:[['blue',0],['yellow',1.5],['blue',2.5],['red',3.5],['blue',4.5],
            ['yellow',5.5],['blue',6.5],['red',7.5],['blue',8.5],['yellow',9.5]],
    reward:{ time:7, money:6, social:6 } },

  { name:'中年夹心波', desc:'房贷、裁员、父母健康、孩子教育',
    spawns:[['red',0],['blue',0.6],['red',1.2],['blue',1.8],['red',2.4],['blue',3.0],
            ['red',3.6],['blue',4.2],['yellow',4.8],['red',5.4],['blue',6.0],['red',6.6],
            ['blue',7.2],['yellow',7.8],['red',8.4],['blue',9.0],['red',9.6],['blue',10.2]],
    reward:{ time:8, money:7, social:7 } },

  { name:'健康危机波', desc:'体检异常、康复、照护叠加',
    spawns:[['blue',0],['red',0.5],['blue',1.5],['red',2.5],['blue',3.5],['red',4.5],
            ['blue',5.5],['red',6.5],['blue',7.5],['red',8.5],['blue',9.5],['red',10.5]],
    reward:{ time:8, money:8, social:7 } },

  { name:'退休空巢波', desc:'身份失落、孤独、传承与机会',
    spawns:[['blue',0],['yellow',1],['blue',2],['yellow',3],['blue',4],['yellow',5],
            ['blue',6],['yellow',7],['blue',8],['yellow',9],['blue',10],['yellow',11]],
    reward:{ time:0, money:0, social:0 } }
];

/* ============================================================
   3. 状态
   ============================================================ */
const state = {
  phase: 'prepare',        // prepare | wave | over | win
  waveIndex: 0,
  res: { time: 8, money: 6, social: 5 },
  core: { body:100, mind:100, relation:100, finance:100 },
  meaning: 0,
  units: [],
  slots: [],
  spawnList: [],
  waveTime: 0,
  selectedType: null,
  selectedSlot: null,
  floats: [],
  shake: 0
};

// 生成槽位（沿路径交替左右偏移）
(function buildSlots(){
  const ts = [0.10, 0.20, 0.31, 0.42, 0.53, 0.64, 0.76, 0.88];
  ts.forEach((t, i) => {
    const p = posAt(TOTAL * t);
    const perp = p.angle + Math.PI / 2;
    const side = (i % 2 === 0) ? 1 : -1;
    let x = p.x + Math.cos(perp) * 64 * side;
    let y = p.y + Math.sin(perp) * 64 * side;
    x = Math.max(42, Math.min(CW - 42, x));
    y = Math.max(48, Math.min(CH - 42, y));
    state.slots.push({ x, y, tower: null });
  });
})();

/* ============================================================
   4. UI 构建与刷新
   ============================================================ */
const towerBar = document.getElementById('towerbar');
Object.entries(TOWERS).forEach(([key, def]) => {
  const btn = document.createElement('button');
  btn.className = 'tw';
  btn.dataset.key = key;
  btn.innerHTML = `
    <div class="ic">${def.icon}</div>
    <div class="nm">${def.name}</div>
    <div class="cost">${costText(def.cost)}</div>`;
  btn.addEventListener('click', () => {
    if (state.phase === 'over' || state.phase === 'win') return;
    if (!canAfford(def.cost)) return;
    state.selectedType = (state.selectedType === key) ? null : key;
    state.selectedSlot = null;
    refreshUI();
  });
  towerBar.appendChild(btn);
});

function costText(cost){
  const map = { time:'⏱', money:'💰', social:'👥' };
  return Object.entries(cost).map(([k,v]) => `${map[k]}${v}`).join(' ');
}

function canAfford(cost){
  for (const k in cost) if (state.res[k] < cost[k]) return false;
  return true;
}

function pay(cost){
  for (const k in cost) state.res[k] -= cost[k];
}

function refreshUI(){
  // 四维
  const coreMax = 100;
  ['body','mind','relation','finance'].forEach(k => {
    const v = Math.max(0, state.core[k]);
    document.getElementById('bar-' + k).style.width = (v / coreMax * 100) + '%';
    document.getElementById('val-' + k).textContent = Math.ceil(v);
  });
  // 资源
  document.getElementById('r-time').textContent = Math.floor(state.res.time);
  document.getElementById('r-money').textContent = Math.floor(state.res.money);
  document.getElementById('r-social').textContent = Math.floor(state.res.social);
  document.getElementById('r-meaning').textContent = Math.floor(state.meaning);

  // 塔按钮
  document.querySelectorAll('.tw').forEach(btn => {
    const def = TOWERS[btn.dataset.key];
    btn.classList.toggle('sel', state.selectedType === btn.dataset.key);
    btn.classList.toggle('disabled', !canAfford(def.cost));
  });

  // 主按钮
  const startBtn = document.getElementById('startBtn');
  const demoBtn = document.getElementById('demolishBtn');
  const winfo = document.getElementById('waveinfo');

  if (state.phase === 'over' || state.phase === 'win'){
    startBtn.disabled = true;
  } else if (state.phase === 'wave'){
    startBtn.disabled = true;
    startBtn.textContent = '压力进行中…';
  } else {
    startBtn.disabled = false;
    startBtn.textContent = `开始第 ${state.waveIndex + 1} 波`;
  }

  if (state.selectedSlot && state.selectedSlot.tower){
    demoBtn.style.display = '';
  } else {
    demoBtn.style.display = 'none';
  }

  if (state.phase === 'prepare' && state.waveIndex < WAVES.length){
    const w = WAVES[state.waveIndex];
    winfo.innerHTML = `<b>下一波 · ${w.name}</b> — ${w.desc}　|　本波资源：${costText(w.reward) || '无'}`;
  } else if (state.phase === 'wave'){
    winfo.innerHTML = `<b>${WAVES[state.waveIndex].name}</b> 正在进行…`;
  } else {
    winfo.innerHTML = '';
  }
}

/* ============================================================
   5. 游戏逻辑
   ============================================================ */
function spawnUnit(type){
  const d = UNITS[type];
  let target = null;
  if (type === 'red')   target = Math.random() < 0.5 ? 'body' : 'finance';
  if (type === 'blue')  target = Math.random() < 0.5 ? 'mind' : 'relation';
  state.units.push({
    type, s: 0, hp: d.hp, maxHp: d.hp, target,
    wobble: Math.random() * Math.PI * 2
  });
}

function addFloat(x, y, text, color){
  state.floats.push({ x, y, text, color, life: 1.3, max: 1.3 });
}

function damageCore(key, amount){
  state.core[key] -= amount;
  state.shake = Math.min(12, state.shake + amount * 0.5);
  if (state.core[key] <= 0){
    state.core[key] = 0;
    gameOver(key);
  }
}

function gameOver(key){
  if (state.phase === 'over' || state.phase === 'win') return;
  state.phase = 'over';
  const names = { body:'身体', mind:'心理', relation:'关系', finance:'财务' };
  showOverlay('生活系统崩溃',
    `你的「${names[key]}」维度归零了。<br>压力没有被缓冲，而是直接击穿了你。<br><br>意义值：${Math.floor(state.meaning)}`,
    '#e05555');
  refreshUI();
}

function winGame(){
  state.phase = 'win';
  showOverlay('走到了终点',
    `你走完了整条人生时间线，四维未崩溃。<br>意义值：<b style="color:#f0c040">${Math.floor(state.meaning)}</b><br><br>` +
    (state.meaning >= 20 ? '你不仅稳住了生活，还转化了足够多的机会。' : '你守住了生活，但也错过了一些本可以拥抱的机会。'),
    '#f0c040');
  refreshUI();
}

function showOverlay(title, text, color){
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovTitle').style.color = color;
  document.getElementById('ovText').innerHTML = text;
  document.getElementById('overlay').classList.remove('hide');
}

function enterPrep(){
  if (state.waveIndex >= WAVES.length){ winGame(); return; }
  const w = WAVES[state.waveIndex];
  for (const k in w.reward) state.res[k] += w.reward[k];
  state.phase = 'prepare';
  refreshUI();
}

function startWave(){
  if (state.phase !== 'prepare') return;
  const w = WAVES[state.waveIndex];
  state.spawnList = w.spawns.map(([type, at]) => ({ type, at }));
  state.waveTime = 0;
  state.phase = 'wave';
  state.selectedType = null;
  state.selectedSlot = null;
  refreshUI();
}

function endWave(){
  state.waveIndex++;
  if (state.waveIndex >= WAVES.length){
    winGame();
  } else {
    enterPrep();
  }
}

/* ---------- 更新 ---------- */
function update(dt){
  // 浮动文字
  for (let i = state.floats.length - 1; i >= 0; i--){
    const f = state.floats[i];
    f.life -= dt;
    f.y -= 26 * dt;
    if (f.life <= 0) state.floats.splice(i, 1);
  }
  state.shake *= Math.pow(0.001, dt);

  if (state.phase === 'over' || state.phase === 'win') return;

  // 塔的被动恢复
  for (const slot of state.slots){
    if (!slot.tower) continue;
    const def = TOWERS[slot.tower];
    if (!def.heal) continue;
    for (const k in def.heal){
      state.core[k] = Math.min(100, state.core[k] + def.heal[k] * dt);
    }
  }

  if (state.phase !== 'wave') return;

  state.waveTime += dt;

  // 生成
  while (state.spawnList.length && state.spawnList[0].at <= state.waveTime){
    spawnUnit(state.spawnList.shift().type);
  }

  if (!state.units.length && !state.spawnList.length){
    endWave();
    return;
  }

  // 位置
  const positions = state.units.map(u => posAt(u.s));

  // 每座塔分别计算
  const dmg = new Array(state.units.length).fill(0);
  const slow = new Array(state.units.length).fill(1);

  for (const slot of state.slots){
    if (!slot.tower) continue;
    const def = TOWERS[slot.tower];
    const hit = [];
    for (let i = 0; i < state.units.length; i++){
      const u = state.units[i];
      if (!def.targets.includes(u.type)) continue;
      const p = positions[i];
      if (Math.hypot(slot.x - p.x, slot.y - p.y) <= def.range) hit.push(i);
    }
    if (!hit.length) continue;
    const share = def.rate / hit.length;
    for (const i of hit){
      dmg[i] += share;
      if (def.slow) slow[i] = Math.min(slow[i], def.slow);
    }
  }

  // 应用
  for (let i = state.units.length - 1; i >= 0; i--){
    const u = state.units[i];
    const d = UNITS[u.type];

    u.hp -= dmg[i] * dt;
    u.s += d.speed * slow[i] * dt;

    // 被化解
    if (u.hp <= 0){
      const p = positions[i];
      if (u.type === 'yellow'){
        state.meaning += 2;
        addFloat(p.x, p.y - 14, '意义 +2（转化）', '#f0c040');
      } else {
        // 小幅回复对应维度
        if (u.target) state.core[u.target] = Math.min(100, state.core[u.target] + 3);
        addFloat(p.x, p.y - 14, '已缓冲', u.type === 'red' ? '#ff9a9a' : '#9dc4ff');
      }
      state.units.splice(i, 1);
      continue;
    }

    // 到达核心
    if (u.s >= TOTAL){
      if (u.type === 'yellow'){
        state.meaning += 4;
        state.res.time += 1;
        addFloat(CORE.x - 30, CORE.y - 40, '意义 +4', '#f0c040');
      } else {
        damageCore(u.target, d.dmg);
        addFloat(CORE.x - 24, CORE.y - 34, `-${d.dmg} ${u.target === 'body' ? '身体' : u.target === 'mind' ? '心理' : u.target === 'relation' ? '关系' : '财务'}`,
          u.type === 'red' ? '#ff8a8a' : '#8fb6ff');
        if (state.phase === 'over') return;
      }
      state.units.splice(i, 1);
    }
  }

  refreshUI();
}

/* ============================================================
   6. 渲染
   ============================================================ */
function drawBackground(){
  const g = ctx.createRadialGradient(CW * 0.5, -80, 60, CW * 0.5, -80, 700);
  g.addColorStop(0, '#16204a');
  g.addColorStop(1, '#080d1c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CW, CH);

  // 细网格
  ctx.strokeStyle = 'rgba(120,150,255,.035)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x < CW; x += 48){ ctx.moveTo(x, 0); ctx.lineTo(x, CH); }
  for (let y = 0; y < CH; y += 48){ ctx.moveTo(0, y); ctx.lineTo(CW, y); }
  ctx.stroke();
}

function drawPath(){
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();
  ctx.moveTo(PATH[0].x, PATH[0].y);
  for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);

  ctx.strokeStyle = 'rgba(140,170,255,.05)';
  ctx.lineWidth = 40;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(140,170,255,.13)';
  ctx.lineWidth = 22;
  ctx.stroke();

  ctx.setLineDash([9, 12]);
  ctx.strokeStyle = 'rgba(160,190,255,.28)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawCore(){
  const t = performance.now() / 1000;
  const pulse = 1 + Math.sin(t * 2) * 0.06;

  ctx.save();
  ctx.translate(CORE.x, CORE.y);

  const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 70 * pulse);
  g.addColorStop(0, 'rgba(120,160,255,.42)');
  g.addColorStop(1, 'rgba(120,160,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, 70 * pulse, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, 0, 30, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(30,45,95,.95)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(150,180,255,.85)';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.fillStyle = '#cfe0ff';
  ctx.font = '600 13px -apple-system,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('生活', 0, 0);

  ctx.restore();
}

function drawSlots(){
  const t = performance.now() / 1000;

  for (const slot of state.slots){
    const isSel = state.selectedSlot === slot;

    if (!slot.tower){
      // 空槽
      ctx.beginPath();
      ctx.arc(slot.x, slot.y, 21, 0, Math.PI * 2);
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = isSel ? 'rgba(140,175,255,.9)' : 'rgba(120,150,220,.35)';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.setLineDash([]);

      if (state.selectedType){
        ctx.beginPath();
        ctx.arc(slot.x, slot.y, 21 + Math.sin(t * 4) * 3, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(140,175,255,.35)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      continue;
    }

    // 已建塔
    const def = TOWERS[slot.tower];

    // 射程
    ctx.beginPath();
    ctx.arc(slot.x, slot.y, def.range, 0, Math.PI * 2);
    ctx.fillStyle = hexA(def.color, 0.055);
    ctx.fill();
    ctx.strokeStyle = hexA(def.color, isSel ? 0.55 : 0.18);
    ctx.lineWidth = isSel ? 2 : 1;
    ctx.stroke();

    // 塔体
    ctx.beginPath();
    ctx.arc(slot.x, slot.y, 19, 0, Math.PI * 2);
    ctx.fillStyle = hexA(def.color, 0.9);
    ctx.fill();
    ctx.strokeStyle = isSel ? '#ffffff' : hexA(def.color, 1);
    ctx.lineWidth = isSel ? 2.5 : 1.5;
    ctx.stroke();

    ctx.font = '15px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.icon, slot.x, slot.y + 1);
  }
}

function drawUnits(){
  const t = performance.now() / 1000;

  for (const u of state.units){
    const p = posAt(u.s);
    const d = UNITS[u.type];
    const wob = Math.sin(t * 3 + u.wobble) * 2;

    // 光晕
    const g = ctx.createRadialGradient(p.x, p.y + wob, 1, p.x, p.y + wob, d.r * 2.6);
    g.addColorStop(0, hexA(d.color, 0.55));
    g.addColorStop(1, hexA(d.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y + wob, d.r * 2.6, 0, Math.PI * 2);
    ctx.fill();

    // 本体
    ctx.beginPath();
    if (u.type === 'red'){
      // 菱形（急促）
      ctx.save();
      ctx.translate(p.x, p.y + wob);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = d.color;
      ctx.fillRect(-d.r * 0.72, -d.r * 0.72, d.r * 1.44, d.r * 1.44);
      ctx.restore();
    } else if (u.type === 'yellow'){
      // 星形（机会）
      drawStar(p.x, p.y + wob, 5, d.r, d.r * 0.46, d.color);
    } else {
      ctx.arc(p.x, p.y + wob, d.r, 0, Math.PI * 2);
      ctx.fillStyle = d.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.35)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }

    // 血条
    const hpPct = Math.max(0, u.hp / u.maxHp);
    const w = d.r * 2.2;
    const bx = p.x - w / 2, by = p.y + wob - d.r - 9;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(bx, by, w, 3);
    ctx.fillStyle = u.type === 'red' ? '#ff8a8a' : u.type === 'blue' ? '#8fb6ff' : '#f5d76e';
    ctx.fillRect(bx, by, w * hpPct, 3);
  }
}

function drawStar(cx, cy, spikes, outer, inner, color){
  let rot = -Math.PI / 2;
  const step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
  for (let i = 0; i < spikes; i++){
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.4)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawFloats(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 12px -apple-system,sans-serif';
  for (const f of state.floats){
    const a = Math.max(0, f.life / f.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }
}

function render(){
  ctx.save();

  if (state.shake > 0.4){
    ctx.translate(
      (Math.random() - 0.5) * state.shake,
      (Math.random() - 0.5) * state.shake
    );
  }

  drawBackground();
  drawPath();
  drawSlots();
  drawUnits();
  drawCore();
  drawFloats();

  ctx.restore();
}

function hexA(hex, a){
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${a})`;
}

/* ============================================================
   7. 输入
   ============================================================ */
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return {
    x: (cx - rect.left) * (CW / rect.width),
    y: (cy - rect.top) * (CH / rect.height)
  };
}

function handleTap(e){
  e.preventDefault();
  if (state.phase === 'over' || state.phase === 'win') return;

  const p = getPos(e);
  let hitSlot = null;

  for (const slot of state.slots){
    if (Math.hypot(slot.x - p.x, slot.y - p.y) <= 30){ hitSlot = slot; break; }
  }

  if (hitSlot){
    if (!hitSlot.tower && state.selectedType){
      const def = TOWERS[state.selectedType];
      if (canAfford(def.cost)){
        pay(def.cost);
        hitSlot.tower = state.selectedType;
        state.selectedType = null;
        state.selectedSlot = null;
        state.floats.push({
          x: hitSlot.x, y: hitSlot.y - 26,
          text: def.name, color: def.color, life: 1, max: 1
        });
      }
    } else if (hitSlot.tower){
      state.selectedSlot = (state.selectedSlot === hitSlot) ? null : hitSlot;
      state.selectedType = null;
    } else {
      state.selectedSlot = null;
    }
    refreshUI();
    return;
  }

  // 点空白取消选择
  state.selectedType = null;
  state.selectedSlot = null;
  refreshUI();
}

canvas.addEventListener('click', handleTap);
canvas.addEventListener('touchstart', handleTap, { passive: false });

/* ============================================================
   8. 按钮
   ============================================================ */
document.getElementById('startBtn').addEventListener('click', startWave);

document.getElementById('demolishBtn').addEventListener('click', () => {
  const slot = state.selectedSlot;
  if (!slot || !slot.tower) return;
  const def = TOWERS[slot.tower];
  for (const k in def.cost) state.res[k] += Math.floor(def.cost[k] / 2);
  slot.tower = null;
  state.selectedSlot = null;
  refreshUI();
});

document.getElementById('restart').addEventListener('click', () => {
  location.reload();
});

/* ============================================================
   9. 主循环
   ============================================================ */
let lastT = performance.now();
function loop(t){
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ============================================================
   10. 初始化
   ============================================================ */
enterPrep();
refreshUI();
requestAnimationFrame(loop);

})();
</script>
