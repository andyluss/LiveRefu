# 青橙全栈 P9 CI 模板（放到应用仓库 .github/workflows/ci.yml）
name: qc-app
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: smoke
        run: |
          node dist/server.mjs &
          pid=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health; then break; fi
            sleep 0.5
          done
          kill $pid
