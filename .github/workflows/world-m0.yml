name: RefuWorld M0

on:
  push:
    paths:
      - "games/world/**"
      - ".github/workflows/world-m0.yml"
  pull_request:
    paths:
      - "games/world/**"

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: games/world/code
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            games/world/code/target
          key: world-${{ matrix.os }}-${{ hashFiles('games/world/code/Cargo.lock') }}
      - name: Workspace tests
        run: cargo test --workspace
      - name: Determinism double-run
        run: cargo run -q -p world-cli -- test
      - name: Content tests (all packs)
        shell: bash
        run: |
          for pack in demo.harbor demo.market demo.greenhouse demo.orbit; do
            cargo run -q -p world-cli -- content-test --pack "../data/$pack"
          done

  c-abi:
    name: C ABI smoke (unix)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/world/code
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -q -p world-ffi -p world-cli
      - run: cargo run -q -p world-cli -- build --out ../dist/demo.harbor
      - run: cc hosts/c/main.c -I include -L target/debug -lworld_ffi -Wl,-rpath,$PWD/target/debug -o ../dist/c_host
      - run: ../dist/c_host --pack ../dist/demo.harbor/pack.data

  web:
    name: web preview checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 3D / Demo static contracts
        run: |
          node games/world/test/demo3d_static.mjs
          node games/world/test/demos_static.mjs
      - name: R-016 three-state theme (8 pages)
        run: >-
          node design/tools/check_html_theme.ts
          games/world/web/index.html
          games/world/web/editor.html
          games/world/web/demo3d.html
          games/world/web/iso.html
          games/world/web/orbit3d.html
          games/world/web/demos.html
          games/world/brief/HUB.html
          games/world/brief/GUIDE.html
      - name: Install TS tooling
        working-directory: games/world
        run: npm ci
      - name: TypeScript typecheck
        working-directory: games/world
        run: npm run check
      - name: TypeScript DSL compiler
        working-directory: games/world
        run: node tools/ts-build.mjs --src src/content/demo.harbor --out /tmp/refuworld-ts-demo

  wasm-core:
    name: wasm32 build (core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/world/code
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --target wasm32-unknown-unknown -p world-core


  real5k:
    name: real5k benchmark (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/world
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run real5k smoke
        run: |
          mkdir -p dist
          cargo run -q --release --manifest-path code/Cargo.toml -p world-cli -- \
            bench --scenario real5k --ticks 300 --runs 1 --json > dist/bench-real5k-ci.json
          node test/bench_real5k_check.mjs dist/bench-real5k-ci.json --no-perf

  wasm-world:
    name: wasm32 + QuickJS (world preview)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/world/code
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build world-wasm
        run: cargo build --release --target wasm32-unknown-unknown -p world-wasm
