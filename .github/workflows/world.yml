name: RefuWorld CI

on:
  push:
    paths:
      - "games/world/code/**"
      - "games/world/data/**"
      - "games/world/godot/**"
      - "games/world/godot-extension/**"
      - "games/world/src/**"
      - "games/world/web/**"
      - "games/world/test/**"
      - "games/world/lab/**"
      - "games/world/tools/**"
      - "games/world/package.json"
      - "games/world/package-lock.json"
      - "games/world/brief/**"
      - ".github/workflows/world.yml"
  pull_request:
    paths:
      - "games/world/code/**"
      - "games/world/data/**"
      - "games/world/godot/**"
      - "games/world/godot-extension/**"
      - "games/world/src/**"
      - "games/world/web/**"
      - "games/world/test/**"
      - "games/world/lab/**"
      - "games/world/tools/**"
      - "games/world/package.json"
      - "games/world/package-lock.json"
      - "games/world/brief/**"

concurrency:
  group: world-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: games/world/code
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            games/world/code/target
          key: world-${{ matrix.os }}-${{ hashFiles('games/world/code/Cargo.lock') }}
      - name: Workspace tests
        run: cargo test --workspace
      - name: Determinism double-run
        run: cargo run -q -p world-cli -- test
      - name: Content tests (all packs)
        shell: bash
        run: |
          for pack in ../data/demo.*; do
            [ -d "$pack" ] || continue
            cargo run -q -p world-cli -- content-test --pack "$pack"
          done

  c-abi:
    name: C ABI smoke (unix)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/world/code
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -q -p world-ffi -p world-cli
      - run: cargo run -q -p world-cli -- build --out ../dist/demo.harbor
      - run: cc hosts/c/main.c -I include -L target/debug -lworld_ffi -Wl,-rpath,$PWD/target/debug -o ../dist/c_host
      - run: ../dist/c_host --pack ../dist/demo.harbor/pack.data

  web:
    name: web preview checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Kernel layer boundaries
        run: node games/world/test/check_layers.mjs
      - name: 3D / Demo static contracts
        run: |
          node games/world/test/demo3d_static.mjs
          node games/world/test/demos_static.mjs
      - name: Lab game logic + static contracts
        run: |
          node games/world/lab/tetris/test/logic.test.mjs
          node games/world/lab/tetris/test/static.test.mjs
          node games/world/lab/tetris/test/refuworld.test.mjs
      - name: R-016 three-state theme (17 pages)
        run: >-
          node design/tools/check_html_theme.ts
          games/world/web/index.html
          games/world/web/editor.html
          games/world/web/demo3d.html
          games/world/web/iso.html
          games/world/web/orbit3d.html
          games/world/web/scene3d.html
          games/world/web/dock3d.html
          games/world/web/solarfarm3d.html
          games/world/web/cybercity3d.html
          games/world/web/whale.html
          games/world/web/demos.html
          games/world/brief/HUB.html
          games/world/brief/GUIDE.html
          games/world/lab/tetris/index.html
          games/world/lab/tetris/refuworld.html
          games/world/web/spacetime.html
          games/world/web/subject.html
      - name: Install TS tooling
        working-directory: games/world
        run: npm ci
      - name: TypeScript typecheck
        working-directory: games/world
        run: npm run check
      - name: TypeScript DSL compiler
        working-directory: games/world
        run: node tools/ts-build.mjs --src src/content/demo.harbor --out /tmp/refuworld-ts-demo
      - name: Node static web server smoke
        working-directory: games/world
        run: node test/serve_web_check.mjs
      - name: Editor v0.6 static contract
        working-directory: games/world
        run: node test/editor_static.mjs

  browser-runtime:
    name: browser runtime (2D/2.5D/3D)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/world
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen 0.2.129
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build web wasm + packs
        run: ./web/build.sh
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Browser smoke (2D / 2.5D / 3D)
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node web/test_browser_runtime.mjs

  wasm-core:
    name: wasm32 build (core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/world/code
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --target wasm32-unknown-unknown -p world-core


  real5k:
    name: real5k benchmark (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/world
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run real5k smoke
        run: |
          mkdir -p dist
          cargo run -q --release --manifest-path code/Cargo.toml -p world-cli -- \
            bench --scenario real5k --ticks 300 --runs 1 --json > dist/bench-real5k-ci.json
          node test/bench_real5k_check.mjs dist/bench-real5k-ci.json --no-perf
      - name: Run real5k-v2 smoke
        run: |
          cargo run -q --release --manifest-path code/Cargo.toml -p world-cli -- \
            bench --scenario real5k-v2 --ticks 300 --runs 1 --json > dist/bench-real5k-v2-ci.json
          node test/bench_real5k_check.mjs dist/bench-real5k-v2-ci.json --no-perf --v2

  wasm-world:
    name: wasm32 + QuickJS (world preview)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/world/code
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build world-wasm
        run: cargo build --release --target wasm32-unknown-unknown -p world-wasm

  godot-cts:
    name: Godot 4.7 CTS (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/world
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Godot 4.7
        run: |
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64
          sudo mv /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Build extension + run CTS
        env:
          GODOT_BIN: godot
        run: ./godot/cts.sh
      - name: Run 5k view benchmark
        env:
          GODOT_BIN: godot
        run: ./godot/bench5k.sh
      - name: Headless ↔ Godot event/save interop
        env:
          GODOT_BIN: godot
        run: |
          node test/check_m2_boundary.mjs
          ./godot/test.sh
      - name: Install Xvfb / software GL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Frame-time under Xvfb (software GL)
        env:
          GODOT_BIN: godot
          GODOT_RENDER_METHOD: gl_compatibility
          GODOT_RENDER_DRIVER: opengl3
          BENCH_HOST: ci-ubuntu-xvfb
          BENCH_JSON: ${{ github.workspace }}/games/world/dist/bench5k-gpu-ci.json
        run: |
          mkdir -p dist
          xvfb-run -a -s "-screen 0 1280x720x24" ./godot/bench5k_gpu.sh
          node test/bench5k_gpu_check.mjs dist/bench5k-gpu-ci.json
      - name: Upload frame-time artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-5k-frame
          path: games/world/dist/bench5k-gpu-ci.json
