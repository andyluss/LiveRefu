name: Verify

# 每次 push / PR 时，验证整个工作区（链接/数据契约/元规则结构/演进/STRUCTURE.md/规则目录/可视面刷新/Godot 加载），全部用 TS 脚本
# （node --experimental-strip-types 直接跑；脚本均为 node/deno/bun 兼容，见
#   lab/formal-system/tech/rules/T01-default-ts-scripts.md）：
#   1. Markdown 相对链接是否失效 (tools/check_links.ts)
#   2. 数据表是否符合 schema 契约 (tools/check_data.ts)
#   3. Refu Game 001 难度模型自检与章节带位校验 (tools/sim_refu_game_001.ts --selftest / --verify-bands)
#   4. 元规则结构(M1+M2)/演进状态(M3)/STRUCTURE.md(M4) (lab/formal-system/concerns/meta-rules/*.ts)
#   5. 规则目录 rules/ 的结构(M1+M2) 与规则演进状态(M3, 覆盖元规则 M 与具体规则 R) (rules/meta/*.ts)
#   6. 刷新入口页（hub.ts --run 一键重新生成全部可视面）
#   7. Godot 脚本静态检查 (godot --headless --import/--check-only --path game)
# 用于兜底：即使本地未启用 pre-commit 钩子，推上来也会被这里拦下。
#
# 远端：https://github.com/andyluss/LiveRefu —— push / PR 到 main 时本 workflow 自动生效。
# 若用 GitLab，请改写为 .gitlab-ci.yml 的对应 job。Godot 检查用 barichello/godot-ci 镜像。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # 先刷新可视面：viz/*.html 为生成物且被 gitignore，链接校验需在生成后运行才能解析 viz/index.html。
      - name: Refresh visual surfaces (hub.ts --run)
        run: node --experimental-strip-types lab/formal-system/concerns/visual-fallback/tools/hub.ts --run

      - name: Markdown link check (TS)
        run: node --experimental-strip-types tools/check_links.ts -v

      - name: Data table schema check (TS)
        run: node --experimental-strip-types tools/check_data.ts -v

      - name: Refu Game 001 difficulty model self-test (TS)
        run: node --experimental-strip-types tools/sim_refu_game_001.ts --selftest

      - name: Refu Game 001 difficulty band check (TS)
        run: node --experimental-strip-types tools/sim_refu_game_001.ts --verify-bands --n 20000

      - name: Refu Game 001 content checks (TS)
        run: |
          node --experimental-strip-types tools/sim_refu_game_001.ts --verify-rogue --n 20000
          node --experimental-strip-types tools/sim_refu_game_001.ts --verify-faction
          node --experimental-strip-types tools/sim_refu_game_001.ts --verify-seed
          node --experimental-strip-types tools/sim_refu_game_001.ts --verify-anti-air
          node --experimental-strip-types tools/sim_refu_game_001.ts --verify-air-matrix
          node --experimental-strip-types tools/sim_refu_game_001.ts --verify-air-mix
          node --experimental-strip-types tools/sim_refu_game_001.ts --verify-pmod

      - name: Meta-rules structure check (M1+M2, TS)
        run: node --experimental-strip-types lab/formal-system/concerns/meta-rules/tools/meta_rules_check.ts

      - name: Meta-rule evolution state check (M3, TS)
        run: node --experimental-strip-types lab/formal-system/concerns/meta-rules/evolution/rule_evolution_check.ts

      - name: Directory STRUCTURE.md check (M4, TS)
        run: node --experimental-strip-types lab/formal-system/concerns/meta-rules/tools/structure_check.ts

      - name: Rules directory structure check (M1+M2, rules/, TS)
        run: node --experimental-strip-types rules/meta/tools/meta_rules_check.ts

      - name: Rules + meta-rule evolution state check (M3, TS)
        run: node --experimental-strip-types rules/meta/evolution/rule_evolution_check.ts

      - name: Godot project load check
        run: |
          # 让 Godot 真正加载工程(主场景+autoload链编译+_verify_closed_loop自检)，
          # 暴露脚本编译错误/资源加载错误。GDScript 弱类型, 无法整工程静态扫描,
          # 故用运行时加载 + 已内建的自检(closed_loop VERIFY)作为"编译期/回归"验证。
          # 沙箱下需 HOME 指向可写目录, 否则 user:// 创建失败。
          # 直接用 runner 自带的 docker 跑镜像(不依赖第三方 Action)；镜像含 Godot 4.7.2 于 /usr/local/bin/godot。
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app/projects/tomorrows-channel/game \
            -e HOME=/tmp/gdhome \
            barichello/godot-ci:4.7.2 \
            godot --headless --path . --quit-after 5

      # ── 主线项目 future-debris 的八道闸门 ──────────────────────────────
      # 为什么要拆成两步：闸门 1–3 只需 python3，闸门 4–8 只需 godot，
      # 而 Godot 容器里**没有 python3**（godot-ci 镜像）。因此按运行环境分流：
      # python 门在 runner 上跑（ubuntu-latest 自带 python3），godot 门在容器里跑。
      # 两条命令都走项目自己的 `run.sh`——**不在 CI 里复制任何检查逻辑**，
      # 否则 CI 与本地会慢慢分叉（这正是"文档/配置与代码对账"要避免的事）。
      - name: Future Debris gates 1–3 (python: file budget / data contract / visual tokens)
        run: ./projects/mainline/future-debris/run.sh check --python-only

      - name: Future Debris gates 4–8 (godot: import / theme / boot / gameplay / scene)
        run: |
          # `run.sh` 靠**上溯查找 .git** 定位工作区根（不是数 `..` 层数），
          # 因此挂载到 /app 后它会自动把 HOME 指到 /app/.godot-home（可写）。
          # `--godot-only` 不触碰 python，故容器无需安装 python3。
          # 显式 `--entrypoint bash`：不依赖镜像默认 entrypoint 的语义
          # （同一 workflow 里另一处直接用 `godot …` 作命令，两种写法混用容易踩坑）。
          # ⚠️ 本步**未在本地验证过**（本地 docker 守护进程未运行，无法拉镜像试跑）；
          #    若首次在 CI 失败，优先看这两点：镜像内 `godot` 是否在 PATH、`bash` 是否存在。
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app/projects/mainline/future-debris \
            --entrypoint bash \
            barichello/godot-ci:4.7.2 \
            -c './run.sh check --godot-only'
