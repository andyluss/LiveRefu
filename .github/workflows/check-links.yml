name: Checks

# 每次 push / PR 时，跑三类检查：
#   1. Markdown 相对链接是否失效 (tools/check_links.py)
#   2. 数据表是否符合 schema 契约 (tools/check_data.py)
#   3. Godot 脚本静态检查 (godot --headless --import/--check-only --path game)
# 用于兜底：即使本地未启用 pre-commit 钩子，推上来也会被这里拦下。
#
# 注：本仓库当前无远端(remote)；配置托管平台(如 GitHub)后此文件即自动生效。
# 若用 GitLab，请改写为 .gitlab-ci.yml 的对应 job。Godot 检查用 godotengine/godot 镜像。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Markdown link check
        run: python3 tools/check_links.py -v

      - name: Data table schema check
        run: python3 tools/check_data.py -v

      - name: Meta-rules structure check (M1+M2)
        run: python3 lab/formal-system/tools/meta_rules_check.py

      - name: Godot project load check
        uses: addnab/action-run-docker@v3
        with:
          image: ghcr.io/godotengine/godot:4.7-mono
          options: -v ${{ github.workspace }}:/app
          run: |
            # 让 Godot 真正加载工程(主场景+autoload链编译+_verify_closed_loop自检)，
            # 暴露脚本编译错误/资源加载错误。GDScript 弱类型, 无法整工程静态扫描,
            # 故用运行时加载 + 已内建的自检(closed_loop VERIFY)作为"编译期/回归"验证。
            # 沙箱下需 HOME 指向可写目录, 否则 user:// 创建失败。
            cd /app/projects/tomorrows-channel/game
            HOME=/tmp/gdhome godot --headless --path . --quit-after 5 || exit 1
