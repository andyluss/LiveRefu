<?xml version="1.0" encoding="UTF-8"?>
<!-- 03 卡面 · 原子纪元（模块化基座 / RC-ATOMIC-001）| 给谁看：美术评审 + 卡面实现者 | 用途：按语法层固定的信息位置契约画一张完整卡面（顶部条 64 / 插画 300 / 关键词 44 / 数值 90 / 风味 120 / 底部条 48），并按原子纪元风格卡做材质与母题 | token 来源：future-debris 设计 token 契约表（语法层色值 + 原子纪元风格卡的镀铬 / 搪瓷 / 塑料材质与扫描线处理）；未引入新色相，明暗靠不透明度叠加 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 720" width="520" height="720">
  <defs>
    <!-- 扫描线：4px 一条极淡暗线，α≈0.04 -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#10161C" opacity="0.04"/>
    </pattern>
    <!-- 极轻噪点 -->
    <pattern id="noise" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="1" height="1" fill="#F3EDE1" opacity="0.05"/>
      <rect x="9" y="6" width="1" height="1" fill="#10161C" opacity="0.10"/>
      <rect x="5" y="11" width="1" height="1" fill="#F3EDE1" opacity="0.04"/>
      <rect x="12" y="1" width="1" height="1" fill="#10161C" opacity="0.07"/>
    </pattern>
    <!-- 镀铬（圆柱体）：左冷蓝灰 → 近白高光 → 中灰 → 冷蓝灰 -->
    <linearGradient id="chromeCyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66727F"/>
      <stop offset="0.16" stop-color="#F3EDE1"/>
      <stop offset="0.40" stop-color="#A9A395"/>
      <stop offset="0.68" stop-color="#66727F"/>
      <stop offset="1" stop-color="#2A3742"/>
    </linearGradient>
    <!-- 插画区背光（洁净白光自上而下） -->
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4FD1C5" stop-opacity="0.13"/>
      <stop offset="0.65" stop-color="#4FD1C5" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="520" height="720" rx="8"/>
    </clipPath>
    <clipPath id="illusClip">
      <rect x="24" y="90" width="472" height="300" rx="4"/>
    </clipPath>
  </defs>

  <!-- ============ 卡底 ============ -->
  <rect x="0.75" y="0.75" width="518.5" height="718.5" rx="8" fill="#212E3A" stroke="#66727F" stroke-width="1.5"/>
  <!-- 镀铬边缘：上缘一道极淡高光 -->
  <line x1="18" y1="2.4" x2="502" y2="2.4" stroke="#F3EDE1" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- ============ 1 顶部条（高 64：y 26–90）============ -->
  <text x="36" y="62" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="0.5" fill="#F3EDE1">模块化基座</text>
  <text x="36" y="79" font-family="ui-monospace, Menlo, monospace" font-size="8" letter-spacing="2.5" fill="#8B8578">MODULAR PLINTH</text>

  <text x="432" y="62" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#8B8578">费用 COST</text>
  <circle cx="466" cy="58" r="24" fill="#212E3A" stroke="#66727F" stroke-width="1.5"/>
  <circle cx="466" cy="58" r="24" fill="none" stroke="#F3EDE1" stroke-opacity="0.08" stroke-width="1"/>
  <text x="466" y="67" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#F3EDE1">2</text>

  <line x1="24" y1="90" x2="496" y2="90" stroke="#2A3742" stroke-width="1"/>

  <!-- ============ 2 插画区（高 300：y 90–390）============ -->
  <rect x="24" y="90" width="472" height="300" rx="4" fill="#18212B"/>
  <g clip-path="url(#illusClip)">
    <circle cx="260" cy="250" r="215" fill="url(#glow)"/>

    <!-- 角落星爆纹（原子母题，压在信息之下） -->
    <g stroke="#F3EDE1" stroke-opacity="0.16" stroke-width="1.5" stroke-linecap="round">
      <line x1="66" y1="132" x2="66" y2="108"/><line x1="54" y1="120" x2="78" y2="120"/>
      <line x1="58" y1="112" x2="74" y2="128"/><line x1="74" y1="112" x2="58" y2="128"/>
      <line x1="452" y1="132" x2="452" y2="108"/><line x1="440" y1="120" x2="464" y2="120"/>
      <line x1="444" y1="112" x2="460" y2="128"/><line x1="460" y1="112" x2="444" y2="128"/>
    </g>

    <!-- 地面 -->
    <rect x="24" y="354" width="472" height="36" fill="#10161C" opacity="0.5"/>
    <ellipse cx="260" cy="354" rx="152" ry="10" fill="#10161C" opacity="0.45"/>
    <line x1="24" y1="354" x2="496" y2="354" stroke="#66727F" stroke-opacity="0.35" stroke-width="1"/>

    <!-- 侧舱：胶囊形仪表（圆润家居感），左电力 / 右残渣 -->
    <rect x="134" y="282" width="44" height="72" rx="22" fill="#212E3A" stroke="#66727F" stroke-width="1.5"/>
    <rect x="138" y="308" width="36" height="42" rx="18" fill="#4FD1C5" opacity="0.75"/>
    <line x1="140" y1="300" x2="172" y2="300" stroke="#66727F" stroke-opacity="0.55" stroke-width="1"/>
    <rect x="342" y="282" width="44" height="72" rx="22" fill="#212E3A" stroke="#66727F" stroke-width="1.5"/>
    <rect x="346" y="322" width="36" height="28" rx="14" fill="#FF6B35" opacity="0.6"/>
    <line x1="348" y1="314" x2="380" y2="314" stroke="#66727F" stroke-opacity="0.55" stroke-width="1"/>

    <!-- 管线 -->
    <line x1="190" y1="336" x2="176" y2="354" stroke="#66727F" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="330" y1="336" x2="344" y2="354" stroke="#66727F" stroke-opacity="0.7" stroke-width="1.5"/>

    <!-- 基座（搪瓷 + 塑料面板） -->
    <rect x="190" y="316" width="140" height="38" rx="4" fill="#212E3A" stroke="#66727F" stroke-width="1.5"/>
    <rect x="190" y="316" width="140" height="7" rx="3" fill="#E4572E"/>
    <rect x="206" y="330" width="34" height="12" rx="2" fill="#10161C" opacity="0.45"/>
    <rect x="280" y="330" width="34" height="12" rx="2" fill="#10161C" opacity="0.45"/>

    <!-- 供电模块（镀铬 + 三枚薄荷胶囊仪表） -->
    <rect x="204" y="262" width="112" height="54" rx="4" fill="url(#chromeCyl)" stroke="#66727F" stroke-width="1.5"/>
    <rect x="204" y="262" width="112" height="7" rx="3" fill="#F3EDE1" opacity="0.18"/>
    <rect x="214" y="288" width="24" height="16" rx="8" fill="#4FD1C5" opacity="0.9"/>
    <rect x="246" y="288" width="24" height="16" rx="8" fill="#4FD1C5" opacity="0.7"/>
    <rect x="278" y="288" width="24" height="16" rx="8" fill="#4FD1C5" opacity="0.5"/>

    <!-- 上层模块（搪瓷带 + 塑料顶） -->
    <rect x="222" y="214" width="76" height="48" rx="4" fill="#212E3A" stroke="#66727F" stroke-width="1.5"/>
    <rect x="222" y="214" width="76" height="5" rx="2" fill="#F3EDE1" opacity="0.12"/>
    <rect x="222" y="234" width="76" height="8" fill="#E4572E"/>

    <!-- 颈部 + 天线 + 抛物面 -->
    <rect x="250" y="196" width="20" height="18" fill="url(#chromeCyl)" stroke="#66727F" stroke-width="1"/>
    <line x1="260" y1="190" x2="260" y2="152" stroke="#A9A395" stroke-width="2"/>
    <circle cx="260" cy="148" r="5" fill="#FFC857"/>
    <ellipse cx="260" cy="190" rx="36" ry="11" fill="url(#chromeCyl)" stroke="#66727F" stroke-width="1.5"/>
    <ellipse cx="260" cy="187" rx="31" ry="7" fill="none" stroke="#F3EDE1" stroke-opacity="0.25" stroke-width="1"/>

    <!-- 原子轨道 + 电子 -->
    <ellipse cx="260" cy="210" rx="112" ry="30" fill="none" stroke="#4FD1C5" stroke-opacity="0.7" stroke-width="1.5" transform="rotate(-16 260 210)"/>
    <ellipse cx="260" cy="210" rx="86" ry="22" fill="none" stroke="#F3EDE1" stroke-opacity="0.26" stroke-width="1" transform="rotate(22 260 210)"/>
    <circle cx="366" cy="180" r="4.5" fill="#E4572E"/>
    <circle cx="154" cy="240" r="4.5" fill="#E4572E"/>
    <circle cx="252" cy="230" r="4" fill="#FFC857"/>

    <!-- 图像处理：扫描线 + 极轻噪点 -->
    <rect x="24" y="90" width="472" height="300" fill="url(#scan)"/>
    <rect x="24" y="90" width="472" height="300" fill="url(#noise)"/>

    <text x="36" y="378" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#8B8578">ILLUSTRATION 300px · 模块化基座（镀铬 + 搪瓷 + 原子纹）</text>
  </g>
  <rect x="24" y="90" width="472" height="300" rx="4" fill="none" stroke="#2A3742" stroke-width="1"/>

  <!-- ============ 3 关键词条（高 44：y 390–434）============ -->
  <rect x="24" y="399" width="76" height="26" rx="13" fill="#212E3A" stroke="#66727F" stroke-width="1.5"/>
  <circle cx="38" cy="412" r="3.5" fill="#66727F"/>
  <text x="66" y="416" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#A9A395">基座</text>

  <rect x="108" y="399" width="76" height="26" rx="13" fill="#212E3A" stroke="#66727F" stroke-width="1.5"/>
  <circle cx="122" cy="412" r="3.5" fill="#4FD1C5"/>
  <text x="150" y="416" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#A9A395">供电</text>

  <text x="496" y="416" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#8B8578">关键词</text>
  <line x1="24" y1="434" x2="496" y2="434" stroke="#2A3742" stroke-width="1"/>

  <!-- ============ 4 数值块（高 90：y 434–524）三格并排 ============ -->
  <!-- 电力 -->
  <rect x="24" y="440" width="152" height="78" rx="4" fill="#18212B" stroke="#2A3742" stroke-width="1"/>
  <rect x="24" y="440" width="152" height="3" rx="1.5" fill="#4FD1C5"/>
  <text x="100" y="464" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">电力 / POWER</text>
  <text x="100" y="504" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="30" fill="#4FD1C5">1</text>

  <!-- 残渣 -->
  <rect x="184" y="440" width="152" height="78" rx="4" fill="#18212B" stroke="#2A3742" stroke-width="1"/>
  <rect x="184" y="440" width="152" height="3" rx="1.5" fill="#FF6B35"/>
  <text x="260" y="464" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">残渣 / RESIDUE</text>
  <text x="260" y="504" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="30" fill="#FF6B35">1</text>

  <!-- 战力（用 --text，不抢资源色） -->
  <rect x="344" y="440" width="152" height="78" rx="4" fill="#18212B" stroke="#2A3742" stroke-width="1"/>
  <rect x="344" y="440" width="152" height="3" rx="1.5" fill="#F3EDE1"/>
  <text x="420" y="464" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">战力 / MIGHT</text>
  <text x="420" y="504" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="30" fill="#F3EDE1">6</text>

  <!-- ============ 5 风味文本区（高 120：y 524–644）============ -->
  <line x1="24" y1="524" x2="496" y2="524" stroke="#2A3742" stroke-width="1"/>
  <text x="36" y="550" font-family="ui-monospace, Menlo, monospace" font-size="8" letter-spacing="2.5" fill="#8B8578">风味 FLAVOR</text>

  <!-- 右侧原子纹底纹（不压信息） -->
  <g stroke="#F3EDE1" stroke-opacity="0.10" stroke-width="1.5" stroke-linecap="round">
    <line x1="466" y1="576" x2="466" y2="556"/><line x1="456" y1="566" x2="476" y2="566"/>
    <line x1="459" y1="559" x2="473" y2="573"/><line x1="473" y1="559" x2="459" y2="573"/>
  </g>
  <ellipse cx="452" cy="612" rx="42" ry="14" fill="none" stroke="#4FD1C5" stroke-opacity="0.14" stroke-width="1.5" transform="rotate(-18 452 612)"/>
  <ellipse cx="452" cy="612" rx="32" ry="10" fill="none" stroke="#F3EDE1" stroke-opacity="0.10" stroke-width="1" transform="rotate(24 452 612)"/>

  <rect x="24" y="562" width="2" height="48" fill="#2A3742"/>
  <text x="40" y="582" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#A9A395">部署后为相邻塔位提供 1 点电力。</text>
  <text x="40" y="606" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#A9A395">每回合累积 1 点残渣。</text>

  <!-- ============ 6 底部条（高 48：y 644–692）============ -->
  <rect x="24" y="644" width="472" height="48" rx="4" fill="#18212B"/>
  <line x1="24" y1="644.5" x2="496" y2="644.5" stroke="#2A3742" stroke-width="1"/>
  <circle cx="40" cy="670" r="4" fill="#A9A395"/>
  <text x="54" y="674" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#A9A395">原子能委员会</text>
  <text x="484" y="674" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1" fill="#8B8578">RC-ATOMIC-001</text>

  <!-- ============ 全卡图像处理（扫描线 + 噪点，压在文字之下感）============ -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="520" height="720" fill="url(#scan)"/>
    <rect x="0" y="0" width="520" height="720" fill="url(#noise)"/>
  </g>
  <!-- 卡框描边压在最上 -->
  <rect x="0.75" y="0.75" width="518.5" height="718.5" rx="8" fill="none" stroke="#66727F" stroke-width="1.5"/>
</svg>
