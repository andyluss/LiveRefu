<?xml version="1.0" encoding="UTF-8"?>
<!-- 02 风格卡 · 原子纪元（Atomic Era / 太空时代 1955–1965）| 给谁看：美术评审 | 用途：确认本纪元的材质隐喻、装饰母题、光源逻辑与图像处理，以及它与其它纪元的差别 | token 来源：future-debris 设计 token 契约表（语法层）；本图只用表中色值的明暗变体（靠不透明度叠加实现），未引入新色相 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <!-- 扫描线：4px 一条极淡暗线，α≈0.04 -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#10161C" opacity="0.04"/>
    </pattern>
    <!-- 极轻噪点 -->
    <pattern id="noise" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="1" height="1" fill="#F3EDE1" opacity="0.05"/>
      <rect x="9" y="6" width="1" height="1" fill="#10161C" opacity="0.10"/>
      <rect x="5" y="11" width="1" height="1" fill="#F3EDE1" opacity="0.04"/>
      <rect x="12" y="1" width="1" height="1" fill="#10161C" opacity="0.07"/>
      <rect x="7" y="8" width="1" height="1" fill="#F3EDE1" opacity="0.03"/>
    </pattern>
    <!-- 镀铬（横向长反射带）：近白 → 中灰 → 冷蓝灰 -->
    <linearGradient id="chromeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6F7B89"/>
      <stop offset="0.10" stop-color="#F3EDE1"/>
      <stop offset="0.26" stop-color="#A9A395"/>
      <stop offset="0.42" stop-color="#6F7B89"/>
      <stop offset="0.52" stop-color="#F3EDE1"/>
      <stop offset="0.68" stop-color="#A9A395"/>
      <stop offset="0.84" stop-color="#6F7B89"/>
      <stop offset="1" stop-color="#2A3742"/>
    </linearGradient>
    <!-- 镀铬（圆柱体）：左暗 → 近白高光 → 中灰 → 冷蓝灰 -->
    <linearGradient id="chromeCyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6F7B89"/>
      <stop offset="0.16" stop-color="#F3EDE1"/>
      <stop offset="0.40" stop-color="#A9A395"/>
      <stop offset="0.68" stop-color="#6F7B89"/>
      <stop offset="1" stop-color="#2A3742"/>
    </linearGradient>
    <!-- 放射太阳：核心黄 → 边缘橙 -->
    <radialGradient id="sunDisc">
      <stop offset="0" stop-color="#FFC857"/>
      <stop offset="0.62" stop-color="#FFC857" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#FFC857" stop-opacity="0.50"/>
      <stop offset="0.55" stop-color="#FF6B35" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="heroClip">
      <rect x="40" y="96" width="470" height="326" rx="8"/>
    </clipPath>
  </defs>

  <!-- ============ 底 ============ -->
  <rect x="0" y="0" width="1000" height="620" fill="#10161C"/>

  <!-- ============ 页眉 ============ -->
  <rect x="0" y="0" width="1000" height="76" fill="#18212B"/>
  <line x1="0" y1="76.5" x2="1000" y2="76.5" stroke="#2A3742" stroke-width="1"/>
  <text x="48" y="40" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="1" fill="#F3EDE1">风格卡 · 原子纪元</text>
  <text x="48" y="61" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#A9A395">ATOMIC ERA / 1955–1965 · 镀铬 + 搪瓷 + 塑料 · 洁净白光 · 圆润家居感 · rev2：色值与字号对齐契约 docs/04</text>
  <text x="952" y="40" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1" fill="#9E9889">STYLE SAMPLE 02 · rev2</text>
  <text x="952" y="61" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#9E9889">纪元专属层 · 可整体替换</text>

