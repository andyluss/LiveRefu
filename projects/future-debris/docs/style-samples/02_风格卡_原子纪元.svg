    <path d="M245,312 L207,380 L245,358 Z" fill="url(#chromeCyl)" stroke="#6F7B89" stroke-width="1.5"/>
    <path d="M305,312 L343,380 L305,358 Z" fill="url(#chromeCyl)" stroke="#6F7B89" stroke-width="1.5"/>
    <path d="M258,342 L292,342 L301,362 L249,362 Z" fill="#2A3742" stroke="#6F7B89" stroke-width="1"/>
    <ellipse cx="275" cy="366" rx="24" ry="9" fill="#FFC857" opacity="0.20"/>
    <path d="M275,162 C293,180 305,198 305,224 L305,342 L245,342 L245,224 C245,198 257,180 275,162 Z" fill="url(#chromeCyl)" stroke="#6F7B89" stroke-width="1.5"/>
    <!-- 搪瓷色带 + 上缘高光 -->
    <rect x="245" y="300" width="60" height="13" fill="#E4572E"/>
    <rect x="245" y="300" width="60" height="5" fill="#F3EDE1" opacity="0.18"/>
    <!-- 舷窗（半透明塑料 + 薄荷内光） -->
    <circle cx="275" cy="240" r="15" fill="#4FD1C5" opacity="0.9"/>
    <circle cx="275" cy="240" r="15" fill="none" stroke="#6F7B89" stroke-width="1.5"/>
    <circle cx="275" cy="240" r="10" fill="#10161C" opacity="0.35"/>
    <circle cx="270" cy="234" r="4" fill="#F3EDE1" opacity="0.7"/>
    <!-- 原子轨道（前层）+ 电子 -->
    <ellipse cx="275" cy="250" rx="158" ry="46" fill="none" stroke="#4FD1C5" stroke-opacity="0.35" stroke-width="1" transform="rotate(-18 275 250)"/>
    <circle cx="259" cy="280" r="4.5" fill="#FFC857"/>
    <circle cx="291" cy="220" r="4.5" fill="#FFC857"/>
    <!-- 图像处理：扫描线 + 噪点 -->
    <rect x="40" y="96" width="470" height="326" fill="url(#scan)"/>
    <rect x="40" y="96" width="470" height="326" fill="url(#noise)"/>
  </g>
  <rect x="40" y="96" width="470" height="326" rx="8" fill="none" stroke="#6F7B89" stroke-width="1.5"/>
  <text x="52" y="116" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1" fill="#A9A395">HERO · 镀铬尾鳍火箭 / 原子轨道 / 放射太阳</text>
