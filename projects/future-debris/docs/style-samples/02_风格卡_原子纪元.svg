    <rect x="40" y="386" width="470" height="36" fill="#10161C" opacity="0.72"/>
    <line x1="40" y1="386" x2="510" y2="386" stroke="#6F7B89" stroke-opacity="0.55" stroke-width="1"/>
    <!-- 原子轨道（后层） -->
    <ellipse cx="275" cy="250" rx="158" ry="46" fill="none" stroke="#4FD1C5" stroke-opacity="0.7" stroke-width="1.5" transform="rotate(-18 275 250)"/>
    <ellipse cx="275" cy="250" rx="118" ry="34" fill="none" stroke="#F3EDE1" stroke-opacity="0.30" stroke-width="1" transform="rotate(28 275 250)"/>
    <circle cx="125" cy="299" r="5" fill="#E4572E"/>
    <circle cx="425" cy="201" r="5" fill="#E4572E"/>
