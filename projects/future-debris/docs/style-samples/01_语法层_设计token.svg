<?xml version="1.0" encoding="UTF-8"?>
<!-- 01 语法层 · 设计 token 样张 | 给谁看：美术评审 + UI 实现者 | 用途：一眼确认全局信息层级、色板与控件外观，且换代纪元时此层不变 | token 来源：future-debris 设计 token 契约表（GDD）——色值仅取自该表，全靠不透明度叠加做明暗，未引入任何新色值 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <!-- 扫描线：每 4px 一条极淡暗线，α≈0.04 -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#10161C" opacity="0.04"/>
    </pattern>
    <!-- 扫描线放大示意（8×）：仅为让评审看见，实际不这么重 -->
    <pattern id="scanZoom" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="32" height="8" fill="#10161C" opacity="0.06"/>
    </pattern>
    <!-- 极轻噪点 -->
    <pattern id="noise" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="1" y="2" width="1" height="1" fill="#F3EDE1" opacity="0.05"/>
      <rect x="7" y="5" width="1" height="1" fill="#10161C" opacity="0.10"/>
      <rect x="4" y="9" width="1" height="1" fill="#F3EDE1" opacity="0.04"/>
      <rect x="10" y="11" width="1" height="1" fill="#10161C" opacity="0.08"/>
      <rect x="2" y="7" width="1" height="1" fill="#F3EDE1" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- ============ 底 ============ -->
  <rect x="0" y="0" width="1000" height="620" fill="#10161C"/>

  <!-- ============ 页眉 ============ -->
  <rect x="0" y="0" width="1000" height="76" fill="#18212B"/>
  <line x1="0" y1="76.5" x2="1000" y2="76.5" stroke="#2A3742" stroke-width="1"/>
  <text x="48" y="40" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="1" fill="#F3EDE1">语法层 · DESIGN TOKENS</text>
  <text x="48" y="61" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#A9A395">future-debris / 全局共享层 · 不随纪元变化 · 纪元风格见 02 / 03</text>
  <text x="952" y="40" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1" fill="#8B8578">STYLE SAMPLE 01</text>
  <text x="952" y="61" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">1000 × 620</text>

  <!-- ============ A 色板 ============ -->
  <text x="48" y="104" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#8B8578">A · COLOR TOKENS / 颜色</text>

  <!-- 第一行 7 枚 -->
  <g>
    <rect x="48" y="112" width="120" height="52" rx="4" fill="#10161C" stroke="#66727F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="48" y="178" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#F3EDE1">--bg-base</text>
    <text x="48" y="190" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">#10161C</text>

    <rect x="180" y="112" width="120" height="52" rx="4" fill="#18212B" stroke="#66727F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="180" y="178" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#F3EDE1">--bg-elev-1</text>
    <text x="180" y="190" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">#18212B</text>

    <rect x="312" y="112" width="120" height="52" rx="4" fill="#212E3A" stroke="#66727F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="312" y="178" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#F3EDE1">--bg-elev-2</text>
    <text x="312" y="190" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">#212E3A</text>

    <rect x="444" y="112" width="120" height="52" rx="4" fill="#F3EDE1" stroke="#66727F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="444" y="178" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#F3EDE1">--text</text>
    <text x="444" y="190" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">#F3EDE1</text>

    <rect x="576" y="112" width="120" height="52" rx="4" fill="#A9A395" stroke="#66727F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="576" y="178" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#F3EDE1">--text-dim</text>
    <text x="576" y="190" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">#A9A395</text>

    <rect x="708" y="112" width="120" height="52" rx="4" fill="#8B8578" stroke="#66727F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="708" y="178" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#F3EDE1">--text-faint</text>
    <text x="708" y="190" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">#8B8578（可访问性下限）</text>

    <rect x="840" y="112" width="120" height="52" rx="4" fill="#2A3742" stroke="#66727F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="840" y="178" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#F3EDE1">--line</text>
    <text x="840" y="190" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">#2A3742 · 装饰 1px</text>
  </g>

  <!-- 第二行 6 枚 -->
  <g>
    <rect x="48" y="200" width="120" height="52" rx="4" fill="#66727F" stroke="#66727F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="48" y="266" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#F3EDE1">--line-strong</text>
    <text x="48" y="278" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">#66727F · 控件边框</text>

    <rect x="180" y="200" width="120" height="52" rx="4" fill="#4FD1C5" stroke="#66727F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="180" y="266" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#F3EDE1">--power</text>
    <text x="180" y="278" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">#4FD1C5 · 电力</text>

    <rect x="312" y="200" width="120" height="52" rx="4" fill="#FF6B35" stroke="#66727F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="312" y="266" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#F3EDE1">--residue</text>
    <text x="312" y="278" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">#FF6B35 · 残渣</text>

    <rect x="444" y="200" width="120" height="52" rx="4" fill="#E4572E" stroke="#66727F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="444" y="266" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#F3EDE1">--accent</text>
    <text x="444" y="278" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">#E4572E · 单一焦点</text>

    <rect x="576" y="200" width="120" height="52" rx="4" fill="#FFC857" stroke="#66727F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="576" y="266" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#F3EDE1">--warn</text>
    <text x="576" y="278" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">#FFC857 · 危险阈值</text>

    <rect x="708" y="200" width="120" height="52" rx="4" fill="#7BD389" stroke="#66727F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="708" y="266" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#F3EDE1">--ok</text>
    <text x="708" y="278" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">#7BD389 · 洁净</text>

    <!-- 非颜色型 token 一并说明，避免实现者漏掉 -->
    <rect x="840" y="200" width="120" height="52" rx="4" fill="#18212B" stroke="#2A3742" stroke-width="1"/>
    <text x="848" y="220" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#A9A395">font-family</text>
    <text x="848" y="232" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#8B8578">ui-monospace, Menlo</text>
    <text x="848" y="244" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#A9A395">radius 4 / 8px · stroke 1.5</text>
    <text x="840" y="266" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#F3EDE1">形状 token</text>
    <text x="840" y="278" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">无大圆角</text>
  </g>

  <line x1="48" y1="304" x2="952" y2="304" stroke="#2A3742" stroke-width="1"/>

  <!-- ============ B 字体层级 ============ -->
  <text x="48" y="326" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#8B8578">B · TYPE SCALE / 字体层级</text>

  <text x="48" y="358" font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#F3EDE1">残渣降级区</text>
  <text x="500" y="358" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">大标题 20px · --text</text>
  <line x1="48" y1="368" x2="500" y2="368" stroke="#2A3742" stroke-width="1"/>

  <text x="48" y="392" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#F3EDE1">供电网络 / POWER GRID</text>
  <text x="500" y="392" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">小标题 14px · --text</text>
  <line x1="48" y1="402" x2="500" y2="402" stroke="#2A3742" stroke-width="1"/>

  <text x="48" y="424" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#A9A395">部署后为相邻塔位提供 1 点电力。</text>
  <text x="500" y="424" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">正文 11px · --text-dim</text>
  <line x1="48" y1="434" x2="500" y2="434" stroke="#2A3742" stroke-width="1"/>

  <text x="48" y="456" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">RC-ATOMIC-001 · 原子能委员会 · 脚注</text>
  <text x="500" y="456" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">脚注 9px · --text-faint</text>

  <!-- ============ C 间距尺度 ============ -->
  <text x="536" y="326" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#8B8578">C · SPACING / 间距尺度</text>
  <line x1="536" y1="368" x2="952" y2="368" stroke="#2A3742" stroke-width="1"/>
  <line x1="536" y1="424.5" x2="952" y2="424.5" stroke="#2A3742" stroke-width="1"/>

  <!-- 6 根尺度条：基线对齐在 y=424，高度＝数值 -->
  <rect x="536" y="420" width="22" height="4" fill="#66727F"/>
  <rect x="572" y="416" width="22" height="8" fill="#66727F"/>
  <rect x="608" y="412" width="22" height="12" fill="#66727F"/>
  <rect x="644" y="408" width="22" height="16" fill="#66727F"/>
  <rect x="680" y="400" width="22" height="24" fill="#66727F"/>
  <rect x="716" y="392" width="22" height="32" fill="#66727F"/>
  <text x="547" y="440" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">4</text>
  <text x="583" y="440" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">8</text>
  <text x="619" y="440" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">12</text>
  <text x="655" y="440" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">16</text>
  <text x="691" y="440" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">24</text>
  <text x="727" y="440" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">32</text>

  <text x="790" y="386" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#A9A395">基准单位 4px</text>
  <text x="790" y="402" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#A9A395">面板内边距 16</text>
  <text x="790" y="418" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#A9A395">卡片内边距 12</text>
  <text x="790" y="434" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#A9A395">区块间隔 24 / 32</text>
  <text x="790" y="452" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#8B8578">竖排间距同此标尺</text>

  <line x1="48" y1="480" x2="952" y2="480" stroke="#2A3742" stroke-width="1"/>

  <!-- ============ D 控件：按钮两态 ============ -->
  <text x="48" y="504" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#8B8578">D · BUTTONS / 控件状态</text>

  <!-- 默认 -->
  <rect x="48" y="518" width="132" height="34" rx="4" fill="#212E3A" stroke="#66727F" stroke-width="1.5"/>
  <text x="114" y="540" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#F3EDE1">部署</text>
  <!-- 焦点：外圈用 power 薄荷色作焦点环（token 表未定义专用焦点色，见汇报） -->
  <rect x="186" y="515" width="138" height="40" rx="6" fill="none" stroke="#4FD1C5" stroke-width="1.5"/>
  <rect x="192" y="518" width="132" height="34" rx="4" fill="#212E3A" stroke="#66727F" stroke-width="1.5"/>
  <text x="258" y="540" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#F3EDE1">部署</text>

  <text x="48" y="572" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">默认 default</text>
  <text x="192" y="572" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">焦点 focus · 环 1.5px</text>

  <!-- ============ E 卡框外形 ============ -->
  <text x="366" y="504" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#8B8578">E · CARD FRAME / 卡框</text>
  <rect x="366" y="518" width="168" height="60" rx="8" fill="#212E3A" stroke="#66727F" stroke-width="1.5"/>
  <rect x="378" y="530" width="144" height="16" rx="4" fill="#18212B" stroke="#2A3742" stroke-width="1"/>
  <rect x="378" y="552" width="60" height="14" rx="4" fill="#18212B" stroke="#2A3742" stroke-width="1"/>
  <rect x="446" y="552" width="76" height="14" rx="4" fill="#18212B" stroke="#2A3742" stroke-width="1"/>
  <text x="366" y="596" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">圆角 8px · 描边 1.5px --line-strong</text>
  <text x="366" y="610" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B8578">内部 1px 分隔用 --line</text>

  <!-- ============ F 扫描线纹理 ============ -->
  <text x="580" y="504" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#8B8578">F · SCANLINE / 扫描线</text>

  <rect x="580" y="518" width="372" height="42" rx="4" fill="#18212B" stroke="#2A3742" stroke-width="1"/>
  <rect x="580" y="518" width="372" height="42" rx="4" fill="url(#scan)"/>
  <rect x="580" y="518" width="372" height="42" rx="4" fill="url(#noise)"/>
  <text x="590" y="536" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#A9A395">1× 实际：周期 4px · 暗线 α≈0.04 · 叠加极轻噪点</text>
  <text x="590" y="550" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#8B8578">（此条为 1:1 真实强度，几乎看不见，属预期）</text>

  <rect x="580" y="568" width="372" height="42" rx="4" fill="#18212B" stroke="#2A3742" stroke-width="1"/>
  <rect x="580" y="568" width="372" height="42" rx="4" fill="url(#scanZoom)"/>
  <line x1="580" y1="568" x2="580" y2="610" stroke="#E4572E" stroke-width="1.5"/>
  <text x="590" y="586" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#A9A395">8× 放大示意：每 4px 一条，仅供评审确认</text>
  <text x="590" y="600" font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#8B8578">实现用 pattern 平铺，勿用大 filter</text>
</svg>
