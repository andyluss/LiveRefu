<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>未来残片 · 卡面设计（cards/）</title>
<!--
  ══ 卡面设计的进化试验台（不是游戏内原型） ══

  既有卡面（future-debris/game/scripts/view/card/card_view.gd）六段布局是对的，
  但**材质语言没做出来**：没有镀铬反射、没有网点、没有扫描线，全是纯深色矩形。

  本文件把那套语言真正渲染出来，并加进那个时代的工业物件细节。
  设计概念：**「提案卡」是一块归档的搪瓷金属提案板** ——
    搪瓷面 + 镀铬包边 / 凹陷视窗里放几何插画 / 网点+扫描线模拟印刷 /
    打孔·套准标记·压印序号·条码等归档痕迹。

  打开：双击即可（数据在同目录 cards.js）。
    ?card=<id>   单张（截图用）      ?sheet=1   联系表
-->
<style>
  /* ── 色值全部来自 game/data/tokens.json ── */
  :root{
    --bg:#10161C; --text:#F3EDE1; --dim:#A9A395;
    --cream:#F3EDE1; --cream-2:#E7DFCD; --cream-3:#D8CEB8;
    --chrome-hi:#FFFDF6; --chrome-blue:#8E9AA6; --chrome-lo:#6F7B89;
    --enamel-deep:#123236;
    --power:#4FD1C5; --residue:#FF6B35; --accent:#E4572E; --ok:#7BD389; --warn:#FFC857;
    --ink:#241f17; --ink-2:#4a3f2c; --ink-3:#8a7f66;
    --card-w:520px; --card-h:720px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
  .mono{font-family:Menlo,"SF Mono",Consolas,"DejaVu Sans Mono",monospace}

  /* ══════════ 卡面 ══════════ */
  .card{position:relative;width:var(--card-w);height:var(--card-h);--acc:#4FD1C5;
    filter:drop-shadow(0 20px 38px rgba(0,0,0,.58)) drop-shadow(0 3px 7px rgba(0,0,0,.5))}

  /* 镀铬包边：多段长反射 */
  .plate{position:absolute;inset:0;border-radius:18px;padding:7px;
    background:linear-gradient(146deg,
      #FFFDF6 0%, #F6F1E3 8%, #CFD6DB 20%, #8E9AA6 31%, #6F7B89 39%,
      #A9B4BE 48%, #E9E4D6 60%, #FFFDF6 69%, #D6DBDF 79%, #98A4AF 89%, #F2EDDF 100%);
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 -1px 0 rgba(0,0,0,.4) inset,
      0 0 0 1px rgba(0,0,0,.6)}
  .plate::before{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
    background:linear-gradient(114deg, rgba(255,255,255,0) 24%, rgba(255,255,255,.95) 37%,
      rgba(255,255,255,.15) 44%, rgba(255,255,255,0) 51%,
      rgba(255,255,255,.6) 67%, rgba(255,255,255,0) 77%);
    mix-blend-mode:screen}

  /* 搪瓷面 */
  .face{position:absolute;inset:7px;border-radius:12px;overflow:hidden;
    background:radial-gradient(120% 80% at 50% -12%, #FCF8EE 0%, var(--cream) 44%, var(--cream-2) 100%);
    box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 -2px 3px rgba(120,105,80,.22) inset,
      0 0 0 1px rgba(150,135,105,.38) inset;
    display:flex;flex-direction:column}
  .face::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;opacity:.26;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/></svg>");
    mix-blend-mode:multiply}

  /* 稀有度 */
  .card[data-rarity="rare"] .face{
    box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 -2px 3px rgba(120,105,80,.22) inset,
      0 0 0 1px rgba(150,135,105,.38) inset, 0 0 0 5px rgba(79,209,197,.20) inset}
  .card[data-rarity="epic"] .face{
    box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 -2px 3px rgba(120,105,80,.22) inset,
      0 0 0 1px rgba(150,135,105,.38) inset, 0 0 0 5px rgba(255,200,87,.26) inset}
  /* 史诗箔片：斜向箔带（打印时被 gamma 吃掉是预期的） */
  .card[data-rarity="epic"] .face::before{content:"";position:absolute;inset:0;z-index:29;
    pointer-events:none;opacity:.34;
    background:linear-gradient(104deg,
      rgba(255,200,87,0) 34%, rgba(255,200,87,.75) 41%, rgba(255,255,255,.95) 45%,
      rgba(123,211,137,.55) 49%, rgba(255,107,53,.45) 53%, rgba(255,200,87,0) 61%);
    mix-blend-mode:overlay}

  /* 左缘打孔（归档活页）——内容整体躲开这条 22px 的带子 */
  .holes{position:absolute;left:4px;top:0;bottom:0;width:16px;z-index:12;
    display:flex;flex-direction:column;justify-content:space-around;padding:52px 0 40px;pointer-events:none}
  .holes i{width:10px;height:10px;border-radius:50%;display:block;
    background:radial-gradient(circle at 38% 32%, #c4b9a2, #8d8269 58%, #655d4b);
    box-shadow:0 1px 1px rgba(255,255,255,.9), inset 0 1px 3px rgba(0,0,0,.6)}

  /* ══ 1. 顶栏（两行 + 费用章） ══ */
  .top{position:relative;height:70px;flex:none;padding:10px 16px 0 28px;
    display:flex;align-items:flex-start;gap:12px}
  .top .l{min-width:0;flex:1}
  .dept{font-family:Menlo,monospace;font-size:8px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-3);display:flex;align-items:center;gap:6px}
  .dept::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);
    box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 0 0 2.5px rgba(0,0,0,.10)}
  .name{margin:2px 0 0;font-size:25px;line-height:1.1;font-weight:800;letter-spacing:.5px;
    color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.95)}
  .rar{margin-left:auto;flex:none;margin-top:1px;font-family:Menlo,monospace;font-size:7.5px;
    letter-spacing:.16em;padding:3px 6px;border-radius:3px;color:#6a5f49;
    background:linear-gradient(180deg,#FBF7EC,#E6DDC9);
    box-shadow:0 1px 0 #fff inset,0 -1.5px 0 rgba(140,125,95,.25) inset,0 1px 2px rgba(90,75,45,.2)}

  /* 费用章：镀铬环 + 搪瓷心 */
  .cost{flex:none;width:50px;height:50px;border-radius:50%;position:relative;
    display:grid;place-items:center;margin-top:-1px;
    background:radial-gradient(circle at 34% 28%, #FFFDF6, #E9E4D6 34%, #C6CBD1 62%, #98A4AF 100%);
    box-shadow:0 2px 0 rgba(255,255,255,.95) inset, 0 -3px 6px rgba(110,95,70,.4) inset,
      0 3px 6px rgba(80,68,45,.35), 0 0 0 1px rgba(120,105,80,.35)}
  .cost .ring{position:absolute;inset:6px;border-radius:50%;
    background:radial-gradient(circle at 40% 32%, #FFF8E6, color-mix(in srgb, var(--acc) 26%, #EFE7D4) 70%, #D6CBB2);
    box-shadow:0 1px 2px rgba(0,0,0,.18) inset, 0 1px 0 rgba(255,255,255,.9)}
  .cost b{position:relative;font-family:Menlo,monospace;font-size:27px;font-weight:800;
    color:#332c20;text-shadow:0 1px 0 #fff,0 -1px 0 rgba(0,0,0,.20)}

  /* ══ 2. 视窗 ══ */
  .art{position:relative;height:316px;flex:none;margin:0 14px 0 24px;border-radius:9px;overflow:hidden;
    background:radial-gradient(135% 105% at 50% 6%, #20615F 0%, #123236 48%, #06161A 100%);
    box-shadow:0 5px 14px rgba(0,0,0,.5) inset, 0 -1px 0 rgba(255,255,255,.3) inset,
      0 0 0 1px rgba(88,70,42,.6), 0 1px 0 rgba(255,255,255,.6)}
  .art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .art .halftone{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.38;
    background-image:radial-gradient(rgba(243,237,225,.42) 1px, transparent 1.3px);
    background-size:4px 4px;
    -webkit-mask-image:radial-gradient(115% 88% at 50% 26%, #000 34%, transparent 82%);
            mask-image:radial-gradient(115% 88% at 50% 26%, #000 34%, transparent 82%)}
  .art .scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.17) 0 1px, rgba(0,0,0,0) 1px 3px)}
  /* 玻璃罩：左上高光 + 底部极轻压暗（不要压掉地平线网格） */
  .art .glass{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(158deg, rgba(255,255,255,.22), rgba(255,255,255,0) 24%);
    box-shadow:inset 0 0 22px rgba(0,0,0,.35)}
  .reg{position:absolute;width:11px;height:11px;z-index:9;opacity:.5}
  .reg::before,.reg::after{content:"";position:absolute;background:var(--cream)}
  .reg::before{left:5px;top:0;width:1px;height:11px}
  .reg::after{top:5px;left:0;height:1px;width:11px}
  .reg[data-p="tl"]{left:7px;top:7px} .reg[data-p="tr"]{right:7px;top:7px}
  .reg[data-p="bl"]{left:7px;bottom:7px} .reg[data-p="br"]{right:7px;bottom:7px}

  /* ══ 3. 关键词 ══ */
  .keys{height:40px;flex:none;margin:7px 14px 0 24px;display:flex;align-items:center;gap:7px;list-style:none}
  .keys li{position:relative;padding:3.5px 10px 3.5px 21px;border-radius:4px;
    font-size:11.5px;font-weight:700;letter-spacing:.05em;color:#2b2619;
    background:linear-gradient(180deg,#FBF7EC,#E6DDC9);
    box-shadow:0 1px 0 rgba(255,255,255,.95) inset,0 -1.5px 0 rgba(140,125,95,.28) inset,
      0 1px 2px rgba(90,75,45,.22)}
  .keys li::before{content:"";position:absolute;left:7px;top:50%;width:6px;height:6px;
    margin-top:-3px;border-radius:50%;background:var(--acc);
    box-shadow:0 0 0 1.5px rgba(255,255,255,.92),0 1px 2px rgba(0,0,0,.3)}
  .keys .k-label{margin-left:auto;background:none;box-shadow:none;padding:0;
    font-family:Menlo,monospace;font-size:8px;letter-spacing:.18em;color:#a89c82;font-weight:400}
  .keys .k-label::before{display:none}

  /* ══ 4. 数值（三只仪表） ══ */
  .stats{height:84px;flex:none;margin:6px 14px 0 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{position:relative;border-radius:6px;padding:11px 11px 8px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;
    background:linear-gradient(180deg,#F8F3E7,#E3DAC5);
    box-shadow:0 1px 0 rgba(255,255,255,.95) inset,0 -2px 0 rgba(140,125,95,.25) inset,
      0 1px 2px rgba(90,75,45,.20)}
  .stat::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);
    box-shadow:0 1px 0 rgba(255,255,255,.65)}
  .stat::after{content:"";position:absolute;right:-14px;bottom:-14px;width:42px;height:42px;
    border-radius:50%;background:var(--c);opacity:.10}
  .stat b{font-family:Menlo,monospace;font-size:29px;line-height:1;font-weight:800;
    color:#26221a;text-shadow:0 1px 0 rgba(255,255,255,.95);letter-spacing:-.02em}
  .stat span{font-family:Menlo,monospace;font-size:8px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink-3);white-space:nowrap}
  .stat.r{--c:var(--residue)} .stat.m{--c:#8c7a55} .stat.p{--c:var(--power)}

  /* ══ 5. 规则文本（含说明抬头 + 编号/签核位） ══ */
  .text{flex:1;margin:7px 14px 0 24px;padding:8px 10px 0 12px;position:relative;
    display:flex;flex-direction:column;
    border-top:1px solid rgba(150,135,105,.4);
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 34%)}
  .text .h{font-family:Menlo,monospace;font-size:7.5px;letter-spacing:.2em;text-transform:uppercase;
    color:#a1957b;margin-bottom:5px;display:flex;align-items:center;gap:6px}
  .text .h::after{content:"";flex:1;height:1px;background:rgba(140,125,95,.30)}
  /* 规则正文竖向居中：短文案时空白上下均分，读起来是"留白"而不是"缺内容" */
  .text .mid{flex:1;display:flex;align-items:center;position:relative}
  .text .body{font-size:13.5px;line-height:1.66;color:#2e2820;position:relative;z-index:1}
  .text .body em{font-style:normal;font-weight:700;color:var(--accent)}
  /* 淡刻水印：原子轨道，压在文本下面（4% 不抢字） */
  .text .wm{position:absolute;right:-8px;bottom:-6px;width:150px;height:110px;opacity:.055;
    background:
      radial-gradient(closest-side, transparent 62%, var(--acc) 63%, transparent 65%),
      radial-gradient(closest-side, transparent 38%, var(--acc) 39%, transparent 41%);
    border-radius:50%;transform:rotate(-14deg)}
  /* 签核位：把"提案被归档"这件事画出来 */
  .sign{margin-bottom:6px;display:flex;align-items:center;gap:9px;
    padding-top:5px;border-top:1px dashed rgba(140,125,95,.42)}
  .sign .sig{flex:1;height:15px;
    background:repeating-linear-gradient(90deg, rgba(120,105,80,.28) 0 1px, transparent 1px 3px);
    -webkit-mask-image:linear-gradient(90deg,#000,transparent 96%);
            mask-image:linear-gradient(90deg,#000,transparent 96%)}
  .sign .lbl{font-family:Menlo,monospace;font-size:7px;letter-spacing:.18em;color:#a89c82}
  .sign .stampbox{flex:none;width:52px;height:22px;border-radius:2px;border:1.4px solid rgba(178,68,38,.62);
    display:grid;place-items:center;color:rgba(178,68,38,.88);
    font-size:8px;font-weight:800;letter-spacing:.06em;
    box-shadow:0 0 0 1px rgba(178,68,38,.18) inset;margin-right:2px}

  /* ══ 6. 底栏 ══ */
  .bottom{height:46px;flex:none;margin-top:auto;padding:0 16px 0 28px;
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg, rgba(150,135,105,.10), rgba(150,135,105,.22));
    box-shadow:0 -1px 0 rgba(150,135,105,.4) inset}
  .stamp{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;
    letter-spacing:.03em;color:var(--ink-2)}
  .stamp::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc);
    box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
  .sep{width:1px;height:12px;background:rgba(140,125,95,.45)}
  .kindtag{font-family:Menlo,monospace;font-size:8px;letter-spacing:.14em;color:var(--ink-3)}
  .serial{margin-left:auto;font-family:Menlo,monospace;font-size:8.5px;letter-spacing:.1em;
    color:var(--ink-3)}
  .barcode{width:52px;height:15px;opacity:.7;
    background:repeating-linear-gradient(90deg,#3d3527 0 1px,transparent 1px 2px,
      #3d3527 2px 4px,transparent 4px 5px,#3d3527 5px 6px,transparent 6px 9px)}

  /* ══════════ 画廊 ══════════ */
  .gallery{padding:34px 30px 60px;max-width:1800px;margin:0 auto}
  .gallery h1{font-size:24px;margin:0 0 4px}
  .gallery .sub{color:var(--dim);font-size:13px;margin-bottom:26px;max-width:900px;line-height:1.7}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:34px;
    justify-items:center}
  .sheet .grid{grid-template-columns:repeat(3,520px);gap:16px}
  .solo{padding:0;margin:0;display:block;width:var(--card-w);height:var(--card-h);overflow:hidden}
</style>
</head>
<body>
<div id="root"></div>
<script src="cards.js"></script>
<script>
const FACTIONS = {
  'FAC-ATOMIC-AEC': { short:'AEC', zh:'原子能委员会', acc:'#4FD1C5' },
  'FAC-ATOMIC-SUB': { short:'SUB', zh:'郊区秩序',  acc:'#7BD389' },
  'FAC-ATOMIC-HAU': { short:'HAU', zh:'清运承包方', acc:'#FF6B35' },
  'FAC-ATOMIC-ROA': { short:'ROA', zh:'辐射漫游者', acc:'#FFC857' },
};
const KINDS = {
  tower:{zh:'塔',en:'TOWER'}, unit:{zh:'单位',en:'UNIT'}, skill:{zh:'技能',en:'SKILL'},
  support:{zh:'支援',en:'SUPPORT'}, modifier:{zh:'改装',en:'MODIFIER'}, relic:{zh:'残片',en:'RELIC'},
};
const RARITY = { common:{en:'STANDARD'}, rare:{en:'RARE'}, epic:{en:'EPIC'} };

function seedOf(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=(h*16777619)>>>0; } return h>>>0; }
function rng(seed){ let s=seed||1; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

/* ══════════════════════════════════════════════════════════════
   程序化插画：风格卡规定「只用圆角矩形 + 长反射条 + 单点镜红」，
   所以不画写实图像 —— 几何体 + 轨道 + 放射线 + 一颗红点。
   构图公式（六种母题共用，保证同一个世界里）：
     辉光 → 大日盘/放射 → 地平线与透视网格 → 主体 → 轨道 → 前景横栏 → 星爆
   ══════════════════════════════════════════════════════════════ */
function art(card, acc, seed){
  const R = rng(seed), cx = 248, G = [];
  const rot = R()*360;
  const put = s => G.push(s);
  const HZ = 212;                       // 地平线
  const k = card.kind;                  // 母题类型（轨道块先用到，故提前声明）
  const baseY = HZ + 26;                // 主体基线

  put(`<defs>
    <radialGradient id="sky" cx="50%" cy="26%" r="74%">
      <stop offset="0%" stop-color="${acc}" stop-opacity=".50"/>
      <stop offset="44%" stop-color="${acc}" stop-opacity=".12"/>
      <stop offset="100%" stop-color="${acc}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7F1E0" stop-opacity=".55"/>
      <stop offset="40%" stop-color="${acc}" stop-opacity=".22"/>
      <stop offset="100%" stop-color="${acc}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#041012" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#041012" stop-opacity=".70"/>
    </linearGradient>
    <!-- 主体：深漆器（大面积不反光），轮廓与细节才用铬 -->
    <linearGradient id="lacq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#54687B"/><stop offset="26%" stop-color="#3A4A59"/>
      <stop offset="62%" stop-color="#232E39"/><stop offset="100%" stop-color="#161E26"/>
    </linearGradient>
    <linearGradient id="lacqH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22303B"/><stop offset="26%" stop-color="#4E6274"/>
      <stop offset="55%" stop-color="#2C3A46"/><stop offset="82%" stop-color="#465A6C"/>
      <stop offset="100%" stop-color="#1B242D"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="34%" stop-color="#DCE1E5"/>
      <stop offset="52%" stop-color="#8B96A1"/><stop offset="70%" stop-color="#E8E3D5"/>
      <stop offset="100%" stop-color="#A6B0BA"/>
    </linearGradient>
    <linearGradient id="chromeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5F6A74"/><stop offset="16%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#AEB8C1"/><stop offset="62%" stop-color="#F6F2E5"/>
      <stop offset="86%" stop-color="#8E9AA6"/><stop offset="100%" stop-color="#DAD5C7"/>
    </linearGradient>
    <linearGradient id="railG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF6" stop-opacity=".85"/>
      <stop offset="55%" stop-color="#9AA5AF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#3C464E" stop-opacity=".5"/>
    </linearGradient>
  </defs>`);

  /* 天空 + 大日盘（纯光，不实心） */
  put(`<rect width="496" height="300" fill="url(#sky)"/>`);
  const sunR = 78;
  put(`<circle cx="${cx}" cy="132" r="${sunR*2.0}" fill="url(#sunG)"/>`);
  { const rays=26;
    for(let i=0;i<rays;i++){
      const a=(i/rays)*Math.PI*2;
      if (Math.sin(a) > 0.28) continue;                 // 只在上半圈放射
      const r1=sunR*1.10, r2=sunR*(1.26+(i%2?0.10:0.28));
      put(`<line x1="${cx+Math.cos(a)*r1}" y1="${132+Math.sin(a)*r1}"
        x2="${cx+Math.cos(a)*r2}" y2="${132+Math.sin(a)*r2}"
        stroke="${acc}" stroke-opacity="${i%2?.30:.55}" stroke-width="${i%2?1:1.7}"/>`);
    }
  }
  put(`<circle cx="${cx}" cy="132" r="${sunR}" fill="none" stroke="${acc}" stroke-opacity=".34" stroke-width="1.5"/>`);
  put(`<circle cx="${cx}" cy="132" r="${sunR-13}" fill="none" stroke="${acc}" stroke-opacity=".16" stroke-width="1"/>`);

  /* 地面：只用中性压暗 + 强调色细线（不用大色块，避免发脏） */
  put(`<rect x="0" y="${HZ}" width="496" height="${300-HZ}" fill="url(#floorFade)"/>`);
  put(`<line x1="0" y1="${HZ}" x2="496" y2="${HZ}" stroke="${acc}" stroke-opacity=".62" stroke-width="1.6"/>`);
  for(let i=0;i<7;i++){
    const y = HZ + Math.pow(i/6, 1.8) * 92;
    put(`<line x1="0" y1="${y}" x2="496" y2="${y}" stroke="${acc}"
      stroke-opacity="${.26 - i*.030}" stroke-width="1"/>`);
  }
  for(let i=-6;i<=6;i++){
    put(`<line x1="${cx+i*34}" y1="${HZ}" x2="${cx+i*140}" y2="300"
      stroke="${acc}" stroke-opacity=".12" stroke-width="1"/>`);
  }

  /* 轨道 */
  const orbY = k==='skill' ? 176 : (k==='relic' ? baseY-40 : baseY-52);
  for(let i=0;i<2;i++){
    put(`<ellipse cx="${cx}" cy="${orbY}" rx="${112+i*38}" ry="${28+i*12}" fill="none"
      stroke="${acc}" stroke-opacity="${.34-i*.09}" stroke-width="1.3"
      transform="rotate(${rot*0.5 + i*16} ${cx} ${orbY})"/>`);
    const a=(rot*0.5+i*16)*Math.PI/180;
    put(`<circle cx="${cx+Math.cos(a)*(112+i*38)}" cy="${orbY+Math.sin(a)*(28+i*12)}"
      r="${3.4-i*0.8}" fill="${acc}" opacity=".95"/>`);
  }

  /* ── 母题：主体=深漆器 + 亮铬轮廓 + 强调色细线 ── */
  const rim = `stroke="#F1EADA" stroke-opacity=".92" stroke-width="1.5"`;
  const rimSoft = `stroke="#F1EADA" stroke-opacity=".40" stroke-width="1"`;

  if(k==='tower'){
    const V = seed % 3;
    if(V===0){                                   // 变体 0：三级堆叠 + 中央天线
      const w=[196,154,112], h=[23,21,19];
      const topY = baseY - 3*(h[0]+15);
      for(let i=0;i<3;i++){
        const yy = baseY - (i+1)*(h[0]+15);
        put(`<rect x="${cx-w[i]/2}" y="${yy}" width="${w[i]}" height="${h[i]}" rx="${h[i]/2}"
          fill="url(#lacqH)" ${rim}/>`);
        put(`<rect x="${cx-w[i]/2+9}" y="${yy+h[i]/2-1.3}" width="${w[i]-18}" height="2.6" rx="1.3"
          fill="url(#chromeH)" opacity=".95"/>`);
        put(`<rect x="${cx-w[i]/2+13}" y="${yy+h[i]-5.5}" width="${w[i]-26}" height="1.6" rx=".8"
          fill="${acc}" opacity=".75"/>`);
      }
      put(`<rect x="${cx-3.5}" y="${topY-48}" width="7" height="54" rx="3.5" fill="url(#lacq)" ${rimSoft}/>`);
      put(`<circle cx="${cx}" cy="${topY-52}" r="6.5" fill="#E4572E"/>`);
      put(`<circle cx="${cx}" cy="${topY-52}" r="12" fill="none" stroke="#E4572E" stroke-opacity=".5" stroke-width="1.4"/>`);
    } else if(V===1){                            // 变体 1：宽基座 + 双塔柱 + 横梁
      put(`<rect x="${cx-104}" y="${baseY-30}" width="208" height="26" rx="8" fill="url(#lacqH)" ${rim}/>`);
      put(`<rect x="${cx-96}" y="${baseY-24}" width="192" height="2.6" rx="1.3" fill="url(#chromeH)" opacity=".9"/>`);
      for(const dx of [-52,52]){
        put(`<rect x="${cx+dx-9}" y="${baseY-118}" width="18" height="92" rx="6" fill="url(#lacq)" ${rim}/>`);
        put(`<rect x="${cx+dx-4}" y="${baseY-112}" width="3" height="78" rx="1.5" fill="#FFFFFF" opacity=".55"/>`);
      }
      put(`<rect x="${cx-62}" y="${baseY-128}" width="124" height="14" rx="7" fill="url(#lacqH)" ${rim}/>`);
      put(`<rect x="${cx-52}" y="${baseY-124}" width="104" height="2.4" rx="1.2" fill="url(#chromeH)" opacity=".9"/>`);
      put(`<circle cx="${cx}" cy="${baseY-144}" r="6" fill="#E4572E"/>`);
      put(`<rect x="${cx-30}" y="${baseY-40}" width="60" height="2.6" rx="1.3" fill="${acc}" opacity=".8"/>`);
    } else {                                     // 变体 2：四层细叠 + 侧翼稳定器
      const w=[172,150,128,106], h=13;
      for(let i=0;i<4;i++){
        const yy = baseY - (i+1)*(h+13);
        put(`<rect x="${cx-w[i]/2}" y="${yy}" width="${w[i]}" height="${h}" rx="${h/2}"
          fill="url(#lacqH)" ${rim}/>`);
        put(`<rect x="${cx-w[i]/2+8}" y="${yy+h/2-1.1}" width="${w[i]-16}" height="2.2" rx="1.1"
          fill="url(#chromeH)" opacity=".92"/>`);
      }
      for(const sgn of [-1,1]){
        put(`<path d="M ${cx+sgn*122} ${baseY-6} L ${cx+sgn*152} ${baseY-40} L ${cx+sgn*152} ${baseY-6} Z"
          fill="url(#lacq)" ${rimSoft}/>`);
      }
      put(`<circle cx="${cx}" cy="${baseY-4*(h+13)-14}" r="6" fill="#E4572E"/>`);
      put(`<rect x="${cx-34}" y="${baseY-2}" width="68" height="2.6" rx="1.3" fill="${acc}" opacity=".7"/>`);
    }
    put(`<ellipse cx="${cx}" cy="${baseY+8}" rx="112" ry="9" fill="${acc}" opacity=".15"/>`);
  }

  if(k==='unit'){
    const V = seed % 3;
    const w=168,h=150,y=baseY-h-4;
    if(V===0){                                   // 变体 0：拱形盾
      put(`<path d="M ${cx-w/2} ${y} L ${cx+w/2} ${y} L ${cx+w/2} ${y+h*0.50}
        Q ${cx+w/2} ${y+h*0.92} ${cx} ${y+h+14} Q ${cx-w/2} ${y+h*0.92} ${cx-w/2} ${y+h*0.50} Z"
        fill="url(#lacq)" ${rim}/>`);
      put(`<path d="M ${cx-w/2+7} ${y+7} L ${cx+w/2-7} ${y+7}"
        stroke="#FFFFFF" stroke-opacity=".75" stroke-width="2.6" stroke-linecap="round"/>`);
      put(`<circle cx="${cx}" cy="${y+58}" r="33" fill="#0A1A1E" stroke="${acc}" stroke-opacity=".9" stroke-width="2"/>`);
      put(`<circle cx="${cx}" cy="${y+58}" r="23" fill="${acc}" fill-opacity=".16"/>`);
      put(`<circle cx="${cx}" cy="${y+58}" r="11" fill="${acc}"/>`);
      put(`<circle cx="${cx+13}" cy="${y+46}" r="4.6" fill="#E4572E"/>`);
      put(`<rect x="${cx-42}" y="${y+h*0.74}" width="84" height="2.6" rx="1.3" fill="${acc}" opacity=".7"/>`);
      for(const s of [-1,1]){
        const bx = cx + s*(w/2+9) + (s<0?-26:0);
        put(`<rect x="${bx}" y="${y+26}" width="26" height="6" rx="3" fill="url(#chromeH)" ${rimSoft}/>`);
        put(`<rect x="${bx+4}" y="${y+40}" width="18" height="3" rx="1.5" fill="${acc}" opacity=".55"/>`);
      }
    } else if(V===1){                            // 变体 1：六边碑 + 顶部光冠
      const hex = `${cx},${y+6} ${cx+w/2},${y+h*0.26} ${cx+w/2},${y+h*0.74} ${cx},${y+h+12} ${cx-w/2},${y+h*0.74} ${cx-w/2},${y+h*0.26}`;
      put(`<polygon points="${hex}" fill="url(#lacq)" ${rim}/>`);
      put(`<polygon points="${cx},${y+16} ${cx+w/2-9},${y+h*0.30} ${cx+w/2-9},${y+h*0.70} ${cx},${y+h+2} ${cx-w/2+9},${y+h*0.70} ${cx-w/2+9},${y+h*0.30}"
        fill="none" stroke="${acc}" stroke-opacity=".45" stroke-width="1.2"/>`);
      put(`<circle cx="${cx}" cy="${y+62}" r="30" fill="#0A1A1E" stroke="${acc}" stroke-opacity=".85" stroke-width="2"/>`);
      put(`<circle cx="${cx}" cy="${y+62}" r="9" fill="${acc}"/>`);
      put(`<circle cx="${cx+11}" cy="${y+51}" r="4.4" fill="#E4572E"/>`);
      for(let i=0;i<7;i++){
        const a=Math.PI + (i/6)*Math.PI;
        put(`<line x1="${cx+Math.cos(a)*34}" y1="${y+62+Math.sin(a)*34}"
          x2="${cx+Math.cos(a)*46}" y2="${y+62+Math.sin(a)*46}"
          stroke="${acc}" stroke-opacity=".6" stroke-width="1.6"/>`);
      }
    } else {                                     // 变体 2：立板 + 双翼
      put(`<rect x="${cx-46}" y="${y}" width="92" height="${h+10}" rx="10" fill="url(#lacq)" ${rim}/>`);
      put(`<rect x="${cx-36}" y="${y+8}" width="72" height="2.4" rx="1.2" fill="#FFFFFF" opacity=".6"/>`);
      put(`<circle cx="${cx}" cy="${y+52}" r="26" fill="#0A1A1E" stroke="${acc}" stroke-opacity=".85" stroke-width="1.8"/>`);
      put(`<circle cx="${cx}" cy="${y+52}" r="8" fill="${acc}"/>`);
      put(`<circle cx="${cx+9}" cy="${y+43}" r="4" fill="#E4572E"/>`);
      for(const sgn of [-1,1]){
        put(`<path d="M ${cx+sgn*46} ${y+30} L ${cx+sgn*104} ${y+52} L ${cx+sgn*104} ${y+h*0.80} L ${cx+sgn*46} ${y+h*0.62} Z"
          fill="url(#lacqH)" ${rimSoft}/>`);
        put(`<rect x="${cx+sgn*54+(sgn<0?-40:0)}" y="${y+62}" width="40" height="2.6" rx="1.3"
          fill="${acc}" opacity=".6"/>`);
      }
    }
    put(`<ellipse cx="${cx}" cy="${baseY+10}" rx="${w*0.40}" ry="7" fill="${acc}" opacity=".16"/>`);
  }

  if(k==='skill'){
    const cy2 = 176, n=22;
    for(let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2 + R()*0.04, L=116+R()*52;
      put(`<line x1="${cx+Math.cos(a)*30}" y1="${cy2+Math.sin(a)*30}"
        x2="${cx+Math.cos(a)*L}" y2="${cy2+Math.sin(a)*L}"
        stroke="${i%4===0?'#FFFDF6':acc}" stroke-opacity="${i%4===0?.92:.40}"
        stroke-width="${i%4===0?2.2:1.2}"/>`);
    }
    [32,58,86].forEach((r,i)=>put(`<circle cx="${cx}" cy="${cy2}" r="${r}" fill="none"
      stroke="${acc}" stroke-opacity="${.62-i*.15}" stroke-width="${2.6-i*.7}"
      stroke-dasharray="${i===1?'6 7':'none'}"/>`));
    put(`<circle cx="${cx}" cy="${cy2}" r="19" fill="url(#lacq)" ${rim}/>`);
    put(`<circle cx="${cx}" cy="${cy2}" r="7" fill="#E4572E"/>`);
    put(`<ellipse cx="${cx}" cy="${cy2+96}" rx="128" ry="10" fill="${acc}" opacity=".14"/>`);
  }

  if(k==='support'){
    const V = seed % 3, cy2 = baseY - 36;
    // 底座
    put(`<rect x="${cx-84}" y="${baseY+2}" width="168" height="12" rx="6" fill="url(#lacqH)" ${rim}/>`);
    put(`<rect x="${cx-74}" y="${baseY+6}" width="148" height="2.2" rx="1.1" fill="url(#chromeH)" opacity=".85"/>`);
    if(V===1){                                   // 变体 1：双头
      for(const dx of [-42,42]){
        put(`<rect x="${cx+dx-30}" y="${cy2-16}" width="60" height="13" rx="6.5" fill="url(#lacqH)" ${rim}/>`);
        put(`<rect x="${cx+dx-17}" y="${cy2-4}" width="34" height="30" rx="7" fill="url(#lacq)" ${rim}/>`);
        for(let i=0;i<3;i++){
          const r=30+i*22;
          put(`<path d="M ${cx+dx-r} ${cy2-8} A ${r} ${r*0.66} 0 0 1 ${cx+dx+r} ${cy2-8}"
            fill="none" stroke="${acc}" stroke-opacity="${.5-i*.13}" stroke-width="1.5"
            stroke-dasharray="${i?'4 6':'none'}"/>`);
        }
      }
    } else {                                     // 变体 0/2：单头（宽/窄）
      const wTop = V===0 ? 124 : 96;
      put(`<rect x="${cx-wTop/2}" y="${cy2-18}" width="${wTop}" height="15" rx="7.5" fill="url(#lacqH)" ${rim}/>`);
      put(`<rect x="${cx-wTop/2+8}" y="${cy2-15}" width="${wTop-16}" height="2.2" rx="1.1" fill="url(#chromeH)" opacity=".9"/>`);
      put(`<rect x="${cx-40}" y="${cy2-4}" width="80" height="34" rx="9" fill="url(#lacq)" ${rim}/>`);
      put(`<rect x="${cx-26}" y="${cy2+8}" width="52" height="2.8" rx="1.4" fill="${acc}" opacity=".85"/>`);
      for(let i=0;i<3;i++){
        const r=54+i*34;
        put(`<path d="M ${cx-r} ${cy2-10} A ${r} ${r*0.70} 0 0 1 ${cx+r} ${cy2-10}"
          fill="none" stroke="${acc}" stroke-opacity="${.52-i*.13}" stroke-width="1.7"
          stroke-dasharray="${i?'4 6':'none'}"/>`);
      }
    }
    // 水点铺满下半幅
    for(let i=0;i<26;i++){
      const tt=R(), x=cx-118+tt*236, y=cy2+26+Math.pow(R(),0.7)*74;
      put(`<circle cx="${x}" cy="${y}" r="${1.2+R()*1.9}"
        fill="${i%7===0?'#E4572E':acc}" opacity="${.35+R()*.55}"/>`);
    }
    put(`<ellipse cx="${cx}" cy="${baseY+16}" rx="86" ry="8" fill="${acc}" opacity=".18"/>`);
  }

  if(k==='modifier'){
    const V = seed % 3, gy = baseY - 2;
    // 台面
    put(`<rect x="${cx-124}" y="${gy+20}" width="248" height="14" rx="4" fill="url(#lacqH)" ${rim}/>`);
    put(`<rect x="${cx-116}" y="${gy+24}" width="232" height="2.2" rx="1.1" fill="url(#chromeH)" opacity=".85"/>`);
    // 两侧刻度
    for(const sgn of [-1,1]){
      const baseX = cx + sgn*150;
      put(`<line x1="${baseX}" y1="${gy-88}" x2="${baseX}" y2="${gy+18}" stroke="${acc}" stroke-opacity=".35" stroke-width="1.2"/>`);
      for(let i=0;i<16;i++){
        const yy = gy-86+i*6.6;
        put(`<line x1="${baseX}" y1="${yy}" x2="${baseX - sgn*(i%3?5:10)}" y2="${yy}"
          stroke="${acc}" stroke-opacity=".34" stroke-width="1"/>`);
      }
    }
    // 表盘
    put(`<path d="M ${cx-96} ${gy+14} A 96 96 0 0 1 ${cx+96} ${gy+14}" fill="none"
      stroke="${acc}" stroke-opacity=".70" stroke-width="2.4"/>`);
    for(let i=0;i<=12;i++){
      const a=Math.PI*(i/12);
      put(`<line x1="${cx-Math.cos(a)*90}" y1="${gy+14-Math.sin(a)*90}"
        x2="${cx-Math.cos(a)*76}" y2="${gy+14-Math.sin(a)*76}"
        stroke="${acc}" stroke-opacity=".65" stroke-width="${i%3?1.4:2.2}"/>`);
    }
    // 指针（变体决定角度与数量）
    const na=Math.PI*(V===0?0.68:V===1?0.42:0.55);
    put(`<line x1="${cx}" y1="${gy+14}" x2="${cx-Math.cos(na)*74}" y2="${gy+14-Math.sin(na)*74}"
      stroke="#E4572E" stroke-width="3.6" stroke-linecap="round"/>`);
    if(V===2){
      const nb=Math.PI*0.92;
      put(`<line x1="${cx}" y1="${gy+14}" x2="${cx-Math.cos(nb)*60}" y2="${gy+14-Math.sin(nb)*60}"
        stroke="${acc}" stroke-width="2" stroke-opacity=".8" stroke-linecap="round"/>`);
    }
    put(`<circle cx="${cx}" cy="${gy+14}" r="9" fill="url(#lacq)" ${rim}/>`);
    put(`<circle cx="${cx}" cy="${gy+14}" r="3" fill="#E4572E"/>`);
  }

  if(k==='relic'){
    const by = baseY + 4;
    put(`<rect x="${cx-100}" y="${by}" width="200" height="15" rx="7.5" fill="url(#lacqH)" ${rim}/>`);
    put(`<rect x="${cx-66}" y="${by+8}" width="132" height="6" rx="3" fill="#041012" opacity=".7"/>`);
    put(`<path d="M ${cx-50} ${by} Q ${cx-58} ${by-54} ${cx-14} ${by-78}
      Q ${cx+20} ${by-98} ${cx+44} ${by-58} Q ${cx+60} ${by-22} ${cx+50} ${by} Z"
      fill="url(#lacq)" ${rim}/>`);
    put(`<path d="M ${cx-28} ${by-48} Q ${cx-4} ${by-68} ${cx+22} ${by-52}"
      fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2.2" stroke-linecap="round"/>`);
    put(`<circle cx="${cx+4}" cy="${by-40}" r="12" fill="${acc}" opacity=".55"/>`);
    put(`<circle cx="${cx+18}" cy="${by-51}" r="5" fill="#E4572E"/>`);
    put(`<ellipse cx="${cx}" cy="${by+17}" rx="100" ry="8" fill="${acc}" opacity=".16"/>`);
  }

  /* 前景细栏 + 星爆 */
  put(`<rect x="0" y="286" width="496" height="2" fill="url(#railG)" opacity=".45"/>`);
  put(`<rect x="0" y="293" width="496" height="1.4" fill="url(#railG)" opacity=".28"/>`);
  const sx = R()>.5 ? 432 : 62, sy = 42;
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2, L=i%2===0?17:9;
    put(`<line x1="${sx+Math.cos(a)*4}" y1="${sy+Math.sin(a)*4}"
      x2="${sx+Math.cos(a)*L}" y2="${sy+Math.sin(a)*L}"
      stroke="#FFFDF6" stroke-opacity=".55" stroke-width="1.5"/>`);
  }
  /* 压印编号：每张卡自己的小铭牌（与底栏条码呼应） */
  const code = String(card.id).replace(/^RC-ATOMIC-/, '');
  put(`<text x="34" y="278" font-family="Menlo,monospace" font-size="6.5"
    fill="#F3EDE1" fill-opacity=".34" letter-spacing="1.5">PLATE ${code} · ${k.toUpperCase()}</text>`);
  return `<svg viewBox="0 0 496 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${G.join('')}</svg>`;
}

/* ══════════ 组装 ══════════ */
function renderCard(card){
  const f = FACTIONS[card.faction] || { short:'???', zh:'未知', acc:'#A9A395' };
  const k = KINDS[card.kind] || { zh:card.kind, en:String(card.kind).toUpperCase() };
  const r = RARITY[card.rarity] || RARITY.common;
  const artSvg = art(card, f.acc, seedOf(card.id));
  const kw = (card.keywords||[]).map(w=>`<li>${w}</li>`).join('');

  return `
  <article class="card" data-rarity="${card.rarity}" data-id="${card.id}"
           style="--acc:${f.acc}">
    <div class="plate"></div>
    <div class="face">
      <div class="holes"><i></i><i></i><i></i></div>

      <header class="top">
        <div class="l">
          <div class="dept">${f.short} · ${f.zh}</div>
          <h1 class="name">${card.name}</h1>
        </div>
        <span class="rar">${r.en}</span>
        <div class="cost"><span class="ring"></span><b>${card.cost}</b></div>
      </header>

      <div class="art">
        ${artSvg}
        <div class="halftone"></div>
        <div class="scan"></div>
        <div class="glass"></div>
        <span class="reg" data-p="tl"></span><span class="reg" data-p="tr"></span>
        <span class="reg" data-p="bl"></span><span class="reg" data-p="br"></span>
      </div>

      <ul class="keys">${kw}<li class="k-label">KEYWORDS</li></ul>

      <div class="stats">
        <div class="stat r"><b>${card.residue ?? 0}</b><span>RESIDUE 残渣</span></div>
        <div class="stat m"><b>${card.power ?? 0}</b><span>MIGHT 战力</span></div>
        <div class="stat p"><b>${card.compute ?? 0}</b><span>COMPUTE 算力</span></div>
      </div>

      <div class="text">
        <div class="h">RULES · 规则</div>
        <div class="mid">
          <span class="wm"></span>
          <div class="body">${card.text}</div>
        </div>
        <div class="sign">
          <span class="lbl">FILED BY</span>
          <span class="sig"></span>
          <span class="stampbox">已备案</span>
        </div>
      </div>

      <footer class="bottom">
        <span class="stamp">${f.zh}</span>
        <span class="sep"></span>
        <span class="kindtag">${k.en}</span>
        <span class="serial">${card.id}</span>
        <span class="barcode"></span>
      </footer>
    </div>
  </article>`;
}

/* ══════════ 启动 ══════════ */
(function boot(){
  const q = new URLSearchParams(location.search);
  const root = document.getElementById('root');
  const cards = window.CARDS || [];
  const one = q.get('card');
  if (one){
    document.body.className = 'solo';
    root.innerHTML = renderCard(cards.find(x=>x.id===one) || cards[0]);
    return;
  }
  const sheet = q.get('sheet') === '1';
  document.body.className = sheet ? 'sheet' : '';
  root.innerHTML = `
    <div class="gallery">
      <h1>未来残片 · 卡面设计 v1</h1>
      <div class="sub">
        <b>${cards.length}</b> 张 · 概念：<b>归档的搪瓷提案板</b> ——
        搪瓷面 + 镀铬包边 / 凹陷视窗 / 网点 + 扫描线 / 打孔·套准·压印序号·条码。
        色值全部取自 <span class="mono">tokens.json</span>（未新增颜色）；
        插画由卡号确定性生成（同卡同图，不需要美术逐张画）。
        数据由 <span class="mono">tools/build_cards_js.py</span> 从真实卡表生成。
      </div>
      <div class="grid">${cards.map(renderCard).join('')}</div>
    </div>`;
})();
</script>
</body>
