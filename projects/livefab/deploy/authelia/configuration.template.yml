# LiveFab · Authelia 配置模板（M0）
#
# ⚠️ 这是**模板**，不是最终配置。由 `authelia-prep` 容器把 __PLACEHOLDER__ 替换成
#    真实域名后写到数据卷，Authelia 读的是渲染结果。
#
# ★ 为什么要多这一步（这是用真实 Authelia 试出来的，读文档看不出来）：
#   Authelia 的 `env` 模板函数**不能用在 domain / URL 字段**——
#   校验会报 `'...' could not decode ... to a *url.URL: invalid character "{" in host name`，
#   以及 `access_control: rule #N: option 'policy' must be present`
#   （因为整个 domain 值没被解析成域名，规则就整体失效）。
#   所以：**域名用我们自己的渲染步骤**。
#
# ⚠️ 关于 `secret` 模板函数（**先前的诊断是错的，这里更正**）
#
#   早先我们以为「secret 模板在文件缺失时静默返回空值」——**那是误判**。
#   真正的原因是：**Authelia 的配置模板是实验性过滤器，默认不启用**，
#   于是 `secret "/secret/xxx"` 这种写法作为**字面量**原样传下去，
#   数据库密码就成了那串字面量 → 运行时 "password authentication failed"。
#
#   证据（用真实 Authelia 实测）：
#     log.level: 'secret "/s/lvl"'   ← 写成模板语法
#     未开过滤器 → "option 'level' must be one of ... but it's configured as
#                   'secret "/s/lvl"'"           ← 字面量透传（未被求值）
#     开启过滤器 → 模板真的执行（会去 open 那个文件）
#
#   启用方式：给 authelia 加 `--config.experimental.filters template`
#   （见 deploy/compose.yml 的 authelia.command）。
#
#   所以现在**两套机制并存，各有用途**：
#     · 密钥文件用 `AUTHELIA_*_FILE` 环境变量 —— 不依赖模板，最稳；
#     · 需要嵌进 YAML 结构的值（如 OIDC 的 JWKS 密钥）用 `secret` 模板 —— 依赖上面的过滤器。

# ── 会话 ─────────────────────────────────────────────────────────────
session:
  # ★ cookies 段是必填的（真实 Authelia 校验报错才发现——自写断言没覆盖到）
  #
  # ⚠️ 需要**两个** cookie，因为 Authelia 的会话 cookie 是**按域**的，
  #    而我们要保护的两个域不同：门户在 app.*、Ghost 在 m0.*。
  #    只配一个的话，另一个域上的保护永远拿不到会话（会陷入"登录了还是被挡"的循环）。
  cookies:
    # ★ 一个 cookie 挂在**共享父域**上，覆盖所有子域（门户、Ghost、论坛…）。
    #
    #   为什么必须这样：Authelia 要求 `authelia_url` 与 cookie 的 domain
    #   **共享 cookie 作用域**。早先给 Ghost 域单独配 cookie 时，
    #   真实 Authelia 直接报错：
    #     session: domain config #2 (domain 'm0.localhost'):
    #       option 'authelia_url' does not share a cookie scope with domain 'm0.localhost'
    #   因为 auth 在 auth.app.localhost，与 m0.localhost 不同源。
    #
    #   解法：把各件放到**同一个父域的子域**下，cookie 挂父域 →
    #   一个 cookie 覆盖全部，也只需要一个鉴权门户。生产上就是
    #   livefab.com + app./auth./m0./forum. 这种结构。
    - name: livefab_session
      domain: '__COOKIE_DOMAIN__'
      authelia_url: 'https://__AUTH_DOMAIN__'
      default_redirection_url: 'https://__PORTAL_DOMAIN__'
  expiration: 1h
  inactivity: 5m

# ── 身份校验 ─────────────────────────────────────────────────────────
# ★ 求解过程（真实 Authelia 逐项试出来的）：
#   `disable: true` / `enabled: false` **都不是合法键**（报"configuration key not expected"）；
#   唯一可行的是**提供 jwt_secret**（报错原文：
#   "option 'jwt_secret' is required when the reset password functionality isn't disabled"）。
# 密钥由 AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE 提供
identity_validation:
  reset_password: {}

# ── 存储 ─────────────────────────────────────────────────────────────
# 密钥由 AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE 提供
storage:
  postgres:
    address: 'tcp://db:5432'
    database: authelia
    username: authelia
    # 密码由 AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE 提供

# ── 通知：M1 接真实 SMTP 前先落文件，避免启动检查失败 ────────────────
notifier:
  disable_startup_check: true
  # ★ 必须配**能真正发信**的 notifier，否则会连带挡住双因素。
  #   实测：原本用的是 filesystem 通知（写 /data/notification.txt），
  #   而容器里没有 /data —— 于是 Authelia 报
  #     Error creating user session elevation One-Time Code challenge:
  #       failed to open file: open /data/notification.txt: no such file or directory
  #   后果不只是"发不出信"：**注册 TOTP 设备需要"提权"，而提权要发一次性验证码**，
  #   发不出信 → 提权失败 → /admin/ 要求的 two_factor 永远配不上。
  #   现在接 Mailpit（本地邮件捕获器），既不真发信、又能取到验证码。
  smtp:
    address: 'smtp://mailpit:1025'
    sender: 'LiveFab <noreply@livefab.test>'
    identifier: livefab.localhost
    subject: '[LiveFab] {title}'
    # ⚠️ Authelia 默认要求 STARTTLS，而 Mailpit 的 1025 是**明文 SMTP**，
    #    报：STARTTLS mode set to: "TLSMandatory", but target host does not support STARTTLS
    #    本地捕获器不需要加密，关掉这两项即可（生产上接真实 SMTP 时应打开）。
    disable_require_tls: true
    disable_starttls: true

# ── 用户数据库 ───────────────────────────────────────────────────────
authentication_backend:
  file:
    path: /users/users.yml
    password:
      algorithm: argon2id
      iterations: 3
      memory: 65536
      parallelism: 4

# ── OIDC Provider（LiveFab 作为统一身份源）──────────────────────────
# ★ 为什么要有这一节：L3 选了"先立 IdP"，但如果 Authelia 只做**网关鉴权**，
#   那些**不能改登录方式**的件（Ghost 不支持 OIDC）就永远接不进来，
#   NodeBB 则要靠插件。开 OIDC Provider 后，Authelia 才真正成为"统一身份源"：
#   支持 OIDC 的件直接用它登录，**一个账号走遍全场**。
#
# 这是 M1 验收「用**同一个账号**发一条帖」的前提。
identity_providers:
  oidc:
    # 签名密钥（JWKS）——用 authelia crypto pair rsa generate 生成
    # ⚠️ key 必须是 **YAML 块标量**（`|`）里内联的原始 PEM，且由 prep **缩进注入**。
    #
    #    踩过的坑（都会让 PEM 畸形）：
    #      · 写成单引号标量 '...' → YAML 把多行**折成一行**（换行变空格）→
    #        报 "either no PEM block was supplied or it was malformed"
    #      · 给 base64 → 报 "symmetric keys are not permitted for signing"
    #        （Authelia 会把 base64 解出来当对称密钥用）
    #      · 给文件路径 → 报 "illegal base64 data at input byte 0"（它先当 base64 试）
    #    正解：占位符单独占一行，由 authelia-prep 用 awk 替换成缩进后的 PEM 各行。
    jwks:
      - key: |
          __OIDC_JWKS_PEM__
    # 对 id_token / 授权码等做 HMAC 签名的密钥
    hmac_secret: '{{ secret "/secret/oidc_hmac" }}'
    clients:
      - client_id: nodebb
        # ⚠️ 这里填的是**哈希值**（pbkdf2-sha512 开头），**不能加 plaintext 前缀**！
        #    我踩过这个坑：先把占位符换成了哈希，却忘了删模板里原有的那个前缀，
        #    于是渲染成 "client_secret: 前缀+哈希" —— Authelia 把这整串当**明文**比对，
        #    换 token 时报：The provided client secret did not match the registered client secret.
        #    哈希由 authelia-secrets 用 authelia crypto hash generate pbkdf2 生成。
        #    这样 NodeBB 侧与 Authelia 侧共用同一个明文值，少一处对不上的可能。
        client_secret: '__OIDC_CLIENT_SECRET__'
        # NodeBB 的 fusionauth-oidc 插件的回调地址
        redirect_uris:
          - 'https://__FORUM_DOMAIN__/auth/fusionauth-oidc/callback'
        scopes:
          - openid
          - profile
          - email
          - groups
        # 只允许本组织的成员登录论坛（与门户/内部区的分级一致）
        authorization_policy: one_factor
        consent_mode: implicit
        token_endpoint_auth_method: client_secret_post

# ── 访问控制 ★ 核心（分级就落在这里）────────────────────────────────
access_control:
  default_policy: deny

  rules:
    # ① 鉴权门户自身必须匿名可达（否则登录页也进不去，会死锁）
    - domain: '__AUTH_DOMAIN__'
      policy: bypass

    # ② 公开区：任何人（含未登录）可看
    #    ★ docs/01 §5.3 的硬要求：公开内容不得被登录墙挡住
    - domain: '__PORTAL_DOMAIN__'
      resources:
        - '^/$'
        - '^/blog(/.*)?$'
        - '^/roadmap$'
        - '^/assets/.*$'
        - '^/favicon\.ico$'
      policy: bypass

    # ③ 个人区：任何已登录用户（注册用户级）
    - domain: '__PORTAL_DOMAIN__'
      resources:
        - '^/account(/.*)?$'
      policy: one_factor

    # ③·补 官网后台（Ghost 的 /ghost/）——受保护，但**不挡公开站**
    #
    #    ★ 为什么不能整站挡：Ghost 的公开站在同一个域上，
    #      整站 forward_auth 会把官网也变成"要登录才能看"——违反 docs/01 §5.3。
    #      所以只挡 /ghost/ 这一个前缀。
    #
    #    ⚠️ Ghost **不支持 OIDC**（见 research §九），所以这里是**额外一道门**，
    #      进门之后**仍要输 Ghost 自己的账号密码**。两层并存是否冲突，见 M1 实测。
    #    ⚠️ 门槛与门户一致：门户给"官网后台"标的是 collaborator 级
    #      （见 portal/src/data/services.ts），所以这里放行 core 与 collaborator，
    #      而**无分组的注册用户会被拒**（403）。
    - domain: '__GHOST_DOMAIN__'
      resources:
        - '^/ghost(/.*)?$'
      subject:
        - 'group:livefab-core'
        - 'group:livefab-collaborator'
      policy: one_factor

    # ④ 内部区：**只允许核心成员**（two_factor 且必须在 livefab-core 组）
    #
    #    ⚠️ 这里曾经同时放行 livefab-collaborator —— 那是个**真实的权限漏洞**：
    #    门户按 L4 把"内部区"标成 core 级（协作者看不到入口），
    #    但网关却放协作者进来 → 正是 docs/04 §4.4 说的"**看不见却进得去**"。
    #    现在两边一致：**协作者会落到 default_policy: deny → 403**。
    #
    #    协作者该有的内部权限是"**被指派项目的议题与文档**"（L4 原文），
    #    那属于**按项目收窄**的路径，M2 接入看板/文档时再单独开（届时按项目授权，
    #    而不是像之前那样给一个"全部内部件"的通用门）。
    - domain: '__PORTAL_DOMAIN__'
      resources:
        - '^/admin(/.*)?$'
      subject:
        - 'group:livefab-core'
      policy: two_factor

# ── 双因素：M0 只开 TOTP（不依赖邮件/SMS，先能跑）────────────────────
totp:
  issuer: LiveFab
  period: 30
  digits: 6

# ── 防爆破 ───────────────────────────────────────────────────────────
regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 5m
