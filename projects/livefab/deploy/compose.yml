# LiveFab · M0 骨架
#
# 这是 M0 的"能跑的空壳"：反代 + 前置鉴权 + 门户占位 + 前台件（Ghost）+ 论坛（NodeBB）。
# 目的不是功能，而是**把整合这件事先跑通**——见 docs/03_分阶段落地路线.md §一。
#
# ⚠️ 三条已写进决策、**不要在后来的改动里丢掉**的架构约束：
#   1. 内部件**不发布端口**，只在 internal 网络上；对外只有反代一个入口。
#   2. 前置鉴权**必须分层**——公开区不得被登录墙挡住（docs/01 §5.3）。
#   3. Authelia 的**域名无法用环境变量模板**，故有 authelia-prep 渲染步骤（见下）。
#
# 用法：
#   cp .env.example .env && 编辑 .env（至少改域名与四个密码）
#   docker compose -f deploy/compose.yml up -d
#   bun run tools/validate-compose.ts     # 结构校验（不需要 docker）

name: livefab

services:
  # ── 反代：唯一对外入口（也是 TLS 终止点）──────────────────────────
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      LIVEFAB_DOMAIN: ${LIVEFAB_DOMAIN:?需在 .env 设置}
      LIVEFAB_PORTAL_DOMAIN: ${LIVEFAB_PORTAL_DOMAIN:?需在 .env 设置}
      LIVEFAB_FORUM_DOMAIN: ${LIVEFAB_FORUM_DOMAIN:?需在 .env 设置}
      LIVEFAB_ACME_EMAIL: ${LIVEFAB_ACME_EMAIL:?需在 .env 设置}
      # 本地/内网验证时设 local_certs（生产留空）；早先漏了这一行，
      # 导致开关写进 .env 却传不到容器里，Caddy 仍去走 ACME 并失败。
      LIVEFAB_LOCAL_CERTS: ${LIVEFAB_LOCAL_CERTS:-}
    networks:
      - edge
      - internal
    depends_on:
      authelia:
        condition: service_started
      portal:
        condition: service_started

  # ── 一次性：生成密钥，并直接写到"只读视图"卷 ──────────────────────
  # 密钥放在 authelia_secretview 卷（authelia 以只读挂载它到 /secret/）。
  # 这样 authelia 容器本身不需要写权限拿密钥。
  #
  # ⚠️ 密钥**不进渲染流程**：它们可能含 `/` 或 `&`，会破坏 sed 表达式。
  authelia-secrets:
    image: ghcr.io/authelia/authelia:4.39
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /secret
        # ① 随机密钥（幂等：已存在且非空则跳过）
        for f in jwt session storage reset smtp; do
          if [ ! -s "/secret/$$f" ]; then
            head -c 64 /dev/urandom | base64 | tr -d '\n' > "/secret/$$f"
            echo "已生成密钥: $$f"
          fi
        done
        # ② 数据库密码来自 .env（写成文件，Authelia 以 {{ secret }} 读取）
        if [ ! -s /secret/authelia_db_password ]; then
          printf '%s' "$$AUTHELIA_DB_PASSWORD" > /secret/authelia_db_password
          echo "已写入数据库密码文件"
        fi
        chmod 0444 /secret/*
        chown -R 1000:1000 /secret
    environment:
      AUTHELIA_DB_PASSWORD: ${AUTHELIA_DB_PASSWORD:?需在 .env 设置}
    volumes:
      - authelia_secretview:/secret
    networks:
      - internal

  # ── 一次性：把域名渲染进配置模板 ──────────────────────────────────
  # ★ 为什么需要它：Authelia 的 `{{ env }}` 模板**不能用于 domain / URL 字段**
  #   （真实校验报错：could not decode ... to a *url.URL: invalid character "{" in host name，
  #    并连带导致 access_control 规则整体失效）。
  #   所以域名必须**在启动前写死进配置**。渲染结果写到卷，authelia 读它。
  authelia-prep:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /rendered
        sed -e "s|__PORTAL_DOMAIN__|$$LIVEFAB_PORTAL_DOMAIN|g" \
            -e "s|__AUTH_DOMAIN__|auth.$$LIVEFAB_PORTAL_DOMAIN|g" \
            /template/configuration.template.yml > /rendered/configuration.yml
        if grep -q '__PORTAL_DOMAIN__\|__AUTH_DOMAIN__' /rendered/configuration.yml; then
          echo "✗ 渲染后有残留占位符，模板与变量对不上"; exit 1
        fi
        echo "✓ 配置已渲染（域名已写死）"
    environment:
      LIVEFAB_PORTAL_DOMAIN: ${LIVEFAB_PORTAL_DOMAIN:?需在 .env 设置}
    volumes:
      - ./authelia/configuration.template.yml:/template/configuration.template.yml:ro
      - authelia_rendered:/rendered
    networks:
      - internal

  # ── 前置鉴权：网关层的"挡未登录者"────────────────────────────────
  # Authelia 本体不做反代，它只提供 /api/verify 给 Caddy 的 forward_auth 调用。
  authelia:
    image: ghcr.io/authelia/authelia:4.39
    restart: unless-stopped
    volumes:
      # 渲染结果挂到 /config；users.yml 挂到 /users（**不能挂进上面那个只读挂载点内部**——
      # Docker 无法在 :ro 挂载里创建 mountpoint，会报 "read-only file system"）
      - authelia_rendered:/config:ro
      - ./authelia/users.yml:/users/users.yml:ro
      - authelia_secretview:/secret:ro
    # ★ 密钥经 Authelia 官方支持的 *_FILE 环境变量提供（**唯一来源**）。
    #   踩过的两个坑：
    #   ① 若配置文件里同时用 `{{ secret }}` 读同一密钥，会 fatal：
    #      "it's already defined in other configuration sources" → 只能有一处。
    #   ② `{{ secret }}` 在文件缺失时**静默返回空值**，config validate 仍报成功，
    #      到运行时才以 "password authentication failed" 暴露 → 所以不用它。
    #   另：**故意不设 AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE** —— 它会让 Authelia
    #   以为配了 SMTP，与配置文件里的 filesystem notifier 冲突：
    #      "please ensure only one of the 'smtp' or 'filesystem' notifier is configured"
    environment:
      AUTHELIA_JWT_SECRET_FILE: /secret/jwt
      AUTHELIA_SESSION_SECRET_FILE: /secret/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secret/storage
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secret/reset
      AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE: /secret/authelia_db_password
    # 不发布端口：只在 internal 网络上，由 caddy 反代
    networks:
      - internal
    depends_on:
      authelia-secrets:
        condition: service_completed_successfully
      authelia-prep:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  # ── 统一数据库：一个 PostgreSQL 实例，两个独立库（L12 方案 A）────────
  # Authelia 与 NodeBB 共用；Ghost 仍用 MySQL（它不支持 PG，见 docs/05）。
  # 第二个库由 deploy/postgres/init/01-create-nodebb.sh 在**首次初始化**时创建
  # （官方镜像的 POSTGRES_DB 只能建一个库）。
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authelia
      POSTGRES_USER: authelia
      POSTGRES_PASSWORD: ${AUTHELIA_DB_PASSWORD:?需在 .env 设置}
      # 供初始化脚本创建 NodeBB 的库/用户
      NODEBB_DB_PASSWORD: ${NODEBB_DB_PASSWORD:?需在 .env 设置}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authelia -d authelia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── 门户占位：M0 只需要它"能起来、能被反代、能显示登录状态"──
  # 真正的门户用 Astro 写（L5c），M1 再做。
  portal:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./portal:/usr/share/nginx/html:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── 前台件：Ghost（L5 已定）─────────────────────────────────────
  ghost:
    image: ghost:5-alpine
    restart: unless-stopped
    environment:
      url: https://${LIVEFAB_DOMAIN:?}
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: ghost
      database__connection__password: ${GHOST_DB_PASSWORD:?需在 .env 设置}
      database__connection__database: ghost
      NODE_ENV: production
    volumes:
      - ghost_content:/var/lib/ghost/content
    networks:
      - internal
    depends_on:
      ghost-db:
        condition: service_healthy

  ghost-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${GHOST_DB_ROOT_PASSWORD:?需在 .env 设置}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD:?需在 .env 设置}
    volumes:
      - ghost_db:/var/lib/mysql
    # ── L12 方案 E：把 MySQL 的内存压下来（它一度占全套 48%）────────────
    # 依据是**实测基线**：空载 478 MiB，其中 innodb_log_buffer_size 竟高达 64 MiB
    # （MySQL 默认是 16 MiB），且 performance_schema 开着。
    # 注意：**不动 innodb_buffer_pool_size（保持默认 128 MiB）**——它是真实性能关键，
    #      压它会让查询变慢，不属于"白省的内存"。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 自托管小站用不到 performance_schema 的性能诊断（它自己要占几十 MB）
      - --performance-schema=OFF
      # 64M → 16M（回到官方默认值，本就是异常偏大）
      - --innodb-log-buffer-size=16M
      # 151 → 50 个连接足够（每连接都有独占缓冲）
      - --max-connections=50
      # 4000 个打开表缓存在这个体量下毫无必要
      - --table-open-cache=400
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── 论坛：NodeBB（L6 已定，2026-10-03）──────────────────────────
  # ★ 用 PostgreSQL 而非默认的 MongoDB：复用同一套 PG 引擎（见 research §8.4）。
  #
  # ⚠️ 踩过的两个坑（都靠真启动才暴露）：
  #   ① **镜像不在 Docker Hub**：`nodebb/docker` 停在 2023-07 的 v1.19（已废弃），
  #      官方现发布在 ghcr.io → 必须用 ghcr.io/nodebb/nodebb。
  #   ② **环境变量名不是 POSTGRES_***：NodeBB 的自动化安装认 `NODEBB_*` 前缀
  #      （见镜像内 src/install.js 的 envConfMap）。用错名字会一直停在 web 安装器。
  nodebb-setup:
    # 一次性：初始化数据库 schema 与管理员账号，写出 /opt/config/config.json（幂等）
    image: ghcr.io/nodebb/nodebb:4.16
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        cd /usr/src/app
        mkdir -p /opt/config
        if [ -f /opt/config/config.json ]; then
          echo "已有 config.json，跳过安装（幂等）"
        else
          ./nodebb setup
          echo "NodeBB 安装完成"
        fi
        # ★ 我们在 Caddy 反代后面，必须开 trust_proxy，否则 NodeBB 会把
        #   反代容器 IP 当成用户 IP（日志、限流、封禁全部失准）。
        #   真启动时 NodeBB 自己在日志里警告了这一点。
        node -e '
          const fs=require("fs"), f="/opt/config/config.json";
          const c=JSON.parse(fs.readFileSync(f,"utf8"));
          if (c.trust_proxy !== true) { c.trust_proxy = true; fs.writeFileSync(f, JSON.stringify(c,null,4)); console.log("已设置 trust_proxy=true"); }
          else { console.log("trust_proxy 已为 true"); }
        '
    environment: &nodebb_env
      # ★ 必须显式设 CONFIG_DIR：**覆盖 entrypoint 会跳过它原本设置 CONFIG_DIR 的那段**，
      #   于是 `nodebb setup` 把 config.json 写到应用目录（容器内、不持久），
      #   主容器启动时找不到配置、又回到 web 安装器。
      CONFIG_DIR: /opt/config
      CONFIG: /opt/config/config.json
      NODEBB_URL: https://${LIVEFAB_FORUM_DOMAIN:?}
      NODEBB_DB: postgres
      NODEBB_DB_HOST: db
      NODEBB_DB_PORT: "5432"
      NODEBB_DB_NAME: nodebb
      NODEBB_DB_USER: nodebb
      NODEBB_DB_PASSWORD: ${NODEBB_DB_PASSWORD:?需在 .env 设置}
      NODEBB_ADMIN_USERNAME: ${NODEBB_ADMIN_USERNAME:-admin}
      NODEBB_ADMIN_PASSWORD: ${NODEBB_ADMIN_PASSWORD:?需在 .env 设置}
      NODEBB_ADMIN_EMAIL: ${NODEBB_ADMIN_EMAIL:-admin@livefab.test}
      NODEBB_SECRET: ${NODEBB_SECRET:?需在 .env 设置}
    volumes:
      - nodebb_data:/var/lib/nodebb
      - nodebb_config:/opt/config
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  # 论坛运行时：读 nodebb-setup 写好的 config.json 直接启动
  nodebb:
    image: ghcr.io/nodebb/nodebb:4.16
    restart: unless-stopped
    environment:
      <<: *nodebb_env
    volumes:
      - nodebb_data:/var/lib/nodebb
      - nodebb_config:/opt/config
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      nodebb-setup:
        condition: service_completed_successfully

networks:
  # edge：唯一连外网的一层（只有 caddy）
  edge:
    driver: bridge
  # internal：所有内部件在此；标 internal 防止它们直接出网
  internal:
    driver: bridge
    internal: true

volumes:
  caddy_data:
  caddy_config:
  db_data:
  authelia_rendered:
  authelia_secretview:
  ghost_content:
  ghost_db:
  nodebb_data:
  nodebb_config:
