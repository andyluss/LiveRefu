# LiveFab · M0 骨架
#
# 这是 M0 的"能跑的空壳"：反代 + 前置鉴权 + 门户占位 + 前台件（Ghost）+ 论坛（NodeBB）。
# 目的不是功能，而是**把整合这件事先跑通**——见 docs/03_分阶段落地路线.md §一。
#
# ⚠️ 三条已写进决策、**不要在后来的改动里丢掉**的架构约束：
#   1. 内部件**不发布端口**，只在 internal 网络上；对外只有反代一个入口。
#   2. 前置鉴权**必须分层**——公开区不得被登录墙挡住（docs/01 §5.3）。
#   3. Authelia 的**域名无法用环境变量模板**，故有 authelia-prep 渲染步骤（见下）。
#
# 用法：
#   cp .env.example .env && 编辑 .env（至少改域名与四个密码）
#   docker compose -f deploy/compose.yml up -d
#   bun run tools/validate-compose.ts     # 结构校验（不需要 docker）

name: livefab

services:
  # ── 反代：唯一对外入口（也是 TLS 终止点）──────────────────────────
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      LIVEFAB_DOMAIN: ${LIVEFAB_DOMAIN:?需在 .env 设置}
      LIVEFAB_PORTAL_DOMAIN: ${LIVEFAB_PORTAL_DOMAIN:?需在 .env 设置}
      LIVEFAB_FORUM_DOMAIN: ${LIVEFAB_FORUM_DOMAIN:?需在 .env 设置}
      LIVEFAB_AUTH_DOMAIN: ${LIVEFAB_AUTH_DOMAIN:?需在 .env 设置}
      LIVEFAB_ACME_EMAIL: ${LIVEFAB_ACME_EMAIL:?需在 .env 设置}
      # 本地/内网验证时设 local_certs（生产留空）；早先漏了这一行，
      # 导致开关写进 .env 却传不到容器里，Caddy 仍去走 ACME 并失败。
      LIVEFAB_LOCAL_CERTS: ${LIVEFAB_LOCAL_CERTS:-}
    networks:
      edge:
      internal:
        # ★ 给 Caddy 在 internal 网络上加**公开域名的别名**。
        #   为什么需要：OIDC 的 token 换取是**服务端到服务端**的调用 ——
        #   NodeBB 要 POST 到 https://auth.<域>/api/oidc/token。
        #   但容器内的 DNS 解析不了 *.localhost（实测 EAI_AGAIN，
        #   因为 internal 网络是 internal: true，且 .localhost 不在 Docker DNS 里），
        #   于是换 token 必然失败。
        #   加别名后容器内解析这些域名 → Caddy，再由 Caddy 反代到 authelia，
        #   整条链路都在内部网络、走 Caddy 的证书，不用改端口也不用额外 DNS。
        aliases:
          - ${LIVEFAB_AUTH_DOMAIN:?}
          - ${LIVEFAB_PORTAL_DOMAIN:?}
          - ${LIVEFAB_DOMAIN:?}
          - ${LIVEFAB_FORUM_DOMAIN:?}
    depends_on:
      authelia:
        condition: service_started
      portal:
        condition: service_started

  # ── 一次性：生成密钥，并直接写到"只读视图"卷 ──────────────────────
  # 密钥放在 authelia_secretview 卷（authelia 以只读挂载它到 /secret/）。
  # 这样 authelia 容器本身不需要写权限拿密钥。
  #
  # ⚠️ 密钥**不进渲染流程**：它们可能含 `/` 或 `&`，会破坏 sed 表达式。
  authelia-secrets:
    image: ghcr.io/authelia/authelia:4.39
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /secret
        # ① 随机密钥（幂等：已存在且非空则跳过）
        for f in jwt session storage reset smtp; do
          if [ ! -s "/secret/$$f" ]; then
            head -c 64 /dev/urandom | base64 | tr -d '\n' > "/secret/$$f"
            echo "已生成密钥: $$f"
          fi
        done
        # ② 数据库密码来自 .env（写成文件，Authelia 以 {{ secret }} 读取）
        if [ ! -s /secret/authelia_db_password ]; then
          printf '%s' "$$AUTHELIA_DB_PASSWORD" > /secret/authelia_db_password
          echo "已写入数据库密码文件"
        fi
        # ③ OIDC Provider 的三样东西（M1 统一身份：让 NodeBB 能用同一个账号登录）
        #    · hmac_secret：对 id_token / 授权码签名
        #    · JWKS 私钥：⚠️ 必须是 **base64 编码的 PEM**，不是原始 PEM ——
        #      真实 Authelia 报错原文：
        #        'identity_providers.oidc.jwks[0].key' could not decode to a schema.CryptographicKey:
        #        illegal base64 data at input byte 0
        #    · 客户端密钥：Authelia 侧用**哈希值**，NodeBB 侧用同一个明文值
        if [ ! -s /secret/oidc_hmac ]; then
          head -c 64 /dev/urandom | base64 | tr -d '\n' > /secret/oidc_hmac
          echo "已生成 OIDC hmac_secret"
        fi
        if [ ! -s /secret/oidc_client_secret ]; then
          head -c 32 /dev/urandom | base64 | tr -d '\n' > /secret/oidc_client_secret
          echo "已生成 OIDC 客户端密钥（明文，供 NodeBB 用）"
        fi
        # ★ Authelia 侧要用**哈希**，明文会有弃用警告：
        #   "option 'client_secret' is plaintext but ... it should be a hashed value"
        #   两边的值必须匹配，所以明文给 NodeBB、哈希给 Authelia。
        if [ ! -s /secret/oidc_client_secret_hash ]; then
          authelia crypto hash generate pbkdf2 --password "$$(cat /secret/oidc_client_secret)" \
            | sed -n 's/^Digest: //p' > /secret/oidc_client_secret_hash
          if [ ! -s /secret/oidc_client_secret_hash ]; then
            echo "客户端密钥哈希生成失败" >&2; exit 1
          fi
          echo "已生成 OIDC 客户端密钥哈希（供 Authelia 用）"
        fi
        if [ ! -s /secret/oidc_jwks.pem ]; then
          # 用 Authelia 自己的命令生成 RSA 密钥对
          # ⚠️ 目录必须**预先存在**：--directory 不会自己创建它。
          #    不 mkdir 的话命令静默失败，表现是密钥卷里少一个文件（真启动才发现）。
          mkdir -p /tmp/jwks
          authelia crypto pair rsa generate --directory /tmp/jwks >/dev/null 2>&1
          if [ ! -s /tmp/jwks/private.pem ]; then
            echo "JWKS 私钥生成失败" >&2; exit 1
          fi
          cp /tmp/jwks/private.pem /secret/oidc_jwks.pem
          rm -rf /tmp/jwks
          echo "已生成 OIDC JWKS 私钥"
        fi
        chmod 0444 /secret/*
        chown -R 1000:1000 /secret
    environment:
      AUTHELIA_DB_PASSWORD: ${AUTHELIA_DB_PASSWORD:?需在 .env 设置}
    volumes:
      - authelia_secretview:/secret
    networks:
      - internal

  # ── 一次性：把域名渲染进配置模板 ──────────────────────────────────
  # ★ 为什么需要它：Authelia 的 `{{ env }}` 模板**不能用于 domain / URL 字段**
  #   （真实校验报错：could not decode ... to a *url.URL: invalid character "{" in host name，
  #    并连带导致 access_control 规则整体失效）。
  #   所以域名必须**在启动前写死进配置**。渲染结果写到卷，authelia 读它。
  authelia-prep:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /rendered
        # OIDC 客户端密钥：Authelia 侧要**哈希值**（明文会触发弃用警告）
        CLIENT_SECRET="$$(cat /secret/oidc_client_secret_hash)"
        sed -e "s|__PORTAL_DOMAIN__|$$LIVEFAB_PORTAL_DOMAIN|g" \
            -e "s|__AUTH_DOMAIN__|$$LIVEFAB_AUTH_DOMAIN|g" \
            -e "s|__GHOST_DOMAIN__|$$LIVEFAB_DOMAIN|g" \
            -e "s|__COOKIE_DOMAIN__|$$LIVEFAB_COOKIE_DOMAIN|g" \
            -e "s|__FORUM_DOMAIN__|$$LIVEFAB_FORUM_DOMAIN|g" \
            -e "s|__OIDC_CLIENT_SECRET__|$$CLIENT_SECRET|g" \
            /template/configuration.template.yml > /rendered/configuration.yml
        if grep -qE '__PORTAL_DOMAIN__|__AUTH_DOMAIN__|__GHOST_DOMAIN__|__COOKIE_DOMAIN__|__FORUM_DOMAIN__|__OIDC_CLIENT_SECRET__' /rendered/configuration.yml; then
          echo "渲染后有残留占位符，模板与变量对不上"; exit 1
        fi
        # ★ JWKS 私钥要作为 **YAML 块标量** 注入（每行缩进一致），
        #   不能走 sed —— 多行替换用 sed 很别扭，且缩进必须对齐。
        awk '/__OIDC_JWKS_PEM__/ {
               while ((getline line < "/secret/oidc_jwks.pem") > 0) print "          " line
               close("/secret/oidc_jwks.pem"); next
             }
             { print }' /rendered/configuration.yml > /rendered/.cfg.new
        mv /rendered/.cfg.new /rendered/configuration.yml
        if grep -q '__OIDC_JWKS_PEM__' /rendered/configuration.yml; then
          echo "JWKS 私钥注入失败"; exit 1
        fi
        echo "配置已渲染（域名写死 + JWKS 私钥内联）"
    environment:
      LIVEFAB_PORTAL_DOMAIN: ${LIVEFAB_PORTAL_DOMAIN:?需在 .env 设置}
      LIVEFAB_DOMAIN: ${LIVEFAB_DOMAIN:?需在 .env 设置}
      LIVEFAB_AUTH_DOMAIN: ${LIVEFAB_AUTH_DOMAIN:?需在 .env 设置}
      LIVEFAB_COOKIE_DOMAIN: ${LIVEFAB_COOKIE_DOMAIN:?需在 .env 设置}
      LIVEFAB_FORUM_DOMAIN: ${LIVEFAB_FORUM_DOMAIN:?需在 .env 设置}
    volumes:
      - ./authelia/configuration.template.yml:/template/configuration.template.yml:ro
      - authelia_rendered:/rendered
      # 渲染时要读 OIDC 客户端密钥（它是密钥，故只在密钥卷里）
      - authelia_secretview:/secret:ro
    networks:
      - internal

  # ── 前置鉴权：网关层的"挡未登录者"────────────────────────────────
  # Authelia 本体不做反代，它只提供 /api/verify 给 Caddy 的 forward_auth 调用。
  authelia:
    image: ghcr.io/authelia/authelia:4.39
    restart: unless-stopped
    # ★ 必须显式开启模板过滤器，否则配置里的 `{{ secret "..." }}` 会**作为字面量**透传
    #   （真实 Authelia 实测：不开启时 log.level 会报 "configured as '{{ secret ... }}'"）。
    #   OIDC 的 JWKS 密钥与 hmac 需要它（它们的值必须嵌进 YAML 结构，无法走 *_FILE）。
    #   entrypoint 见到 $1 是 --config 会走 `authelia "$@"` 分支，故这样传参是安全的。
    # ⚠️ 必须用**空格分隔**的形式，不能写 `--config=...`！
    #    镜像的 entrypoint.sh 第 10 行是：
    #      if [ -n "$1" ] && [ "$1" != "--config" ]; then exec "$@"; else exec authelia "$@"; fi
    #    写成等号形式时 $1 是 "--config=..." ≠ "--config"，于是走了 exec "$@" 分支，
    #    把参数当成**命令**执行 → 反复报 "entrypoint.sh: exec: line 10: illegal option --" 并重启。
    command:
      - --config
      - /config/configuration.yml
      - --config.experimental.filters
      - template
    volumes:
      # 渲染结果挂到 /config；users.yml 挂到 /users（**不能挂进上面那个只读挂载点内部**——
      # Docker 无法在 :ro 挂载里创建 mountpoint，会报 "read-only file system"）
      - authelia_rendered:/config:ro
      - ./authelia/users.yml:/users/users.yml:ro
      - authelia_secretview:/secret:ro
    # ★ 密钥经 Authelia 官方支持的 *_FILE 环境变量提供（**唯一来源**）。
    #   踩过的两个坑：
    #   ① 若配置文件里同时用 `{{ secret }}` 读同一密钥，会 fatal：
    #      "it's already defined in other configuration sources" → 只能有一处。
    #   ② `{{ secret }}` 在文件缺失时**静默返回空值**，config validate 仍报成功，
    #      到运行时才以 "password authentication failed" 暴露 → 所以不用它。
    #   另：**故意不设 AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE** —— 它会让 Authelia
    #   以为配了 SMTP，与配置文件里的 filesystem notifier 冲突：
    #      "please ensure only one of the 'smtp' or 'filesystem' notifier is configured"
    environment:
      AUTHELIA_JWT_SECRET_FILE: /secret/jwt
      AUTHELIA_SESSION_SECRET_FILE: /secret/session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secret/storage
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secret/reset
      AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE: /secret/authelia_db_password
    # 不发布端口：只在 internal 网络上，由 caddy 反代
    networks:
      - internal
    depends_on:
      authelia-secrets:
        condition: service_completed_successfully
      authelia-prep:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  # ── 统一数据库：一个 PostgreSQL 实例，两个独立库（L12 方案 A）────────
  # Authelia 与 NodeBB 共用；Ghost 仍用 MySQL（它不支持 PG，见 docs/05）。
  # 第二个库由 deploy/postgres/init/01-create-nodebb.sh 在**首次初始化**时创建
  # （官方镜像的 POSTGRES_DB 只能建一个库）。
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authelia
      POSTGRES_USER: authelia
      POSTGRES_PASSWORD: ${AUTHELIA_DB_PASSWORD:?需在 .env 设置}
      # 供初始化脚本创建 NodeBB 的库/用户
      NODEBB_DB_PASSWORD: ${NODEBB_DB_PASSWORD:?需在 .env 设置}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authelia -d authelia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── 门户：唯一自研件（L11）──────────────────────────────────────
  # 真 Astro SSR 应用：**必须服务端渲染**，因为要读 Caddy 注入的身份头。
  # 镜像内构建（本机沙箱禁止包管理器写临时目录，且镜像内构建才可复现）。
  portal:
    build:
      # ★ 相对路径以**本 compose 文件所在目录**（deploy/）为基准，不是执行目录。
      #   写成 ./portal 会变成 deploy/portal（不存在）——这个坑在 M0 已经踩过一次。
      context: ../portal
    restart: unless-stopped
    environment:
      # 各件主机名由 env 注入，代码不硬编码 → 本地 *.localhost 与生产真实域名只差一份 env
      PORTAL_HOST: ${LIVEFAB_PORTAL_DOMAIN:?}
      AUTH_HOST: ${LIVEFAB_AUTH_DOMAIN:?}
      GHOST_HOST: ${LIVEFAB_DOMAIN:?}
      FORUM_HOST: ${LIVEFAB_FORUM_DOMAIN:?}
    networks:
      - internal
    healthcheck:
      # Astro 的 standalone 服务在 / 上返回 200
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4321/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── 前台件：Ghost（L5 已定）─────────────────────────────────────
  ghost:
    image: ghost:5-alpine
    restart: unless-stopped
    environment:
      url: https://${LIVEFAB_DOMAIN:?}
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: ghost
      database__connection__password: ${GHOST_DB_PASSWORD:?需在 .env 设置}
      database__connection__database: ghost
      NODE_ENV: production
      # ★ Ghost 的登录通知/邀请/密码重置都要发邮件；**没配邮件时登录会失败**
      #   （真启动才暴露：session 接口报 "Failed to send email"）。
      #   M0/M1 阶段接 Mailpit（本地邮件捕获器），M2 的"邮件送达"再换真实 SMTP。
      mail__transport: SMTP
      mail__options__host: mailpit
      mail__options__port: "1025"
      mail__from: '"LiveFab" <noreply@livefab.test>'
    volumes:
      - ghost_content:/var/lib/ghost/content
    networks:
      - internal
    depends_on:
      ghost-db:
        condition: service_healthy

  # ── 邮件捕获器（本地开发用）──────────────────────────────────────
  # 为什么需要：Ghost 的登录通知/邀请/密码重置都依赖发信，
  # **没配邮件时 Ghost 的登录会直接失败**（真启动才暴露）。
  # Mailpit 捕获所有外发邮件并在网页里展示，不会真的发出去——本地开发正合适。
  # M2 的"邮件送达"会换成 listmonk/真实 SMTP，那时它可退为调试工具。
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks:
      - internal

  ghost-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${GHOST_DB_ROOT_PASSWORD:?需在 .env 设置}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD:?需在 .env 设置}
    volumes:
      - ghost_db:/var/lib/mysql
    # ── L12 方案 E：把 MySQL 的内存压下来（它一度占全套 48%）────────────
    # 依据是**实测基线**：空载 478 MiB，其中 innodb_log_buffer_size 竟高达 64 MiB
    # （MySQL 默认是 16 MiB），且 performance_schema 开着。
    # 注意：**不动 innodb_buffer_pool_size（保持默认 128 MiB）**——它是真实性能关键，
    #      压它会让查询变慢，不属于"白省的内存"。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 自托管小站用不到 performance_schema 的性能诊断（它自己要占几十 MB）
      - --performance-schema=OFF
      # 64M → 16M（回到官方默认值，本就是异常偏大）
      - --innodb-log-buffer-size=16M
      # 151 → 50 个连接足够（每连接都有独占缓冲）
      - --max-connections=50
      # 4000 个打开表缓存在这个体量下毫无必要
      - --table-open-cache=400
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── 论坛：NodeBB（L6 已定，2026-10-03）──────────────────────────
  # ★ 用 PostgreSQL 而非默认的 MongoDB：复用同一套 PG 引擎（见 research §8.4）。
  #
  # ⚠️ 踩过的两个坑（都靠真启动才暴露）：
  #   ① **镜像不在 Docker Hub**：`nodebb/docker` 停在 2023-07 的 v1.19（已废弃），
  #      官方现发布在 ghcr.io → 必须用 ghcr.io/nodebb/nodebb。
  #   ② **环境变量名不是 POSTGRES_***：NodeBB 的自动化安装认 `NODEBB_*` 前缀
  #      （见镜像内 src/install.js 的 envConfMap）。用错名字会一直停在 web 安装器。
  nodebb-setup:
    # 一次性：初始化数据库 schema 与管理员账号、写出 config.json、**激活并配置 OIDC 插件**（幂等）
    # 用自建镜像（预装了 nodebb-plugin-fusionauth-oidc）——运行时容器无外网，装不了插件。
    # 构建：docker build -t livefab-nodebb-oidc:4.16 deploy/nodebb
    # （取包与布局见 deploy/nodebb/Dockerfile 与 fetch-plugin.sh 的说明）
    image: livefab-nodebb-oidc:4.16
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        cd /usr/src/app
        mkdir -p /opt/config
        if [ -f /opt/config/config.json ]; then
          echo "已有 config.json，跳过安装（幂等）"
        else
          ./nodebb setup
          echo "NodeBB 安装完成"
        fi
        # ★ 我们在 Caddy 反代后面，必须开 trust_proxy，否则 NodeBB 会把
        #   反代容器 IP 当成用户 IP（日志、限流、封禁全部失准）。
        #   真启动时 NodeBB 自己在日志里警告了这一点。
        node -e '
          const fs=require("fs"), f="/opt/config/config.json";
          const c=JSON.parse(fs.readFileSync(f,"utf8"));
          let changed=[];
          // trust_proxy 必须开（反代后面的客户端 IP 才正确）
          if (c.trust_proxy !== true) { c.trust_proxy = true; changed.push("trust_proxy"); }
          // ★ url 必须**跟随域名变化**同步：config.json 里的 url 是安装时写死的，
          //   改了域名（本地 *.localhost ↔ 生产真实域名）不同步的话，
          //   NodeBB 会生成指向旧域名的链接（邮件、分享、跳转全错）。
          const want = process.env.NODEBB_URL;
          if (want && c.url !== want) { c.url = want; changed.push("url: " + want); }
          if (changed.length) { fs.writeFileSync(f, JSON.stringify(c,null,4)); console.log("已同步: " + changed.join(", ")); }
          else { console.log("config.json 无需改动"); }
        '
        # ★ 激活并配置 OIDC 插件（M1「用**同一个账号**发帖」的落地）
        #   为什么直接写库：NodeBB 的插件激活与设置在它自己的库里
        #     · 激活 = plugins:active 这个 zset 里加一项
        #     · 配置 = settings:<plugin-id> 这个 hash（data 是 JSONB）
        #   而 `./nodebb` CLI 在这种一次性容器里会挂住（实测 --help 都不返回），
        #   所以用 NodeBB 自带的 pg 模块直接写。幂等。
        # ★ 把插件声明为 **file: 依赖**，让 entrypoint 那次 npm install 能离线装好它。
        #   为什么必须这样做：官方镜像用 VOLUME 把 node_modules 声明成匿名卷
        #   （遮住镜像里 COPY 的文件），且 entrypoint 每次启动都跑 npm install
        #   按 package.json 裁剪多余包 —— 所以"直接塞 node_modules"必然被清掉。
        #   声明成 file: 依赖 + 用**自带依赖的 tarball**，才既不被裁掉、又不需要联网。
        node -e '
          const fs = require("fs");
          const f = "/opt/config/package.json";
          const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
          pkg.dependencies = pkg.dependencies || {};
          const want = "file:/opt/plugin/nodebb-plugin-fusionauth-oidc.tgz";
          if (pkg.dependencies["nodebb-plugin-fusionauth-oidc"] !== want) {
            pkg.dependencies["nodebb-plugin-fusionauth-oidc"] = want;
            fs.writeFileSync(f, JSON.stringify(pkg, null, 2));
            console.log("已把 OIDC 插件声明为 file: 依赖");
          } else {
            console.log("OIDC 插件依赖声明已存在");
          }
        '
        # 客户端密钥从密钥卷读（它是密钥，不写进 .env）
        export OIDC_CLIENT_SECRET="$(cat /secret/oidc_client_secret)"
        node -e '
          const { Client } = require("pg");
          const id = "nodebb-plugin-fusionauth-oidc";
          const auth = process.env.OIDC_AUTH_BASE;
          const settings = {
            clientId: process.env.OIDC_CLIENT_ID,
            clientSecret: process.env.OIDC_CLIENT_SECRET,
            authorizationEndpoint: auth + "/api/oidc/authorization",
            tokenEndpoint: auth + "/api/oidc/token",
            userInfoEndpoint: auth + "/api/oidc/userinfo",
            emailClaim: "email",
            rolesClaim: "groups",
          };
          (async () => {
            const c = new Client({
              host: process.env.NODEBB_DB_HOST, port: +process.env.NODEBB_DB_PORT,
              user: process.env.NODEBB_DB_USER, password: process.env.NODEBB_DB_PASSWORD,
              database: process.env.NODEBB_DB_NAME,
            });
            await c.connect();
            // 清掉早期写错命名空间留下的键（避免留垃圾）
            await c.query("DELETE FROM legacy_hash WHERE _key=$1", ["settings:" + id]);
            await c.query("DELETE FROM legacy_object WHERE _key=$1", ["settings:" + id]);
            // ① 激活：plugins:active 的 zset；legacy_object 是主索引表，两处都要有
            const { rows: mx } = await c.query("SELECT COALESCE(MAX(score),-1)+1 AS s FROM legacy_zset WHERE _key=$1", ["plugins:active"]);
            await c.query("INSERT INTO legacy_object(_key,type) VALUES($1,$2) ON CONFLICT (_key) DO NOTHING", ["plugins:active","zset"]);
            await c.query("INSERT INTO legacy_zset(_key,value,score,type) VALUES($1,$2,$3,$4) ON CONFLICT (_key,value) DO NOTHING", ["plugins:active", id, mx[0].s, "zset"]);
            // ② 配置：settings:<namespace> 的 hash
            //    ⚠️ 命名空间**不是插件 id**！插件源码里是
            //      new Settings("fusionauth-oidc", ...)
            //    所以要写 settings:fusionauth-oidc。写成插件 id 会另建一个键，
            //    插件读不到自己的设置、只打 "OpenID Connect will not be available
            //    until it is configured!"，登录路由 404 —— 我踩过这个坑。
            const key = "settings:fusionauth-oidc";
            await c.query("INSERT INTO legacy_object(_key,type) VALUES($1,$2) ON CONFLICT (_key) DO NOTHING", [key,"hash"]);
            await c.query("INSERT INTO legacy_hash(_key,data,type) VALUES($1,$2::jsonb,$3) ON CONFLICT (_key) DO UPDATE SET data=EXCLUDED.data", [key, JSON.stringify(settings), "hash"]);
            const { rows: chk } = await c.query("SELECT value FROM legacy_zset WHERE _key=$1 AND value=$2", ["plugins:active", id]);
            console.log(chk.length ? "OIDC 插件已激活并配置" : "OIDC 插件激活失败");
            await c.end();
          })().catch(e => { console.error("插件配置失败:", e.message); process.exit(1); });
        '
    environment: &nodebb_env
      # ★ 必须显式设 CONFIG_DIR：**覆盖 entrypoint 会跳过它原本设置 CONFIG_DIR 的那段**，
      #   于是 `nodebb setup` 把 config.json 写到应用目录（容器内、不持久），
      #   主容器启动时找不到配置、又回到 web 安装器。
      CONFIG_DIR: /opt/config
      CONFIG: /opt/config/config.json
      NODEBB_URL: https://${LIVEFAB_FORUM_DOMAIN:?}
      NODEBB_DB: postgres
      NODEBB_DB_HOST: db
      NODEBB_DB_PORT: "5432"
      NODEBB_DB_NAME: nodebb
      NODEBB_DB_USER: nodebb
      NODEBB_DB_PASSWORD: ${NODEBB_DB_PASSWORD:?需在 .env 设置}
      NODEBB_ADMIN_USERNAME: ${NODEBB_ADMIN_USERNAME:-admin}
      NODEBB_ADMIN_PASSWORD: ${NODEBB_ADMIN_PASSWORD:?需在 .env 设置}
      NODEBB_ADMIN_EMAIL: ${NODEBB_ADMIN_EMAIL:-admin@livefab.test}
      NODEBB_SECRET: ${NODEBB_SECRET:?需在 .env 设置}
      # OIDC 插件配置所需（客户端密钥另从密钥卷读，不写进 .env）
      # ⚠️ 必须放在 **&nodebb_env 锚点**里：nodebb 与 nodebb-setup 共用这段，
      #    而写设置的脚本跑在 nodebb-setup 里 —— 放错服务会导致
      #    process.env 取不到值，存进库里的端点变成 "undefined/api/oidc/..."。
      OIDC_CLIENT_ID: nodebb
      OIDC_AUTH_BASE: https://${LIVEFAB_AUTH_DOMAIN:?}
      # ★ 信任 Caddy 的内网 CA —— 否则服务端换 token 会报
      #   UNABLE_TO_GET_ISSUER_CERT_LOCALLY（实测踩到）。
      #   NODE_EXTRA_CA_CERTS 会加进 Node 的信任库，对 fetch/https 都生效。
      NODE_EXTRA_CA_CERTS: /opt/caddy-ca/root.crt
    volumes:
      - nodebb_data:/var/lib/nodebb
      - nodebb_config:/opt/config
      # 读 OIDC 客户端密钥（与 Authelia 侧同源，保证两边一致）
      - authelia_secretview:/secret:ro
      # 信任 Caddy 的内网 CA（服务端换 token 用）
      - ./caddy/ca/root.crt:/opt/caddy-ca/root.crt:ro
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      authelia-secrets:
        condition: service_completed_successfully

  # 论坛运行时：读 nodebb-setup 写好的 config.json 直接启动
  nodebb:
    # 同上：必须用带 OIDC 插件的镜像，否则插件不会被加载
    image: livefab-nodebb-oidc:4.16
    restart: unless-stopped
    environment:
      <<: *nodebb_env
    volumes:
      - nodebb_data:/var/lib/nodebb
      - nodebb_config:/opt/config
      # 信任 Caddy 的内网 CA（与 nodebb 一致）
      - ./caddy/ca/root.crt:/opt/caddy-ca/root.crt:ro
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      nodebb-setup:
        condition: service_completed_successfully

networks:
  # edge：唯一连外网的一层（只有 caddy）
  edge:
    driver: bridge
  # internal：所有内部件在此；标 internal 防止它们直接出网
  internal:
    driver: bridge
    internal: true

volumes:
  caddy_data:
  caddy_config:
  db_data:
  authelia_rendered:
  authelia_secretview:
  ghost_content:
  ghost_db:
  nodebb_data:
  nodebb_config:
