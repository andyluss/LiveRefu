i, sans-serif" font-size="17" font-weight="700" fill="#F2F7FA">15</text><text x="308" y="482" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" fill="#9FB3C4">护甲</text></g><g><rect x="343" y="430" width="55" height="62" rx="9" fill="#101a24" stroke="#7FC7EA" stroke-width="1.1" opacity=".92"/><text x="371" y="462" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#F2F7FA">20</text><text x="371" y="482" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" fill="#9FB3C4">威胁值</text></g>
<text x="30" y="522" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#DCE6F2">终局单位：50% 血量变招，一次失误就归零</text>
<text x="30" y="544" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#9FB3C4">威胁值 20；护甲 15；第八节点固定出场，50% 血量触发阶段技</text>
<text x="30" y="566" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#7f93a8">美术设定002 · 千禧透明 · 单位设定（样例）</text>
