  <use href="#spark" transform="translate(70,60) scale(0.7)"/><use href="#spark" transform="translate(392,96) scale(0.55)"/><use href="#spark" transform="translate(64,372) scale(0.5)"/><use href="#spark" transform="translate(398,330) scale(0.65)"/><use href="#spark" transform="translate(112,470) scale(0.45)"/>
</g>
<text x="16" y="626" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8fa3bd">ANV-S01 过载射击 · 费用 15 · 技能 · 弹药</text>
