  <rect x="354" y="46" width="56" height="56" rx="12" fill="#F2F7FA" opacity=".92"/>
  <text x="382" y="84" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#1B2733">15</text>
  <rect x="54" y="138" width="352" height="176" rx="12" fill="#101a24" opacity=".55" stroke="#F2F7FA" stroke-width="1.2"/>
  <g><polygon points="300,170 259,187 265,231 230,203 195,231 201,187 160,170 201,153 195,109 230,137 265,109 259,153" fill="#4FA8D8" opacity=".45" filter="url(#bloom)"/><circle cx="230" cy="170" r="25" fill="#F2F7FA" opacity=".85"/></g>
  <g><rect x="34" y="270" width="104" height="62" rx="9" fill="#101a24" stroke="#7FC7EA" stroke-width="1.2" opacity=".92"/><text x="86" y="304" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#F2F7FA">+40%</text><text x="86" y="324" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#9FB3C4">全场攻速</text></g><g><rect x="150" y="270" width="104" height="62" rx="9" fill="#101a24" stroke="#7FC7EA" stroke-width="1.2" opacity=".92"/><text x="202" y="304" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#F2F7FA">6</text><text x="202" y="324" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#9FB3C4">持续 s</text></g><g><rect x="266" y="270" width="104" height="62" rx="9" fill="#101a24" stroke="#7FC7EA" stroke-width="1.2" opacity=".92"/><text x="318" y="304" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#F2F7FA">—</text><text x="318" y="324" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#9FB3C4">标签</text></g>
  <rect x="54" y="346" width="150" height="34" rx="17" fill="#D97706"/>
  <text x="129" y="369" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#F7FBFF">关键词：弹药</text>
  <text x="220" y="369" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#9FB3C4">槽位：技能</text>
  <text x="54" y="412" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#DCE6F2">全场攻速 +40%、持续 6s</text>
  <text x="54" y="440" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#9FB3C4">on_cast：同标签塔额外 +10%</text>
  <rect x="54" y="456" width="352" height="12" rx="6" fill="#D97706"/>
  <text x="54" y="498" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#7f93a8">美术设定002 · 千禧透明 · 全量卡面（样例）</text>
  <text x="54" y="518" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#7f93a8">数值引自 14 / 15 / 16 号卡表，未经改动</text>
