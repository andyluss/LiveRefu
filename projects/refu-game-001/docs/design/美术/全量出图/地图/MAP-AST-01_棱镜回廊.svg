<text x="40" y="54" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#9FB3C4">塔位 标准 10 / 支援 3 / 修饰 2　｜　路径 约 45s 一圈（环形）　｜　事件槽 1　｜　推荐章节 第 4 章　｜　单入口</text>
<text x="40" y="622" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12.5" fill="#9FB3C4">波次卡组：WAV-AST-A 普通 ｜ WAV-AST-B 精英 ｜ WAV-AST-C 周常</text>
<text x="40" y="642" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#7f93a8">环形路径 + 三块共鸣石 + 一块虚空（不可放置）。这是"相邻既是力量也是脆弱"这张图的来源。</text>
