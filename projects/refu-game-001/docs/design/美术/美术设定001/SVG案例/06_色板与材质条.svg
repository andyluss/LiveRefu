<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="001 · 色板与材质条">

<defs>
  <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5FF3E0"/><stop offset=".35" stop-color="#4FD8FF"/>
    <stop offset=".65" stop-color="#B26BFF"/><stop offset="1" stop-color="#FFD86B"/></linearGradient>
  <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".85"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".04"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".16"/></linearGradient>
  <linearGradient id="iri" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B6E8FF" stop-opacity=".55"/><stop offset=".33" stop-color="#FFD3EE" stop-opacity=".5"/>
    <stop offset=".66" stop-color="#DDF7A8" stop-opacity=".45"/><stop offset="1" stop-color="#DCC9FF" stop-opacity=".5"/></linearGradient>
  <radialGradient id="inner" cx="50%" cy="46%" r="62%">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".38"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".07"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <pattern id="dust" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="none"/><circle cx="1.5" cy="2" r=".6" fill="#FFFFFF" opacity=".16"/>
    <circle cx="4.5" cy="4.5" r=".5" fill="#FFFFFF" opacity=".1"/></pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000000" opacity=".12"/></pattern>
  <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="refract" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs>
<defs>
  <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e2c07a"/><stop offset=".45" stop-color="#b08d4f"/><stop offset="1" stop-color="#77592c"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9fb3c4"/><stop offset=".5" stop-color="#54687a"/><stop offset="1" stop-color="#2c3843"/>
  </linearGradient>
  <linearGradient id="sandg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e6d3ab"/><stop offset="1" stop-color="#a98f66"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f3ead6"/><stop offset="1" stop-color="#ddd0b4"/>
  </linearGradient>
  <radialGradient id="crtg" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#9dffb8" stop-opacity=".95"/><stop offset="1" stop-color="#7ce38b" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="moss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7fa05a"/><stop offset="1" stop-color="#3d5a34"/>
  </linearGradient>
  <linearGradient id="prismg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#dfeaf6"/><stop offset="1" stop-color="#9fb4cc"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" y="0" fill="#000000" opacity=".10"/>
  </pattern>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#8a7a58" stroke-width="2" opacity=".55"/>
  </pattern>
</defs>
<rect width="512" height="512" fill="#111820"/>
<g><text x="32" y="72" font-family="PingFang SC, sans-serif" font-size="16" fill="#e8eefb">全局色板（001）</text><text x="32" y="96" font-family="PingFang SC, sans-serif" font-size="12" fill="#94a3b8">主色四族 + 黄铜 + CRT 绿；数量限制与用法见 00 号总纲</text><g><rect x="32" y="120" width="60" height="120" rx="8" fill="#2F4A63" stroke="#0f141a" stroke-width="2"/><text x="62" y="258" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#e8eefb">铁砧冷钢蓝</text><text x="62" y="276" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">#2F4A63</text></g><g><rect x="108" y="120" width="60" height="120" rx="8" fill="#45663A" stroke="#0f141a" stroke-width="2"/><text x="138" y="258" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#e8eefb">涌潮腐殖绿</text><text x="138" y="276" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">#45663A</text></g><g><rect x="184" y="120" width="60" height="120" rx="8" fill="#EAF1FA" stroke="#0f141a" stroke-width="2"/><text x="214" y="258" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#e8eefb">星辉棱镜白</text><text x="214" y="276" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">#EAF1FA</text></g><g><rect x="260" y="120" width="60" height="120" rx="8" fill="#D8452B" stroke="#0f141a" stroke-width="2"/><text x="290" y="258" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#e8eefb">敌方警示橙红</text><text x="290" y="276" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">#D8452B</text></g><g><rect x="336" y="120" width="60" height="120" rx="8" fill="#B08D4F" stroke="#0f141a" stroke-width="2"/><text x="366" y="258" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#e8eefb">黄铜</text><text x="366" y="276" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">#B08D4F</text></g><g><rect x="412" y="120" width="60" height="120" rx="8" fill="#7CE38B" stroke="#0f141a" stroke-width="2"/><text x="442" y="258" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#e8eefb">CRT 绿字</text><text x="442" y="276" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">#7CE38B</text></g><text x="32" y="306" font-family="PingFang SC, sans-serif" font-size="16" fill="#e8eefb">五类材质语言</text><g><rect x="32" y="330" width="74" height="60" rx="6" fill="url(#brass)" stroke="#3d4a57" stroke-width="2"/><text x="69" y="410" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#c9d4e6">黄铜 brass</text></g><g><rect x="124" y="330" width="74" height="60" rx="6" fill="url(#steel)" stroke="#3d4a57" stroke-width="2"/><text x="161" y="410" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#c9d4e6">冷钢 steel</text></g><g><rect x="216" y="330" width="74" height="60" rx="6" fill="url(#paper)" stroke="#3d4a57" stroke-width="2"/><text x="253" y="410" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#c9d4e6">纸张 paper</text></g><g><rect x="308" y="330" width="74" height="60" rx="6" fill="url(#sandg)" stroke="#3d4a57" stroke-width="2"/><text x="345" y="410" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#c9d4e6">沙尘 sand</text></g><g><rect x="400" y="330" width="74" height="60" rx="6" fill="#0d1a12" stroke="#3d4a57" stroke-width="2"/><text x="437" y="410" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#c9d4e6">CRT 屏</text></g><rect width="512" height="512" fill="url(#scan)" opacity=".35"/></g>
<text x="16" y="496" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="15" fill="#e8eefb" opacity=".92">001 · 色板与材质条</text>
<g><rect x="60" y="60" width="392" height="362" rx="12" fill="url(#dust)"/><rect x="60" y="60" width="392" height="362" rx="12" fill="url(#scan)" opacity=".45"/><rect x="60" y="60" width="392" height="362" rx="12" fill="url(#inner)"/><g filter="url(#bloom)" opacity=".5"><circle cx="154" cy="161" r="26" fill="#7CE38B" opacity=".35"/></g><rect x="64" y="64" width="20" height="354" rx="10" fill="url(#spec)" opacity=".4"/><rect x="60" y="60" width="392" height="362" rx="12" fill="none" stroke="#000000" stroke-width="1" opacity=".25"/></g>
<text x="16" y="478" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="12" fill="#94a3b8">美术设定001 · 复古未来 · 样例 SVG（非最终稿）</text>
</svg>
