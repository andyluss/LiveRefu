  <g stroke="#ffffff" stroke-width="2" opacity=".9"><line x1="256" y1="196" x2="256" y2="438"/></g>
  <g stroke="#6bd5ff" stroke-width="1.6" opacity=".9"><line x1="196" y1="236" x2="316" y2="236"/><line x1="196" y1="312" x2="316" y2="312"/></g>
  <ellipse cx="256" cy="430" rx="120" ry="22" fill="#7ce38b" opacity=".18"/>
  <rect x="206" y="316" width="100" height="58" rx="5" fill="#11161d"/>
  <rect x="206" y="316" width="100" height="58" rx="5" fill="url(#crtg)" opacity=".3"/>
  <text x="214" y="340" font-family="monospace" font-size="14" fill="#7ce38b">DMG 16</text>
  <text x="214" y="358" font-family="monospace" font-size="12" fill="#7ce38b">SHIELD 120</text>
  <g fill="#b08d4f"><circle cx="200" cy="240" r="5"/><circle cx="312" cy="240" r="5"/><circle cx="200" cy="404" r="5"/><circle cx="312" cy="404" r="5"/></g>
  <g filter="url(#soft)" opacity=".85"><circle cx="256" cy="122" r="26" fill="#ffffff" opacity=".35"/></g>
  <rect width="512" height="512" fill="url(#scan)" opacity=".35"/>
