<rect width="512" height="512" fill="#1b222b"/>

<g>
  <rect width="512" height="512" fill="#141c26"/>
  <g opacity=".5" stroke="#7ce38b" stroke-width="1">
    <line x1="40" y1="430" x2="472" y2="430"/><line x1="40" y1="452" x2="472" y2="452"/></g>
  <polygon points="256,58 330,150 256,196 182,150" fill="url(#prismg)" opacity=".9"/>
  <polygon points="256,58 292,150 256,196" fill="#ffffff" opacity=".55"/>
  <polygon points="256,196 316,236 316,412 256,438" fill="url(#prismg)" opacity=".78"/>
