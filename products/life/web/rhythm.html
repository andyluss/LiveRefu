<!doctype html>
<html lang="zh-CN" data-theme="system" data-appearance="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跨应用节律 · Life</title>
  <link rel="icon" href="/shared/icons/life/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/shared/icons/life/favicon.svg">
  <link rel="apple-touch-icon" href="/shared/icons/life/apple-touch-icon.png">
  <link rel="manifest" href="/shared/icons/life/manifest.webmanifest">
  <meta name="theme-color" content="#0F6B63">
  <script src="/shared/boot.js"></script>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/themes.generated.css">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/shared/life.css">
  <link rel="stylesheet" href="/rhythm.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><img class="brand-logo" src="/shared/logos/life.svg" alt=""><span><b>Life</b><small>跨应用节律</small></span></a><span class="spacer"></span><div id="theme-controls" class="theme-controls"></div></header>
  <main class="app rhythm-page">
    <div class="rhythm-top"><a class="back" href="/">← 融合主页</a><span class="hint">只读聚合 · 不复制数据</span></div>
    <section class="rhythm-hero">
      <div><div class="eyebrow">CROSS-APP RHYTHM</div><h1>把日子放回<br>月亮的尺度。</h1><p>按你定义的日、旬、月、朋、季、年看跨应用记录。以月为核心，而不是被周切碎。</p></div>
      <div class="rhythm-def"><b>周期说明</b><p><strong>本旬</strong>：1–10 / 11–20 / 21–月末<br><strong>本朋</strong>：两个月一期，一年六期<br><strong>本季</strong>：春从 3 月开始，三个月一季</p></div>
    </section>
    <div id="periods" class="period-tabs" role="tablist"></div>
    <div class="range-line"><span id="range-label">—</span><span id="range-meta"></span></div>
    <div class="rhythm-layout">
      <aside class="app-filter card"><div class="card-head"><div><small>FILTER</small><h2>应用</h2></div><button id="all-apps" class="btn btn-ghost btn-sm">全选</button></div><div id="app-chips" class="app-chips"></div><p class="hint" id="selected-count">—</p></aside>
      <section class="rhythm-panel card"><div class="rhythm-head"><div><small id="period-kicker">PERIOD</small><h2 id="period-title">本月</h2></div><div class="rhythm-stats" id="rhythm-stats"></div></div><div id="chart" class="rhythm-chart" aria-label="跨应用记录节律"></div><div id="empty" class="empty" hidden>这个周期没有记录。</div></section>
    </div>
    <div id="breakdown" class="breakdown"></div>
  </main>
  <script type="module" src="/rhythm.js"></script>
</body>
</html>
