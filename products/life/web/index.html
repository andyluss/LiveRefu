<!doctype html>
<html lang="zh-CN" data-theme="system" data-appearance="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life · 融合页</title>
  <link rel="icon" href="/shared/icons/life/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/shared/icons/life/favicon.svg">
  <link rel="apple-touch-icon" href="/shared/icons/life/apple-touch-icon.png">
  <link rel="manifest" href="/shared/icons/life/manifest.webmanifest">
  <meta name="theme-color" content="#0F6B63">
  <script src="/shared/boot.js"></script>
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/themes.generated.css">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="/shared/life.css">
  <link rel="stylesheet" href="/home.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><img class="brand-logo" src="/shared/logos/life.svg" alt=""><span><b>Life</b><small>生活应用套件 · 融合页</small></span></a><span class="spacer"></span><div id="theme-controls" class="theme-controls"></div></header>
  <main class="app fusion">
    <section class="fusion-hero">
      <div>
        <div class="eyebrow">LIFE FUSION · 16 APPS</div>
        <h1>把生活摆成<br>你顺手的样子。</h1>
        <p>每款应用仍独立运行、独立存数据。融合页只做入口与状态；卡片位置和大小留在本机。</p>
      </div>
      <div class="fusion-actions">
        <button class="btn btn-primary" id="refresh">↻ 刷新状态</button>
        <a class="btn" href="/rhythm">跨应用节律 →</a>
        <a class="btn" href="/api/export">导出全部</a>
        <label class="btn">导入全部<input id="import-all" type="file" accept="application/json" hidden></label>
        <button class="btn" id="reset-layout">重置布局</button>
        <span id="online" class="hint">检查中…</span>
      </div>
    </section>
    <div class="fusion-toolbar">
      <div class="fusion-search"><input id="search" type="search" placeholder="搜索应用、功能…"><div id="filters" class="filters"></div></div>
      <p class="layout-hint">拖动左上角手柄移动 · 拖右下角缩放 · 布局保存在本机</p>
    </div>
    <div id="board" class="fusion-board" aria-label="应用空间"></div>
    <footer class="home-foot">Life 3.7.3 · 融合页 · <a href="/api/apps">应用清单</a> · 12 列自由空间</footer>
  </main>
  <script type="module" src="/home.js"></script>
</body>
</html>
