<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>慢慢记 · 本地记账</title>
  <script>
    (() => {
      const modes = ['system', 'light', 'dark'];
      const variants = { paper: ['paper', 'night'], retro: ['retro-paper', 'retro-crt'], cassette: ['cassette-daylight', 'cassette-amber'], atompunk: ['atompunk-chrome', 'atompunk-alert'], material: ['material-3', 'material-3-dark'], tailwind: ['tailwind-paper', 'tailwind'], carbon: ['carbon', 'carbon-night'] };
      let mode = 'system', family = 'paper';
      try { const m = localStorage.getItem('lrds-theme'); if (modes.includes(m)) mode = m; const f = localStorage.getItem('manmanji-family'); if (variants[f]) family = f } catch {}
      const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = mode;
      document.documentElement.dataset.style = variants[family][dark ? 1 : 0];
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/themes.generated.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/dashboard">
      <span class="brand-mark">慢</span>
      <span><b>慢慢记</b><small>MANMANJI · LOCAL LEDGER</small></span>
    </a>
    <nav class="nav" id="nav">
      <button data-view="dashboard">总览</button>
      <button data-view="ledger">流水</button>
      <button data-view="accounts">账户</button>
      <button data-view="budgets">预算</button>
      <button data-view="invoices" data-pack="freelance">发票</button>
      <button data-view="reports">报表</button>
      <button data-view="settings">设置</button>
    </nav>
    <div class="top-actions">
      <span class="sync-note">仅本机 · 自动保存</span>
      <label class="top-select-wrap"><span>风格</span><select id="theme-select" class="top-select" aria-label="风格主题"></select></label>
      <div class="mode-switch" id="mode-switch" role="group" aria-label="外观">
        <button type="button" data-mode="system" title="跟随系统" aria-label="跟随系统">◐</button>
        <button type="button" data-mode="light" title="浅色" aria-label="浅色">☀</button>
        <button type="button" data-mode="dark" title="深色" aria-label="深色">☾</button>
      </div>
      <button class="btn btn-primary" id="quick-add">记一笔</button>
    </div>
  </header>
  <main id="app" class="app"></main>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="modal" class="modal">
    <form id="modal-form">
      <div class="modal-head"><div><small id="modal-kicker">NEW</small><h2 id="modal-title">标题</h2></div><button type="button" class="icon-btn" data-close>✕</button></div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-foot"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn btn-primary" id="modal-submit">保存</button></div>
    </form>
  </dialog>
  <script src="/app.js" type="module"></script>
</body>
</html>
